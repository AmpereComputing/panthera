name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python formatting dependencies
        run: python -m pip install ruff
      - name: Check formatting
        run: make check-format

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-26.04
    needs:
      - format
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux/lib/pkgconfig
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install vcpkg build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf-archive ccache gcc-13 g++-13 gdb
      - name: Install QEMU plugin SDK
        run: |
          qemu_plugin_sdk="$RUNNER_TEMP/qemu-plugin-sdk"
          echo "QEMU_PLUGIN_SDK=$qemu_plugin_sdk" >> "$GITHUB_ENV"
          install -d "$qemu_plugin_sdk/include"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/AmpereComputing/tracing-qemu/39724d94fbdba2200df959955fd49aec2b9e730b/include/qemu/qemu-plugin.h \
            --output "$qemu_plugin_sdk/include/qemu-plugin.h"
          echo "3debf1ca2867539c90470ce315a1fcf05dbe9f018e99da0b0d25551dee9b7eb5  $qemu_plugin_sdk/include/qemu-plugin.h" | sha256sum --check
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-x64-linux-gcc13-${{ hashFiles('CMakeLists.txt', 'vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ccache-${{ runner.os }}-x64-linux-gcc13-
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-linux-gcc13-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
      - name: Install native dependencies
        run: $VCPKG_INSTALLATION_ROOT/vcpkg install --triplet x64-linux --overlay-ports="$GITHUB_WORKSPACE/vcpkg-ports"
      - name: Show SystemC ABI
        run: nm --demangle "$VCPKG_INSTALLED_DIR/x64-linux/lib/libsystemc.a" | grep -m 1 'sc_api_version_2_3_3_cxx201103L'
      - name: Install Python dependencies
        run: |
          python - <<'PY' | python -m pip install -r /dev/stdin
          import tomllib

          with open("pyproject.toml", "rb") as pyproject_file:
              project = tomllib.load(pyproject_file)["project"]

          print("\n".join(project["dependencies"] + project["optional-dependencies"]["dev"]))
          PY
      - name: Run unit tests
        run: |
          make \
            NPROC=4 CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_INSTALLED_DIR=$VCPKG_INSTALLED_DIR -DPython3_EXECUTABLE=$(command -v python) -DQEMU_ROOT=$QEMU_PLUGIN_SDK" \
            unit-test
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
