name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python formatting dependencies
        run: python -m pip install ruff
      - name: Check formatting with clang-format 21
        run: make CLANG_FORMAT=clang-format-21 check-format

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-26.04
    needs:
      - format
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux/lib/pkgconfig
      CMAKE_ARGS: >-
        -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install vcpkg build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf-archive
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Install native dependencies
        run: $VCPKG_INSTALLATION_ROOT/vcpkg install --triplet x64-linux
      - name: Install Python dependencies
        run: |
          python - <<'PY' | python -m pip install -r /dev/stdin
          import tomllib

          with open("pyproject.toml", "rb") as pyproject_file:
              project = tomllib.load(pyproject_file)["project"]

          print("\n".join(project["dependencies"] + project["optional-dependencies"]["dev"]))
          PY
      - name: Run unit tests
        run: make unit-test
