[tox]
requires =
    tox>=4
env_list = lint, py311

[testenv]
description = run unit tests
deps =
    pytest>=7
    pytest-cov
commands =
    pytest {posargs:tests}

[testenv:lint]
description = run linters
skip_install = true
deps =
	flake8
commands =
	flake8 {posargs:src/ampere/xlat}
