# This file has two related dictionaries in it:
# unit_defaults: specifies the default values to apply to each op definition (below) if no value is supplied.
# ops: specifies information about each op by mnemonic.  Op fields are as follows:
#   unit: bu, iu, ld, st, fsu, or nop.
#   opcode: an integer.  Usually unique within each unit, but some opcodes are aliased if the IDR needs to distinguish them,
#     but the execution unit does not.
#   opcode_mask: specifies which bits of the opcode (before shifting) are important.  The rest are don't care.
#   opcode_shift: specifies how much the opcode is shifted within the IDR's internal opcode bus (not externally visible).
#   alias: specifies whether the op is an alias of another op with the same opcode.  For a given unit and opcode, exactly one
#     op is not an alias.  Note that a non-aliased op has no alias property at all (e.g. alias is missing rather than False).
#   can_skip: indicates whether the load op can be issued ahead of older load ops.
#   can_be_skipped: indicates whether the load op allows younger load ops to be issued ahead of it.
#   size: indicates whether the op's sf flag is restricted to 32-bit or 64-bit operation
#     from_inst allows the op to get its size from the translation or from the instruction's sf field
#   [reg]s: a list indicate the presence and order of dest, src1, src2, and imm (if the immediate is not src1/src2).
#   dest_type: dest, src, dest/src, vdest, or vdest/vsrc.
#   src1_type, src2_type: [reg], imm, reg/imm, or vreg.
#   src1_zext, src2_zext: indicates whether the source is zero-shift_extended from 32 bits before use.
#     dont_care means that it doesn't matter if the source is zero shift_extended because fewer than 32 bits are used in any case
#     by_size is equivalent to False for 64-bit ops, dont_care for 32-bit ops
#   imm_width: specifies how many bits of immediate matter to execution.  The rest are don't care.
#     by_size is equivalent to the maximum immediate width for 64-bit ops, 32 for 32-bit ops
#   imm_fields: if specified, this indicates the bit positions in the dispatched immediate to which the translated immediate is
#     copied.  E.g. imm_fields: [12:6,32:27] means that imm[5:0] are dispatched in bits 32:27 instead of 5:0.
#     Any bit positions not specified in imm_fields are implicitly don't-care.
#     All specified bit positions must be less than imm_width.
#   prod: Indicates which flags are produced if flags are produced: NZCV, CPSR.NZCV, NZ+, NZC+, NZCC+, or "".
#     NZCV means that all 4 status flags are produced.
#     CPSR.NZCV is equivalent to NZCV, but CPSR.NZCV is used in fsu_ops.yaml.  An FSU op with CPSR.NZCV _always_ produces flags.
#     NZ+ means that the C and V flags are copied from the old flags.
#     NZC+ means that the V flag is copied from the old flags.
#     NZCC+ means that the V flag is copied from the old flags, as well as the C flag if the shift amount is zero.
#     Also, Q or GE indicate production independent of setflags.
#   cons: Indicates which flags are consumed [reg]ardless of condition: C, GE, or "".
#   cond: If present, indicates that the op has a fixed condition, independent of the instruction cond field.
#     The value indicates the condition: EQ or NE.
#   lat: The latency of the op (IXU only): 1, 2, 1or2, 4, 5, or div.
#     For latency 1or2, the choice of 1 or 2 is made based on other aspects of the op.
#   ixa: Whether the op is permitted in the IXA pipe: True, False, or Maybe.
#     For ixa = Maybe, the choice is made outside the decoder based on the op details (generally the same choice as for lat 1or2).
#     [reg]ardless of the ixa value, the op is excluded from IXA if it produces flags or in certain cases if it is conditional.
#   br_pred: If present, indicates that an instruction ending with the op contains a predictable branch
#   br_direct: If present, indicates that the predictable branch is direct (not indirect)
#   br_call: If present, indicates that the predictable branch is a call (branch and link)
#   br_return: If present, indicates that the predictable branch is a procedure return
#   mem_width: specifies data access size for ld and st ops, in bytes. 1, 2, 4, 8, 0
#   align_bound: specifies required address alignement boundary, in bytes. 1, 2, 4, 8, 16, 32
#   align_check: specifies address alignement check. none, sctlra, always
#   desc: A short description of the op.
