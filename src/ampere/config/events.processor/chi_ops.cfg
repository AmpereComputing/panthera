+count
-e sys.soc_0.core_#.send_req/chi_req_opcode/allow_retry
-e sys.soc_0.iorinjector_#.send_req/chi_req_opcode/allow_retry
-e sys.soc_0.core_#.send_rsp/chi_rsp_opcode/data_pull
-e sys.soc_0.core_#.send_snp/chi_snp_opcode
-e sys.soc_0.core_#.send_dat/chi_dat_opcode
-e sys.soc_0.core_#.recv_req/chi_req_opcode
-e sys.soc_0.core_#.send_rsp/chi_rsp_opcode/data_pull
-e sys.soc_0.core_#.recv_snp/chi_snp_opcode
-e sys.soc_0.core_#.recv_dat/chi_dat_opcode
-e sys.soc_0.core_#.l2c.send_req/chi_req_opcode/allow_retry
-e sys.soc_0.core_#.l2c.send_rsp/chi_rsp_opcode
-e sys.soc_0.core_#.l2c.send_snp/chi_snp_opcode
-e sys.soc_0.core_#.l2c.send_dat/chi_dat_opcode
-e sys.soc_0.core_#.l2c.recv_req/chi_req_opcode/allow_retry
-e sys.soc_0.core_#.l2c.recv_snp/chi_snp_opcode
-e sys.soc_0.core_#.l2c.recv_dat/chi_dat_opcode
-e sys.soc_0.p*ha_#.recv_req/chi_req_opcode/allow_retry
-e sys.soc_0.cmc_#.recv_req/chi_req_opcode/allow_retry
-e sys.soc_0.cmc_#.send_dat
-e sys.soc_0.cmc_#.recv_dat


# Rename RTL core events to injectors equivalents.  Remove l2c component
+rename
-r (sys.soc_0.core_#).l2c(.send_req/chi_req_opcode/allow_retry)=$1$2
-r (sys.soc_0.core_#).l2c(.send_rsp/chi_rsp_opcode)=$1$2
-r (sys.soc_0.core_#).l2c(.send_snp/chi_snp_opcode)=$1$2
-r (sys.soc_0.core_#).l2c(.send_dat/chi_dat_opcode)=$1$2
-r (sys.soc_0.core_#).l2c(.recv_req/chi_req_opcode)=$1$2
-r (sys.soc_0.core_#).l2c(.recv_snp/chi_snp_opcode)=$1$2
-r (sys.soc_0.core_#).l2c(.recv_dat/chi_dat_opcode)=$1$2

# Rename RTL cmc to panthera equivalent
+rename
-r sys.soc_0.cmc_(*)=sys.soc_0.memory_$1

+rename
-r (*)/chi_req_opcode:(*)/*.(allow_retry:#)=$1/$2/$3

+rename
-r (*)/chi_rsp_opcode:(*)=$1/$2
-r (*)/chi_rsp_opcode:(*)/*.(data_pull:#)=$1/$2/$3

+rename
-r (*)/chi_snp_opcode:(*)=$1/$2

+rename
-r (*)/chi_dat_opcode:(*)=$1/$2
