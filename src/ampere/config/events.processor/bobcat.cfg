+count
-e start_transaction
-e end_transaction
-e *
-e *.bpu.br_train/br_mispredicted/br_btb_miss/br_type
-e *.bpu.br_dispatch/br_btb_miss/br_rsb_hit/br_ittage_hit/br_type
-e *.bpu.br_dispatch/br_miss_all
-e *.bpu.br_recover/br_btb_miss/br_rsb_hit/br_ittage_hit/br_type
-e *.bpu.br_recover/br_miss_all
-e *.bpu.pmu/event
-e *.bpu.ld.pmu/event

+rename
-r (*).access/\1.hit:1=$1.hit
-r (*).bpu.br_train/\1.bpu.br_type:UNCONDITIONAL_DIRECT/\1.bpu.br_use_alternate:1=$1.bpu.indirect_alternate
-rl (*).bpu.br_train/\1.bpu.br_mispredicted:0/\1.bpu.br_btb_miss:0/\1.bpu.br_type:(*)=$1.branch_predict_$2
-rl (*).bpu.br_train/\1.bpu.br_mispredicted:1/\1.bpu.br_btb_miss:0/\1.bpu.br_type:(*)=$1.branch_mispredict_$2
-c (*).bpu.br_dispatch/\1.bpu.br_btb_miss:0/\1.bpu.br_rsb_hit:0/\1.bpu.br_ittage_hit:0/\1.bpu.br_type:CONDITIONAL_DIRECT=$1.pmu.bpu_conditional_branch_hit_btb
-c (*).bpu.tage.btb.update=$1.pmu.bpu_btb_update

+sum
(*).bpu.br_train/\1.bpu.br_mispredicted:1/\1.bpu.br_btb_miss:1/\1.bpu.br_type:*=$1.branch_mispredict_btb_miss
(*).bpu.br_dispatch/\1.bpu.br_btb_miss:0/\1.bpu.br_rsb_hit:*/\1.bpu.br_ittage_hit:*/\1.bpu.br_type:*=$1.pmu.bpu_hit_btb
(*).bpu.br_dispatch/\1.bpu.br_btb_miss:0/\1.bpu.br_rsb_hit:*/\1.bpu.br_ittage_hit:1/\1.bpu.br_type:*=$1.pmu.bpu_hit_indirect_predictor
(*).bpu.br_dispatch/\1.bpu.br_btb_miss:0/\1.bpu.br_rsb_hit:1/\1.bpu.br_ittage_hit:*/\1.bpu.br_type:*=$1.pmu.bpu_hit_rsb
(*).bpu.br_dispatch/\1.bpu.br_btb_miss:1/\1.bpu.br_rsb_hit:*/\1.bpu.br_ittage_hit:*/\1.bpu.br_type:(UNCONDITIONAL_|CALL_|RETURN)*=$1.pmu.bpu_unconditional_branch_miss_btb
(*).bpu.br_dispatch/\1.bpu.br_miss_all:1=$1.pmu.bpu_branch_no_hit
(*).bpu.br_recover/\1.bpu.br_btb_miss:0/\1.bpu.br_rsb_hit:*/\1.bpu.br_ittage_hit:*/\1.bpu.br_type:(!NONE)*=$1.pmu.bpu_hit_btb_and_mispredict
(*).bpu.br_recover/\1.bpu.br_btb_miss:0/\1.bpu.br_rsb_hit:*/\1.bpu.br_ittage_hit:*/\1.bpu.br_type:CONDITIONAL_DIRECT=$1.pmu.bpu_conditional_branch_hit_btb_and_mispredict
(*).bpu.br_recover/\1.bpu.br_btb_miss:0/\1.bpu.br_rsb_hit:*/\1.bpu.br_ittage_hit:*/\1.bpu.br_type:(*_INDIRECT|RETURN)=$1.pmu.bpu_indirect_branch_hit_btb_and_mispredict
(*).bpu.br_recover/\1.bpu.br_btb_miss:*/\1.bpu.br_rsb_hit:1/\1.bpu.br_ittage_hit:*/\1.bpu.br_type:RETURN=$1.pmu.bpu_hit_rsb_and_mispredict
(*).bpu.br_recover/\1.bpu.br_btb_miss:0/\1.bpu.br_rsb_hit:0/\1.bpu.br_ittage_hit:*/\1.bpu.br_type:RETURN=$1.pmu.bpu_miss_rsb_and_mispredict
(*).bpu.br_recover/\1.bpu.br_miss_all:1=$1.pmu.bpu_no_prediction_mispredict
