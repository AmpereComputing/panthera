+count
-e *.cbusy.update

--accumulate *.cbusy.update/max_outstanding_requests
--accumulate *.cbusy.update/outstanding_requests
--accumulate *.cbusy.update/cbusy_idx
--accumulate *.cbusy.update/acc_cntr
--accumulate *.cbusy.update/retry

+rename
-r (*).cbusy.update/\1.cbusy.max_outstanding_requests=$1.cbusy.max_outstanding_requests
-r (*).cbusy.update/\1.cbusy.outstanding_requests=$1.cbusy.outstanding_requests
-r (*).cbusy.update/\1.cbusy.cbusy_idx=$1.cbusy.cbusy_idx
-r (*).cbusy.update/\1.cbusy.acc_cntr=$1.cbusy.acc_cntr
-r (*).cbusy.update/\1.cbusy.retry=$1.cbusy.retry
