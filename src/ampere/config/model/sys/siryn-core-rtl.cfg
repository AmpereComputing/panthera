# Config for RTL performance verification.
# This is against the DV model that has a bus model.
# We can also place defeatures in here.
#
sys.soc_0.clock_period 400ps
sys.soc_0.core_0.clock_period 400ps
sys.soc_0.memory_0.bw_latency_data [{"write_percentage": 1.1, "bw_latency": [[100, 31]]}]

# Check that no cache line is preloaded twice and that no way is overfilled.
# Either of these indicate an issue with our cache preloading.
sys.soc_0.core_0.l2c.check_warmstart_overruns true

# No SLC
~sys\.soc_0\.homenode_[0-9]+\.enable_slc false

# L2 prefetcher "quick train" mode, corresponding to bop_cfg_quick.knobs
sys.soc_0.core_0.l2c.prefetcher:append-cfg ../core/furiosa/bop_quick_train.cfg
