sys.soc_0.type SocForCorePV
sys.soc_0.mem_responder.dat_delay 250  # fixed latency for data return (reads)
sys.soc_0.mem_responder.rsp_delay 75   # fixed latency for resp return (writes)
sys.soc_0.data_bus_width 512

sys.soc_0.core_0:cfg ../core/connor-ai/connor-ai-linux.cfg

sys.soc_0.core_0.clock_period 400ps
sys.soc_0.clock_period 400ps

# Disable perfect modes
sys.soc_0.core_0.lsu.dl1tlb.enable_perfect_mode_user false
sys.soc_0.core_0.l2c.enable_perfect_mode_user false
sys.soc_0.core_0.bpu.perfect_el0 false
