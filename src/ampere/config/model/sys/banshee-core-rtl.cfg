sys.soc_0:cfg ../soc/bn-core-rtl.cfg

# Check that no cache line is preloaded twice and that no way is overfilled.
# Either of these indicate an issue with our cache preloading.
sys.soc_0.core_0.l2c.check_warmstart_overruns true

# Disable L2P just for the beginning of PV
# sys.soc_0.core_0.l2c.prefetcher.type L2P_None

# L2 prefetcher "quick train" mode, corresponding to bop_cfg_quick.knobs
sys.soc_0.core_0.l2c.prefetcher:append-cfg ../core/ripley/bop_quick_train.cfg

# Current RTL VIP does not support returning unique lines in response to requests for shared
#sys.soc_0.core_0.l2c.enable_optimistic_unique false

# Do our best to mimic RTL speculation
sys.soc_0.core_0.speculative_memory_image true

# Disable CBUSY throttling
sys.soc_0.core_0.l2c.cbusy.enable false

