#
# This is meant to be a minimal TMEM model which provides unlimited bandwidth with low latency (~50 cyc load-to-use)
#
sys.soc_0.type SocForCorePV
sys.soc_0.clock_period 500ps
sys.soc_0.mem_responder.dat_delay 20  # fixed latency for data return (reads)
sys.soc_0.mem_responder.rsp_delay 7   # fixed latency for resp return (writes)
sys.soc_0.data_bus_width 512

sys.soc_0.core_0:cfg ../core/connor-ai/connor-ai-user.cfg
