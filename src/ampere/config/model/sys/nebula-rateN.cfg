sys.soc_0:cfg ../soc/nebula-quad2-one-core.cfg

# Use the memory model tuned for core studies
~sys.soc_0.memory_[0-9]+:cfg ../mc/sn-mc-rateN.cfg

# Use a scaled down SLC for core studies
#
# Nebula will not have an SLC, but for now setting it to the size of the L3, until we have real FlexCache modeling
#
# The default L2/L3 split for the 4MB cache is 3M L2 and 1M L3. Since this is the rate-N config, we get
# one core worth of L3: 1MB total / 16 home nodes = 64K per HN. We also set the associativity to 4 to match the
# number of ways of the core cache a 1MB L3 would get.
~sys.soc_0.homenode_[0-9]+.slc.array.ways 4
~sys.soc_0.homenode_[0-9]+.slc.array.size 65536
~sys.soc_0.homenode_[0-9]+.tracker.size 3
