sys.soc_0:cfg ../soc/domino-quad2-one-core.cfg

# Use the memory model tuned for core studies
~sys.soc_0.memory_[0-9]+:cfg ../mc/sn-mc-study.cfg

# Use a scaled down SLC for core studies
#
# Domino will not have an SLC, but for now setting it to the size of the L3, until we have real FlexCache modeling
#
# The default L2/L3 split for the 3.5MB cache is 2.5M L2 and 1.0M L3. Since this is the rate-N/2 config, we get
# two cores worth of L3: 2MB total / 16 home nodes = 128K per HN. We also set the associativity to 4 to match the
# number of ways of the core cache a 1MB L3 would get.
~sys.soc_0.homenode_[0-9]+.slc.array.ways 4
~sys.soc_0.homenode_[0-9]+.slc.array.size 131072
~sys.soc_0.homenode_[0-9]+.tracker.size 6
