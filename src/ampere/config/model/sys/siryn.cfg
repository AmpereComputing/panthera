sys.soc_0:cfg ../soc/sn-quad2-one-core.cfg

# Use the Siryn memory model tuned for core studies
~sys.soc_0.memory_[0-9]+:cfg ../mc/sn-mc-study.cfg
# Update cbusy config for study:
sys.soc_0.core_0.l2c.cbusy.throttle_min 19

# Use a scaled down SLC for core studies
~sys.soc_0.homenode_[0-9]+.slc.array.size 32768
~sys.soc_0.homenode_[0-9]+.tracker.size 6

