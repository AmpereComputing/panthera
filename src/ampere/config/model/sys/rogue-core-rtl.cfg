#
# This is a defeature config. The parameters below hold the "old" values for
# all the knobs, to make Trinity look like Ripley. When each of these ECOs
# have been implemented in RTL, just delete the entire block of parameters
# associated with that ECO. That way this file will then match what is
# implemented in RTL. At the end of performance verification, all the lines
# below here should be deleted. If there are parameters below this line, that
# means PV is not yet complete!

