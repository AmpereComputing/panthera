sys.soc_0.type SocForCorePV
sys.soc_0.mem_responder.dat_delay 78  # fixed latency for data return (reads)
sys.soc_0.mem_responder.rsp_delay 68  # fixed latency for resp return (writes)
sys.soc_0.core_0:cfg ../core/trinity/trinity.cfg
sys.soc_0.core_0.clock_period 400ps
sys.soc_0.clock_period 400ps

sys.soc_0.system_address_map.ddr_snr_mode 1

sys.soc_0.system_address_map.regions {
    "ddr_0": {
        "base": 0,
        "size": 35184372088832
    }
}

sys.soc_0.core_0.l2c.sam.type RN_SAM
sys.soc_0.core_0.l2c.sam.system_address_map.connect sys.soc_0.system_address_map
sys.soc_0.core_0.l2c.sam.tgt_lut [[0,0,0,1]]

# Check that no cache line is preloaded twice and that no way is overfilled.
# Either of these indicate an issue with our cache preloading.
sys.soc_0.core_0.l2c.check_warmstart_overruns true

# RTL warmstart does not change the RRIP state, so re-initialize it to match
sys.soc_0.core_0.l2c.reset_lru_after_warmup true

# L2 prefetcher "quick train" mode, corresponding to bop_cfg_quick.knobs
sys.soc_0.core_0.l2c.prefetcher:append-cfg ../core/trinity/bop_quick_train.cfg

# Do our best to mimic RTL speculation
sys.soc_0.core_0.speculative_memory_image true

# Emulate wrong path instructions
sys.soc_0.core_0.use_wrong_path_emulation true

# Disable CBUSY throttling
sys.soc_0.core_0.l2c.cbusy.enable false

# setting for PV (disable training throttling)
sys.soc_0.core_0.lsu.prefetcher.gretch:append-cfg ../core/trinity/gretch_no_throttle.cfg

