sys.soc_0:cfg ../soc/rg-quad2-one-core.cfg

# Use the memory model tuned for core studies
~sys.soc_0.memory_[0-9]+:cfg ../mc/sn-mc-study.cfg

# Use a scaled down SLC for core studies
# New Rogue SLC size is 512KB per core, or 32KB per HN. Since this is the rate-N-over-2 config, we set it to 1MB per core (64k per HN).
~sys.soc_0.homenode_[0-9]+.slc.array.size 65536
~sys.soc_0.homenode_[0-9]+.tracker.size 6

