# This is a degenerate mesh configuration intended for integration testing of the core.
# It has only a single mesh node with the core and memory devices directly attached.

mesh.size_x 1
mesh.size_y 1
mesh.devices 4

devices [
    { "type": "Core",     "position": [0, 0, 0, 0] },
    { "type": "HomeNode", "position": [0, 0, 1, 0] },
    { "type": "Memory",   "position": [0, 0, 2, 0] }
]

system_address_map.ddr_snr_mode 1

system_address_map.regions {
    "ddr_0": {
        "base": 0,
        "size": 8796093022208
    }
}

# Mesh node credits for all channels, all directions
~mesh\.rtr_.*\.req_[snew]\.size 8
~mesh\.rtr_.*\.snp_[snew]\.size 8
~mesh\.rtr_.*\.rsp[01]_[snew]\.size 8
~mesh\.rtr_.*\.dat[01]_[snew]\.size 8
~mesh\.rtr_.*\.req_p[0-9]+\.size 8
~mesh\.rtr_.*\.snp_p[0-9]+\.size 8
~mesh\.rtr_.*\.rsp[01]_p[0-9]+\.size 8
~mesh\.rtr_.*\.dat[01]_p[0-9]+\.size 8

~X0_Y0_P[012]_.*_tx_0.capacity 8

homenode_0:cfg ../mesh/hnf-1M_slc.cfg
homenode_0.sam.type RN_SAM
homenode_0.sam.system_address_map.connect $(prefix).system_address_map
homenode_0.sam.tgt_lut [[0, 0, 2, 0]]

core_0.l2c.sam.type RN_SAM
core_0.l2c.sam.system_address_map.connect $(prefix).system_address_map
core_0.l2c.sam.tgt_lut [[0, 0, 1, 0]]

# Simple fixed latency memory config
memory_0.bw_latency_data [{"write_percentage": 1.1, "bw_latency": [[100, 2]]}]
