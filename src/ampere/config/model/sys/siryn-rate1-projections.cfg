# Configuration to simulate rate-1 for single Furiosa on unloaded Siryn SoC

# Include Furiosa core performance ECOs in projections
cfg ../../core/config/siryn-perf-eco.cfg

# 32 MB SLC for Rate 1 projection simulations
soc.mesh.enable_slc true
soc.mesh.mesh_slc_request.latency 36
soc.mesh.mesh_slc_response.latency 36
soc.mesh.slc.array.size 33554432
soc.mesh.slc.array.line_size 64
soc.mesh.slc.array.ways 16

# Use the maintained fixed generic memory model.
:cfg ../mc/sn-mc-fixed.cfg

# L2C single-core mode
soc.core.l2c.enable_optimistic_unique true
