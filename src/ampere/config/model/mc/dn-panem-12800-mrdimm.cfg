use_chp true
clock_period 625ps
max_reads 256
max_writes 128
chp.rrt_size 64  # Read Request Tracker size
chp.wrt_size 64  # Write Request Tracker size
chp.prt_size 32  # Prefetch Request Tracker size
chp.rdt_size 256 # Read Data Tracker size
chp.request_pipe.enqueue_request.index 4
chp.split_cbusy true
chp.cbusy.enable true
chp.cbusy.throttle_start 1  # Fake. Should not be needed for completer-only CBusy
chp.cbusy.highest_cbusy 6
chp.cbusy.window 64
chp.cbusy.phase_cycles 16
chp.cbusy.completer_lut [0, 0.4, 0.9, 1.0, 1.1, 1.2, 2.0, 100]
chp.cbusy.occupancy_busyness [41, 46, 53, 61]
chp.cbusy.occupancy_cbusy_value [0, 3, 4, 5, 6]
chp.cbusy.threshold 32
chp.split_cbusy true
chp.write_cbusy.enable true
chp.write_cbusy.throttle_start 1  # Fake. Should not be needed for completer-only CBusy
chp.write_cbusy.highest_cbusy 6
chp.write_cbusy.window 64
chp.write_cbusy.phase_cycles 16
chp.write_cbusy.completer_lut [0, 0.4, 0.9, 1.0, 1.1, 1.2, 2.0, 100]
chp.write_cbusy.occupancy_busyness [41, 46, 53, 61]
chp.write_cbusy.occupancy_cbusy_value [0, 3, 4, 5, 6]
chp.write_cbusy.threshold 32
enforce_bandwidth_limits false
use_request_latency_curve true
bandwidth_overuse_penalty 1.0
