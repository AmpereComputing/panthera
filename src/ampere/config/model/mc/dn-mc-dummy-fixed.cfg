# Large BW, "instantaneous latency" memory config
# for dummy meshinjector reads in Connor setup
max_reads 1024
max_writes 1024
cbusy.c_threshold_high 55
cbusy.c_threshold_mid 32
cbusy.c_threshold_low 1
max_bandwidth 100000
high_bandwidth 90000
low_bandwidth 80000
bw_latency_data [
  {
   "write_percentage": 1.0,
   "bw_latency": [[1000, 0.00001]]
  }
]
