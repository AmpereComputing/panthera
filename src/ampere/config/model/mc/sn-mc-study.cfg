cfg sn-mc-rateN.cfg

# Tune the memory model for running core studies
# This has a BW/latency curve that has the same latency at
# 2X the bandwidth as the rateN BW/latency curve.

# The rateN curve delivers a peak of 1.6GB/s. The actual bandwidth for Nebula is 3.072GB/s, and we
# want twice that for rate N/2, so scale everything by 2 * 3.072/1.6 = 3.84.
bandwidth_scale_factor 3.84
