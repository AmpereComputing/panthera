+channels [
    { "tgt": [4, 4, 1, 0], "channel": 1 },
    { "tgt": [4, 6, 1, 0], "channel": 1 },
    { "tgt": [5, 5, 0, 0], "channel": 1 },
    { "tgt": [5, 5, 1, 0], "channel": 1 },
    { "tgt": [5, 7, 0, 0], "channel": 1 },
    { "tgt": [5, 7, 1, 0], "channel": 1 },
    { "tgt": [6, 4, 0, 0], "channel": 1 },
    { "tgt": [6, 4, 1, 1], "channel": 1 },
    { "tgt": [6, 6, 0, 0], "channel": 1 },
    { "tgt": [6, 6, 1, 0], "channel": 1 },
    { "tgt": [7, 6, 0, 0], "channel": 1 },
    { "tgt": [7, 6, 1, 0], "channel": 1 }
]

# Some vertical connections are two cycles
~mesh\.X[4-7]_Y4_to_X[4-7]_Y5_.*\.latency 2
~mesh\.X[4-7]_Y5_to_X[4-7]_Y6_.*\.latency 2
~mesh\.X[4-7]_Y6_to_X[4-7]_Y7_.*\.latency 2

# Center horizontals are four cycles
~mesh\.X1_Y[4-8]_to_X2_Y[4-8]_.*\.latency 4

# And weirdly, column 2 to 3 is three cycles
~mesh\.X2_Y[4-8]_to_X3_Y[4-8]_.*\.latency 3

############################################################
# Credit gunk
#

# Note: credits are defined in the *target* node.

# By default, 2 credits for the cardinal directions to cover
# a 1 cycle latency.
~mesh\.rtr_X[4-7]_Y[4-8]\.req_[snew]\.size 2
~mesh\.rtr_X[4-7]_Y[4-8]\.snp_[snew]\.size 2
~mesh\.rtr_X[4-7]_Y[4-8]\.rsp[01]_[snew]\.size 2
~mesh\.rtr_X[4-7]_Y[4-8]\.dat[01]_[snew]\.size 2

# Not sure about device ports...trying 4 credits, but perhaps
# it should vary by channel.
~mesh\.rtr_X[4-7]_Y[4-8]\.req_p[0-9]+\.size 4
~mesh\.rtr_X[4-7]_Y[4-8]\.snp_p[0-9]+\.size 4
~mesh\.rtr_X[4-7]_Y[4-8]\.rsp[01]_p[0-9]+\.size 4
~mesh\.rtr_X[4-7]_Y[4-8]\.dat[01]_p[0-9]+\.size 4

# To account for the 2 cycle vertical latency, we have 4 credits
# for rows 5-7 coming from the south, and 4 credits for rows 4-6
# coming from the north.
#
~mesh\.rtr_X[4-7]_Y[567]\.req_s\.size 4
~mesh\.rtr_X[4-7]_Y[567]\.snp_s\.size 4
~mesh\.rtr_X[4-7]_Y[567]\.rsp[01]_s\.size 4
~mesh\.rtr_X[4-7]_Y[567]\.dat[01]_s\.size 4

~mesh\.rtr_X[4-7]_Y[456]\.req_n\.size 4
~mesh\.rtr_X[4-7]_Y[456]\.snp_n\.size 4
~mesh\.rtr_X[4-7]_Y[456]\.rsp[01]_n\.size 4
~mesh\.rtr_X[4-7]_Y[456]\.dat[01]_n\.size 4

# And now for those center horizontals, which need 8 credits
~mesh\.rtr_X2_Y[4-8]\.req_w\.size 8
~mesh\.rtr_X2_Y[4-8]\.snp_w\.size 8
~mesh\.rtr_X2_Y[4-8]\.rsp[01]_w\.size 8
~mesh\.rtr_X2_Y[4-8]\.dat[01]_w\.size 8

~mesh\.rtr_X1_Y[4-8]\.req_e\.size 8
~mesh\.rtr_X1_Y[4-8]\.snp_e\.size 8
~mesh\.rtr_X1_Y[4-8]\.rsp[01]_e\.size 8
~mesh\.rtr_X1_Y[4-8]\.dat[01]_e\.size 8

# Finally, the weird column 2 to 3
~mesh\.rtr_X3_Y[4-8]\.req_w\.size 6
~mesh\.rtr_X3_Y[4-8]\.snp_w\.size 6
~mesh\.rtr_X3_Y[4-8]\.rsp[01]_w\.size 6
~mesh\.rtr_X3_Y[4-8]\.dat[01]_w\.size 6

~mesh\.rtr_X2_Y[4-8]\.req_e\.size 6
~mesh\.rtr_X2_Y[4-8]\.snp_e\.size 6
~mesh\.rtr_X2_Y[4-8]\.rsp[01]_e\.size 6
~mesh\.rtr_X2_Y[4-8]\.dat[01]_e\.size 6

# CPX
~cpx_X[4-7]_Y[4-8]_P[01]\.dev_[0-9]+\.req_in\.size 8
~cpx_X[4-7]_Y[4-8]_P[01]\.dev_[0-9]+\.snp_in\.size 8
~cpx_X[4-7]_Y[4-8]_P[01]\.dev_[0-9]+\.dat_in\.size 8
~cpx_X[4-7]_Y[4-8]_P[01]\.dev_[0-9]+\.rsp[01]_in\.size 8

~cpx_X[4-7]_Y[4-8]_P[01]\.mesh_req_in\.size 2
~cpx_X[4-7]_Y[4-8]_P[01]\.mesh_rsp[01]_in\.size 2
~cpx_X[4-7]_Y[4-8]_P[01]\.mesh_snp_in\.size 2
~cpx_X[4-7]_Y[4-8]_P[01]\.mesh_dat_in\.size 2

# Delays for device inputs in the routers.
~mesh\.rtr_X[0-9]+_Y[0-9]+\.req_decode_latency 2

# Override y then x routing for these router nodes.
# Note that device numbers are actually ignore for these.
mesh.rtr_X7_Y6.xy_overrides [
    {"src": [7, 7, 0, 0], "tgt": [6, 5, 1, 0]},
    {"src": [7, 7, 0, 0], "tgt": [5, 5, 1, 0]},
    {"src": [7, 7, 0, 0], "tgt": [4, 5, 1, 0]},
    {"src": [7, 7, 1, 0], "tgt": [6, 5, 1, 0]},
    {"src": [7, 7, 1, 0], "tgt": [5, 5, 1, 0]},
    {"src": [7, 7, 1, 0], "tgt": [4, 5, 1, 0]}
]

mesh.rtr_X7_Y7.xy_overrides [
    {"src": [7, 7, 0, 0], "tgt": [6, 6, 1, 0]},
    {"src": [7, 7, 0, 0], "tgt": [6, 5, 1, 0]},
    {"src": [7, 7, 0, 0], "tgt": [5, 6, 1, 0]},
    {"src": [7, 7, 0, 0], "tgt": [5, 5, 1, 0]},
    {"src": [7, 7, 0, 0], "tgt": [4, 6, 1, 0]},
    {"src": [7, 7, 0, 0], "tgt": [4, 5, 1, 0]},
    {"src": [7, 7, 1, 0], "tgt": [6, 6, 1, 0]},
    {"src": [7, 7, 1, 0], "tgt": [6, 5, 1, 0]},
    {"src": [7, 7, 1, 0], "tgt": [5, 6, 1, 0]},
    {"src": [7, 7, 1, 0], "tgt": [5, 5, 1, 0]},
    {"src": [7, 7, 1, 0], "tgt": [4, 6, 1, 0]},
    {"src": [7, 7, 1, 0], "tgt": [4, 5, 1, 0]}
]

# RDI

rdi_X0_Y7_P0.type RDI
rdi_X0_Y7_P1.type RDI

rdi_X0_Y7_P0:cfg rdi.cfg
rdi_X0_Y7_P1:cfg rdi.cfg

rdi_X0_Y7_P0.delay "10ns"
rdi_X0_Y7_P1.delay "10ns"
