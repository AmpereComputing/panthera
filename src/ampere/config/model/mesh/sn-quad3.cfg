    { "type": "HomeNode", "position": [5, 4, 0, 0] },
    { "type": "HomeNode", "position": [5, 4, 0, 1] },
    { "type": "HomeNode", "position": [5, 5, 0, 0] },
    { "type": "HomeNode", "position": [5, 5, 0, 1] },
    { "type": "HomeNode", "position": [5, 6, 0, 0] },
    { "type": "HomeNode", "position": [5, 6, 0, 1] },
    { "type": "HomeNode", "position": [5, 7, 0, 0] },
