    { "type": "Memory", "position": [7, 7, 1, 1], "prefix": "memory", "via": "rdi" },

    { "type": "MeshInjector", "prefix": "core", "position": [4, 4, 1, 0] },
    { "type": "MeshInjector", "prefix": "core", "position": [4, 4, 1, 1] },
    { "type": "MeshInjector", "prefix": "core", "position": [4, 5, 1, 0] },
