    { "type": "HomeNode", "position": [6, 5, 0, 0] },
    { "type": "HomeNode", "position": [6, 5, 0, 1] },
    { "type": "HomeNode", "position": [6, 6, 0, 0] },
    { "type": "HomeNode", "position": [6, 6, 0, 1] },
    { "type": "HomeNode", "position": [6, 7, 0, 0] },
    { "type": "HomeNode", "position": [6, 7, 0, 1] },

    { "type": "Memory", "position": [7, 7, 0, 0], "prefix": "memory", "via": "rdi" },
