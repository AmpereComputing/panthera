cfg sn-quad0.cfg
cfg sn-quad1.cfg
cfg sn-quad2.cfg
cfg sn-quad3.cfg

# inter-quadrant horizontal connections are 6 cycles (due to clock crossing)
~mesh\.X3_Y[0-9]+_to_X4_Y[0-9]+_.*\.latency 6
~mesh\.rtr_X3_Y[0-9]+\.req_e\.size 12
~mesh\.rtr_X3_Y[0-9]+\.snp_e\.size 12
~mesh\.rtr_X3_Y[0-9]+\.rsp[01]_e\.size 12
~mesh\.rtr_X3_Y[0-9]+\.dat[01]_e\.size 12
~mesh\.rtr_X4_Y[0-9]+\.req_w\.size 12
~mesh\.rtr_X4_Y[0-9]+\.snp_w\.size 12
~mesh\.rtr_X4_Y[0-9]+\.rsp[01]_w\.size 12
~mesh\.rtr_X4_Y[0-9]+\.dat[01]_w\.size 12

# inter-quadrant vertical connections are 7 cycles (due to clock crossing)
~mesh\.X[0-9]+_Y3_to_X[0-9]+_Y4_.*\.latency 7
~mesh\.rtr_X[0-9]+_Y3\.req_n\.size 14
~mesh\.rtr_X[0-9]+_Y3\.snp_n\.size 14
~mesh\.rtr_X[0-9]+_Y3\.rsp[01]_n\.size 14
~mesh\.rtr_X[0-9]+_Y3\.dat[01]_n\.size 14
~mesh\.rtr_X[0-9]+_Y4\.req_s\.size 14
~mesh\.rtr_X[0-9]+_Y4\.snp_s\.size 14
~mesh\.rtr_X[0-9]+_Y4\.rsp[01]_s\.size 14
~mesh\.rtr_X[0-9]+_Y4\.dat[01]_s\.size 14

