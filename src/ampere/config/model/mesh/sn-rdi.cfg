links 3
flits_per_dat_pkt 2
delay "10.415ns"

a_in_req.fifo.size 15
a_in_rsp0.fifo.size 8
a_in_rsp1.fifo.size 8
a_in_snp.fifo.size 8
a_in_dat.fifo.size 8

b_in_req.fifo.size 15
b_in_rsp0.fifo.size 15
b_in_rsp1.fifo.size 15
b_in_snp.fifo.size 8
b_in_dat.fifo.size 8

a_out_req_fifo_size 32
a_out_rsp0_fifo_size 32
a_out_rsp1_fifo_size 32
a_out_snp_fifo_size 32
a_out_dat_fifo_size 56

b_out_req_fifo_size 32
b_out_rsp0_fifo_size 64
b_out_rsp1_fifo_size 64
b_out_snp_fifo_size 32
b_out_dat_fifo_size 56

packer.rules [
    {"Dat": 1, "Crd": 1, "Links": [0,1,2]},
    {"Rsp": 2, "Crd": 3, "Links": [0,1,2]},
    {"Req": 2,           "Links": [0,1,2]},
    {"Req": 1, "Crd": 3, "Links": [0,1,2]},
    {"Snp": 1, "Crd": 2, "Links": [0,1,2]}
]
