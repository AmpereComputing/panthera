# A Kestrel Tile looks something like this:
#
#                         To/From Slice
#                               |
#     +---+---+---+---+         |
#     |   |   |   |   |         |
#     | C | C | C | C |         |
#     | o | o | o | o |         |
#     | r | r | r | r |         |
#     | e | e | e | e |         |        +----------------+
#     | 0 | 1 | 2 | 3 |         |        |                |
#     +---+---+---+---+         |        |      AICE      |
#     |     CPX       |         |        |                |
#     +---------------+         |        +----------------+
#             |                 |                |
#             \              -------             /
#              `----------- /       \ ----------'
#                          |   RTR   |
#                           \       /
#                            -------
#
# But of course the exact contents depends on the definition of `devices` below.
# The `position` is just a router port and device number; there is no "x, y"
# coordinate as there is in other SoC configuration files.
#
# The `agent_id` is actually relative. A Tile can be given an `agent_id_offset`
# parameter which will be added to each `agent_id`. This is so each agent can
# be uniquely numbered in the system.
#
devices [
    { "type": "MeshInjector", "position": [0, 0], "prefix": "core", "agent_id": 0 },
    { "type": "MeshInjector", "position": [0, 1], "prefix": "core", "agent_id": 1 },
    { "type": "MeshInjector", "position": [0, 2], "prefix": "core", "agent_id": 2 },
    { "type": "MeshInjector", "position": [0, 3], "prefix": "core", "agent_id": 3 },
    { "type": "MeshInjector", "position": [1, 0], "prefix": "aice", "agent_id": 4 }
]

~cpx_0.dev_[0-3]\.req_in.size 2
~cpx_0.dev_[0-3]\.rsp0_in.size 2
~cpx_0.dev_[0-3]\.snp_in.size 2
~cpx_0.dev_[0-3]\.dat_in.size 2

rtr.req_p0.size 2
rtr.rsp0_p0.size 2
rtr.rsp1_p0.size 2
rtr.snp_p0.size 2
rtr.dat0_p0.size 2

rtr.req_p1.size 2
rtr.rsp0_p1.size 2
rtr.rsp1_p1.size 2
rtr.snp_p1.size 2
rtr.dat0_p1.size 2

