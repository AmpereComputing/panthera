# Tracker config
num_sfv_entries 4
num_snp_entries 1
num_platinum_entries 1
num_gold_entries 4
num_iron_entries 86

# This establishes the SF pipeline length
main_pipe.access.index 10

# SF config
snoop_filter.sets 16384
snoop_filter.ways 16

# Phase Command Depth
pha_phase_cmd.capacity 16

# CBusy config
cbusy.enable true

cbusy.completer_lut [0, 0.4, 0.9, 1.0, 1.1, 1.2, 2.0, 100]

cbusy.requester_lut [-2, -1, 0, 2, 3, 4, 6, 20]
cbusy.threshold 48
cbusy.dscbusy [0, 0, 1, 1, 2, 2, 2, 3, 3, 4, 4, 5, 5, 5, 6, 6]
cbusy.throttle [96, 90, 84, 78, 72, 66, 60, 54, 48, 42, 36, 18, 12, 8, 4, 1]
cbusy.window 64
cbusy.phase_cycles 16
cbusy.highest_cbusy 6
cbusy.rho_max 15.0

cbusy.use_highest_cbusy false

# PHA CBT does not have retry_weight
cbusy.retry_weight 0

stash_with_hashing true
stash_target_table [13, 15, 12,  4,  7,  3,  9,  2, 13,  2, 14, 14,  8, 10,  9,  5,
                     1, 15, 12,  7,  0,  0,  6, 10,  1,  5, 11, 11,  8,  6,  4,  3,
                     7,  3,  9,  2,  1, 15, 12,  4,  8, 10,  9,  5,  1,  2, 14, 14,
                     0,  0,  6, 10, 13, 15, 12,  7,  8,  6,  4,  3, 13,  5, 11, 11]
