################################################################################
# HomeNode Configuration
#
# SF  - 2MB, 16 ways
# SLC - 1MB, 16 ways
################################################################################

# 9 cycle pipeline depth on the home node.
#
main_pipe.access.index 9

# SLC configuration
enable_slc true
slc.array.size 1048576
slc.array.line_size 64
slc.array.ways 16
slc.array.invalidate_duplicates_before_fill true

# SF configuration
snoop_filter.size 2097152
snoop_filter.line_size 64
snoop_filter.ways 16

# Tracker configuration
tracker.size 64
tracker.cbusy.c_threshold_high 60
tracker.cbusy.c_threshold_mid 48
tracker.cbusy.c_threshold_low 16
tracker.cbusy.throttle_max 64

# RCBusy configurations
rcbusy.type RCBusy
rcbusy.enable true
rcbusy.requester_lut [ -8, -8, 1, 8]
rcbusy.throttle [64, 60, 56, 52, 48, 44, 40, 36, 32, 28, 24, 20, 16, 12, 8, 4]
rcbusy.throttle_start 64
