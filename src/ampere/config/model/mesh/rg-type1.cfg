mesh.size_x 6
mesh.size_y 5
mesh.devices 4

# this needs to be set true because of the way the routing is done here
# If routing is done through txnid, then the subsequent packets would
# be routed through a different IDT connection and it would not have found an existing entry
# This only makes sense for packets going in the forward direction, for packets coming
# back, the routing is done with local id, so this logic is never active
~mesh\.rtr_X[0-5]_Y[0-4]\.lrt_index_with_tgt_id true

~mesh\.rtr_X[0-5]_Y[0-4]\.req_[snew]\.size 10
~mesh\.rtr_X[0-5]_Y[0-4]\.snp_[snew]\.size 10
~mesh\.rtr_X[0-5]_Y[0-4]\.rsp[01]_[snew]\.size 10
~mesh\.rtr_X[0-5]_Y[0-4]\.dat[01]_[snew]\.size 10

~mesh\.rtr_X[0-5]_Y[0-4]\.req_p[0-9]+\.size 8
~mesh\.rtr_X[0-5]_Y[0-4]\.snp_p[0-9]+\.size 8
~mesh\.rtr_X[0-5]_Y[0-4]\.rsp[01]_p[0-9]+\.size 8
~mesh\.rtr_X[0-5]_Y[0-4]\.dat[01]_p[0-9]+\.size 8

# All rtr ports in the North South direction have latency of 2
~mesh\.X[0-5]_Y0_to_X[0-5]_Y1_.*\.latency 2
~mesh\.X[0-5]_Y1_to_X[0-5]_Y2_.*\.latency 2
~mesh\.X[0-5]_Y2_to_X[0-5]_Y3_.*\.latency 2
~mesh\.X[0-5]_Y3_to_X[0-5]_Y4_.*\.latency 2

~mesh\.rtr_X[0-5]_Y[1-4]\.req_s\.size 6
~mesh\.rtr_X[0-5]_Y[1-4]\.snp_s\.size 6
~mesh\.rtr_X[0-5]_Y[1-4]\.rsp[01]_s\.size 6
~mesh\.rtr_X[0-5]_Y[1-4]\.dat[01]_s\.size 6

~mesh\.rtr_X[0-5]_Y[0-3]\.req_n\.size 6
~mesh\.rtr_X[0-5]_Y[0-3]\.snp_n\.size 6
~mesh\.rtr_X[0-5]_Y[0-3]\.rsp[01]_n\.size 6
~mesh\.rtr_X[0-5]_Y[0-3]\.dat[01]_n\.size 6

# Column 1 and 2 have latency of 3
~mesh\.X0_Y[0-4]_to_X1_Y[0-4]_.*\.latency 3

~mesh\.rtr_X0_Y[0-4]\.req_e\.size 8
~mesh\.rtr_X0_Y[0-4]\.snp_e\.size 8
~mesh\.rtr_X0_Y[0-4]\.rsp[01]_e\.size 8
~mesh\.rtr_X0_Y[0-4]\.dat[01]_e\.size 8

~mesh\.rtr_X1_Y[0-4]\.req_w\.size 8
~mesh\.rtr_X1_Y[0-4]\.snp_w\.size 8
~mesh\.rtr_X1_Y[0-4]\.rsp[01]_w\.size 8
~mesh\.rtr_X1_Y[0-4]\.dat[01]_w\.size 8

# Column (2,3) (3,4) and (4,5) have latency of 3
~mesh\.X1_Y[0-4]_to_X2_Y[0-4]_.*\.latency 4
~mesh\.X2_Y[0-4]_to_X3_Y[0-4]_.*\.latency 4
~mesh\.X3_Y[0-4]_to_X4_Y[0-4]_.*\.latency 4

# Column 5 and 6 have latency of 1
~mesh\.X4_Y[0-4]_to_X5_Y[0-4]_.*\.latency 1

~mesh\.rtr_X4_Y[0-4]\.req_e\.size 4
~mesh\.rtr_X4_Y[0-4]\.snp_e\.size 4
~mesh\.rtr_X4_Y[0-4]\.rsp[01]_e\.size 4
~mesh\.rtr_X4_Y[0-4]\.dat[01]_e\.size 4

~mesh\.rtr_X5_Y[0-4]\.req_w\.size 4
~mesh\.rtr_X5_Y[0-4]\.snp_w\.size 4
~mesh\.rtr_X5_Y[0-4]\.rsp[01]_w\.size 4
~mesh\.rtr_X5_Y[0-4]\.dat[01]_w\.size 4

~mesh\.rtr_X[01]_Y4\.tgt_xy_overrides [
    [5, 0, 3, 0],
    [5, 1, 3, 0]
]

