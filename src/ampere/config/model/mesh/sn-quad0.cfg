+channels [
    { "tgt": [0, 0, 1, 0], "channel": 1 },
    { "tgt": [0, 2, 0, 0], "channel": 1 },
    { "tgt": [0, 2, 1, 0], "channel": 1 },
    { "tgt": [0, 3, 0, 0], "channel": 1 },
    { "tgt": [0, 3, 1, 0], "channel": 1 },
    { "tgt": [1, 1, 0, 0], "channel": 1 },
    { "tgt": [1, 1, 1, 0], "channel": 1 },
    { "tgt": [1, 3, 0, 0], "channel": 1 },
    { "tgt": [1, 3, 1, 0], "channel": 1 },
    { "tgt": [2, 0, 0, 0], "channel": 1 },
    { "tgt": [2, 0, 1, 0], "channel": 1 },
    { "tgt": [2, 2, 0, 0], "channel": 1 },
    { "tgt": [2, 2, 1, 0], "channel": 1 },
    { "tgt": [3, 1, 1, 0], "channel": 1 },
    { "tgt": [3, 3, 1, 0], "channel": 1 }
]

# Some vertical connections are two cycles
~mesh\.X[0-3]_Y0_to_X[0-3]_Y1_.*\.latency 2
~mesh\.X[0-3]_Y1_to_X[0-3]_Y2_.*\.latency 2
~mesh\.X[0-3]_Y2_to_X[0-3]_Y3_.*\.latency 2

# Center horizontals are four cycles
~mesh\.X1_Y[0-3]_to_X2_Y[0-3]_.*\.latency 4

# And weirdly, column 2 to 3 is three cycles
~mesh\.X2_Y[0-3]_to_X3_Y[0-3]_.*\.latency 3

############################################################
# Credit gunk
#

# Note: credits are defined in the *target* node.

# By default, 2 credits for the cardinal directions to cover
# a 1 cycle latency.
~mesh\.rtr_X[0-3]_Y[0-3]\.req_[snew]\.size 2
~mesh\.rtr_X[0-3]_Y[0-3]\.snp_[snew]\.size 2
~mesh\.rtr_X[0-3]_Y[0-3]\.rsp[01]_[snew]\.size 2
~mesh\.rtr_X[0-3]_Y[0-3]\.dat[01]_[snew]\.size 2

# Not sure about device ports...trying 4 credits, but perhaps
# it should vary by channel.
~mesh\.rtr_X[0-3]_Y[0-3]\.req_p[0-9]+\.size 4
~mesh\.rtr_X[0-3]_Y[0-3]\.snp_p[0-9]+\.size 4
~mesh\.rtr_X[0-3]_Y[0-3]\.rsp[01]_p[0-9]+\.size 4
~mesh\.rtr_X[0-3]_Y[0-3]\.dat[01]_p[0-9]+\.size 4

# To account for the 2 cycle vertical latency, we have 4 credits
# for rows 1-3 coming from the south, and 4 credits for rows 0-2
# coming from the north.
#
~mesh\.rtr_X[0-3]_Y[123]\.req_s\.size 4
~mesh\.rtr_X[0-3]_Y[123]\.snp_s\.size 4
~mesh\.rtr_X[0-3]_Y[123]\.rsp[01]_s\.size 4
~mesh\.rtr_X[0-3]_Y[123]\.dat[01]_s\.size 4

~mesh\.rtr_X[0-3]_Y[012]\.req_n\.size 4
~mesh\.rtr_X[0-3]_Y[012]\.snp_n\.size 4
~mesh\.rtr_X[0-3]_Y[012]\.rsp[01]_n\.size 4
~mesh\.rtr_X[0-3]_Y[012]\.dat[01]_n\.size 4

# And now for those center horizontals, which need 8 credits
~mesh\.rtr_X2_Y[0-3]\.req_w\.size 8
~mesh\.rtr_X2_Y[0-3]\.snp_w\.size 8
~mesh\.rtr_X2_Y[0-3]\.rsp[01]_w\.size 8
~mesh\.rtr_X2_Y[0-3]\.dat[01]_w\.size 8

~mesh\.rtr_X1_Y[0-3]\.req_e\.size 8
~mesh\.rtr_X1_Y[0-3]\.snp_e\.size 8
~mesh\.rtr_X1_Y[0-3]\.rsp[01]_e\.size 8
~mesh\.rtr_X1_Y[0-3]\.dat[01]_e\.size 8

# Finally, the weird column 2 to 3
~mesh\.rtr_X3_Y[0-3]\.req_w\.size 6
~mesh\.rtr_X3_Y[0-3]\.snp_w\.size 6
~mesh\.rtr_X3_Y[0-3]\.rsp[01]_w\.size 6
~mesh\.rtr_X3_Y[0-3]\.dat[01]_w\.size 6

~mesh\.rtr_X2_Y[0-3]\.req_e\.size 6
~mesh\.rtr_X2_Y[0-3]\.snp_e\.size 6
~mesh\.rtr_X2_Y[0-3]\.rsp[01]_e\.size 6
~mesh\.rtr_X2_Y[0-3]\.dat[01]_e\.size 6

# CPX
~cpx_X[0-3]_Y[0-3]_P[01]\.dev_[0-9]+\.req_in\.size 8
~cpx_X[0-3]_Y[0-3]_P[01]\.dev_[0-9]+\.snp_in\.size 8
~cpx_X[0-3]_Y[0-3]_P[01]\.dev_[0-9]+\.dat_in\.size 8
~cpx_X[0-3]_Y[0-3]_P[01]\.dev_[0-9]+\.rsp[01]_in\.size 8

~cpx_X[0-3]_Y[0-3]_P[01]\.mesh_req_in\.size 2
~cpx_X[0-3]_Y[0-3]_P[01]\.mesh_rsp[01]_in\.size 2
~cpx_X[0-3]_Y[0-3]_P[01]\.mesh_snp_in\.size 2
~cpx_X[0-3]_Y[0-3]_P[01]\.mesh_dat_in\.size 2

# Delays for device inputs in the routers.
~mesh\.rtr_X[0-9]+_Y[0-9]+\.req_decode_latency 2

# Override y then x routing for these router nodes.
# Note that device numbers are actually ignore for these.
mesh.rtr_X0_Y1.xy_overrides [
    {"src": [0, 0, 0, 0], "tgt": [1, 2, 1, 0]},
    {"src": [0, 0, 0, 0], "tgt": [2, 2, 1, 0]},
    {"src": [0, 0, 0, 0], "tgt": [3, 2, 1, 0]},
    {"src": [0, 0, 1, 0], "tgt": [1, 2, 1, 0]},
    {"src": [0, 0, 1, 0], "tgt": [2, 2, 1, 0]},
    {"src": [0, 0, 1, 0], "tgt": [3, 2, 1, 0]}
]

mesh.rtr_X0_Y0.xy_overrides [
    {"src": [0, 0, 0, 0], "tgt": [1, 1, 1, 0]},
    {"src": [0, 0, 0, 0], "tgt": [1, 1, 1, 0]},
    {"src": [0, 0, 0, 0], "tgt": [2, 1, 1, 0]},
    {"src": [0, 0, 0, 0], "tgt": [2, 2, 1, 0]},
    {"src": [0, 0, 0, 0], "tgt": [3, 1, 1, 0]},
    {"src": [0, 0, 0, 0], "tgt": [3, 2, 1, 0]},
    {"src": [0, 0, 1, 0], "tgt": [1, 1, 1, 0]},
    {"src": [0, 0, 1, 0], "tgt": [1, 2, 1, 0]},
    {"src": [0, 0, 1, 0], "tgt": [2, 1, 1, 0]},
    {"src": [0, 0, 1, 0], "tgt": [2, 2, 1, 0]},
    {"src": [0, 0, 1, 0], "tgt": [3, 1, 1, 0]},
    {"src": [0, 0, 1, 0], "tgt": [3, 2, 1, 0]}
]

# RDI

rdi_X0_Y7_P0.type RDI
rdi_X0_Y7_P1.type RDI

rdi_X0_Y7_P0:cfg rdi.cfg
rdi_X0_Y7_P1:cfg rdi.cfg

rdi_X0_Y7_P0.delay "10ns"
rdi_X0_Y7_P1.delay "10ns"
rdi_X0_Y0_P0.delay "10ns"
rdi_X0_Y0_P1.delay "10ns"
