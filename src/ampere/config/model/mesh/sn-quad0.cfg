    { "type": "MeshInjector", "prefix": "core", "position": [1, 2, 1, 2] },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 2, 1, 3] },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 3, 1, 0] },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 3, 1, 1] },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 3, 1, 2] },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 3, 1, 3] },
    { "type": "MeshInjector", "prefix": "core", "position": [2, 0, 1, 0] },
