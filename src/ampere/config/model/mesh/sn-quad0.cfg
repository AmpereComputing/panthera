# Siryn Quad 0.
#
# This configuration fragment lays out one quadrant of the Siryn mesh. This fragment
# is intended to be composable with other quadrants, so it shouldn't hold settings
# for anything global unless its incremental (like devices).
#
+devices [
    { "type": "HomeNode", "position": [1, 0, 0, 0] },
    { "type": "HomeNode", "position": [1, 0, 0, 1] },
    { "type": "HomeNode", "position": [1, 1, 0, 0] },
    { "type": "HomeNode", "position": [1, 1, 0, 1] },
    { "type": "HomeNode", "position": [1, 2, 0, 0] },
    { "type": "HomeNode", "position": [1, 2, 0, 1] },
    { "type": "HomeNode", "position": [1, 3, 0, 0] },
    { "type": "HomeNode", "position": [1, 3, 0, 1] },
    { "type": "HomeNode", "position": [2, 0, 0, 0] },
    { "type": "HomeNode", "position": [2, 0, 0, 1] },
    { "type": "HomeNode", "position": [2, 1, 0, 0] },
    { "type": "HomeNode", "position": [2, 1, 0, 1] },
    { "type": "HomeNode", "position": [2, 2, 0, 0] },
    { "type": "HomeNode", "position": [2, 2, 0, 1] },
    { "type": "HomeNode", "position": [2, 3, 0, 0] },
    { "type": "HomeNode", "position": [2, 3, 0, 1] },

    { "type": "Memory", "position": [0, 0, 0, 0], "prefix": "memory", "via": "rdi" },
    { "type": "Memory", "position": [0, 0, 0, 1], "prefix": "memory", "via": "rdi" },
    { "type": "Memory", "position": [0, 0, 1, 0], "prefix": "memory", "via": "rdi" },
    { "type": "Memory", "position": [0, 0, 1, 1], "prefix": "memory", "via": "rdi" },

    { "type": "MeshInjector", "prefix": "core", "position": [1, 0, 1, 0] },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 0, 1, 1] },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 0, 1, 2] },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 0, 1, 3] },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 1, 1, 0] },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 1, 1, 1] },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 1, 1, 2] },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 1, 1, 3] },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 2, 1, 0] },
