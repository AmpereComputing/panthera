    { "type": "MeshInjector", "prefix": "core", "position": [2, 1, 1, 2] },
    { "type": "MeshInjector", "prefix": "core", "position": [2, 1, 1, 3] },
    { "type": "MeshInjector", "prefix": "core", "position": [2, 2, 1, 0] },
    { "type": "MeshInjector", "prefix": "core", "position": [2, 2, 1, 1] },
    { "type": "MeshInjector", "prefix": "core", "position": [2, 2, 1, 2] },
    { "type": "MeshInjector", "prefix": "core", "position": [2, 2, 1, 3] },
    { "type": "MeshInjector", "prefix": "core", "position": [2, 3, 1, 0] },
