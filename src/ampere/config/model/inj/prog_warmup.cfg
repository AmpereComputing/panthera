type UopSourceProg

parameters [
  {"name": "warmup_start_addr", "description": "starting (logical) address of warmup memory region", "default": "0x0020000"},
  {"name": "warmup_stop_addr", "description": "stopping (logical) address of warmup memory region", "default": "0x00220000"},
  {"name": "region", "description": "Region string for Paging (used by Core or IOR)", "default": ""}
]

warmup [
  {"start_address": "@warmup_start_addr", "stop_address": "@warmup_stop_addr", "action": "write", "region": "@region"}
]
