:cfg "../inj/decode.cfg"
type UopSourceProg

parameters [
  {"name": "start_addr", "description": "starting (logical) address of memory region", "default": "0x0020000"},
  {"name": "stop_addr", "description": "stopping (logical) address of memory region", "default": "0x08020000"},
  {"name": "warmup_start_addr", "description": "starting (logical) address of warmup memory region", "default": "0x0020000"},
  {"name": "warmup_stop_addr", "description": "stopping (logical) address of warmup memory region", "default": "0x08020000"},
  {"name": "stride", "description": "interval in bytes between loads", "default": 64},
  {"name": "interval", "description": "how many dependent adds to insert between loads", "default": 0},
  {"name": "loop_count", "description": "how many loads to execute", "default": 1000000}
]

# memory[i*64] += sum
# dc zva [(i+1)*64]
# dc zva [(i+2)*64]
# dc zva [(i+3)*64]

program {
  "generators": [
    {"name": "A", "type": "strided", "start": "@start_addr", "stop": "@stop_addr", "stride": "@stride"}
  ],
  "code": [
    {"op": "LDR_64_ldst_pos", "fields": {"imm12": 0, "Rn": 1, "Rt": 2}, "pa": "A"},
    {"op": "ADD_64_addsub_ext", "fields": {"imm3": 0, "Rd": 2, "Rn": 4, "Rm": 2, "option": 1}},
    {"op": "STR_64_ldst_immpost", "fields": {"imm9": 64, "Rn": 1, "Rt": 2}, "pa": "A+"},

    {"op": "SYS_NOT_TLBI_NOT_Predictions", "fields": {"op1": 3, "CRm": 4, "op2": 1, "Rt": 1}, "pa": "A+"},
    {"op": "ADD_64_addsub_imm", "fields": {"sh": 0, "imm12": 64, "Rd": 1, "Rn": 1}},

    {"op": "SYS_NOT_TLBI_NOT_Predictions", "fields": {"op1": 3, "CRm": 4, "op2": 1, "Rt": 1}, "pa": "A+"},
    {"op": "ADD_64_addsub_imm", "fields": {"sh": 0, "imm12": 64, "Rd": 1, "Rn": 1}},

    {"op": "SYS_NOT_TLBI_NOT_Predictions", "fields": {"op1": 3, "CRm": 4, "op2": 1, "Rt": 1}, "pa": "A+"},
    {"op": "ADD_64_addsub_imm", "fields": {"sh": 0, "imm12": 64, "Rd": 1, "Rn": 1}},

    {"op": "ADD_64_addsub_ext", "fields": {"imm3": 0, "Rd": 4, "Rn": 4, "Rm": 4, "option": 1}, "repeat": "@interval"}
  ],
  "loop": "@loop_count"
}

warmup [
  {"start_address": "@warmup_start_addr", "stop_address": "@warmup_stop_addr", "action": "read"}
]
