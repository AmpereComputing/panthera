# This warmup cfg is for use with the detailed core model (present in l2c.h). We could combine the files prog_warmup.cfg and warmup.cfg essentially
type UopSourceProg

parameters [
  {"name": "warmup_start_addr", "description": "starting (logical) address of warmup memory region", "default": "0x13e100000"},
  {"name": "warmup_stop_addr", "description": "stopping (logical) address of warmup memory region", "default": "0x13e900800"},
  {"name": "warmup_action", "description": "Read or write warmup", "default": "read"}
]

warmup [
  {"start_address": "@warmup_start_addr", "stop_address": "@warmup_stop_addr", "action": "@warmup_action"}
]
