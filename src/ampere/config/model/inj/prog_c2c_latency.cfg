:cfg "../inj/decode.cfg"
type UopSourceProg

parameters [
  {"name": "ping_pong_mask", "description": "mask that determines the meshinjectors participating in ping pong", "default": 0},
  {"name": "loop_count", "description": "how many loads to execute", "default": 1000000},
  {"name": "repeat_count", "description": "how many dependent adds to insert between loads", "default": 16},
  {"name": "address_list", "description": "list of addresses to load", "default": [133056, 134080, 135104]}
]

program {
  "generators": [
    {"name": "A", "type": "list", "address_list": "@address_list"}
  ],
  "code": [
    {"op": "ADD_64_addsub_ext", "fields": {"imm3": 0, "Rd": 2, "Rn": 1, "Rm": 2, "option": 1}, "repeat": "@repeat_count"},
    {"op": "STP_64_ldstpair_post", "fields": {"imm7": 16, "Rn": 4, "Rt": 2, "Rt2": 3}, "pa": "A+"},
    {"op": "ADD_64_addsub_ext", "fields": {"imm3": 0, "Rd": 2, "Rn": 1, "Rm": 4, "option": 1}, "barrier": "true"}
  ],
  "loop": "@loop_count",
  "ping_pong_mask": "@ping_pong_mask"
}

warmup [
  {"start_address": "@start_addr", "stop_address": "@stop_addr", "state": "SC"}
]
