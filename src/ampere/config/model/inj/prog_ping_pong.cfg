:cfg "../inj/decode.cfg"
type UopSourceProg

parameters [
  {"name": "address", "description": "address for ping ponging", "default": "0x0021300"},
  {"name": "loop_count", "description": "how many stores to execute", "default": 1000000},
  {"name": "ping_pong_mask", "description": "mask that determines the meshinjectors participating in ping pong", "default": 0}
]

program {
  "code": [
    {"op": "STP_64_ldstpair_post", "fields": {"imm7": 16, "Rn": 4, "Rt": 2, "Rt2": 3}, "pa": "@address"},
    {"op": "ADD_64_addsub_ext", "fields": {"imm3": 0, "Rd": 2, "Rn": 1, "Rm": 4, "option": 1}, "barrier": "true"}
  ],
  "loop": "@loop_count",
  "ping_pong_mask": "@ping_pong_mask"
}

warmup [
  {"start_address": "@start_addr", "stop_address": "@stop_addr", "state": "SC"}
]
