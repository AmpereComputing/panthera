:cfg "../inj/decode.cfg"
type UopSourceProg

parameters [
  {"name": "start_addr", "description": "starting (logical) address of memory region", "default": "0x0020000"},
  {"name": "stop_addr", "description": "stopping (logical) address of memory region", "default": "0x08020000"},
  {"name": "stride", "description": "interval in bytes between loads", "default": 64},
  {"name": "ping_pong_mask", "description": "mask that determines the meshinjectors participating in ping pong", "default": 0},
  {"name": "repeat_count", "description": "how many dependent adds to insert between loads", "default": 16},
  {"name": "loop_count", "description": "how many loads to execute", "default": 1000000}
]

program {
  "generators": [
    {"name": "A", "type": "strided", "start": "@start_addr", "stop": "@stop_addr", "stride": "@stride"}
  ],
  "code": [
    {"op": "STR_64_ldst_immpost", "fields": {"imm9": 0, "Rn": 4, "Rt": 2}, "pa": "A+", "repeat": "@repeat_count"},
    {"op": "ADD_64_addsub_ext", "fields": {"imm3": 0, "Rd": 2, "Rn": 1, "Rm": 4, "option": 1}, "barrier": "true"}
  ],
  "loop": "@loop_count",
  "ping_pong_mask": "@ping_pong_mask"
}

warmup [
  {"start_address": "@start_addr", "stop_address": "@stop_addr", "state": "SC"}
]
