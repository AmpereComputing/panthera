:cfg "../inj/decode.cfg"
type UopSourceProg

parameters [
  {"name": "start_addr_a", "description": "starting (logical) address of memory region A (read)", "default": "0x0020000"},
  {"name": "stop_addr_a", "description": "stopping (logical) address of memory region A (read)", "default": "0x08020000"},
  {"name": "start_addr_b", "description": "starting (logical) address of memory region B (write)", "default": "0x8020000"},
  {"name": "stop_addr_b", "description": "stopping (logical) address of memory region B (write)", "default": "0x10020000"},
  {"name": "stride", "description": "interval in bytes between loads", "default": 64},
  {"name": "loop_count", "description": "how many loads to execute", "default": 1000000}
]

program {
  "generators": [
    {"name": "A", "type": "strided", "start": "@start_addr_a", "stop": "@stop_addr_a", "stride": "@stride"},
    {"name": "B", "type": "strided", "start": "@start_addr_b", "stop": "@stop_addr_b", "stride": "@stride"}
  ],
  "code": [
    {"op": "LDP_64_ldstpair_post", "fields": {"imm7": 16, "Rn": 1, "Rt": 2, "Rt2": 3}, "pa": "A+"},
    {"op": "STP_64_ldstpair_post", "fields": {"imm7": 16, "Rn": 4, "Rt": 2, "Rt2": 3}, "pa": "B+"}
  ],
  "loop": "@loop_count"
}

warmup [
  {"start_address": "@start_addr_a", "stop_address": "@stop_addr_a", "action": "read"}
]
