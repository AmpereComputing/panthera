num_die  2
clock_period 417ps # Same as Mesh clock so that FIFOs get built properly

die_0:cfg ../mesh/rg-type0.cfg
die_1:cfg ../mesh/rg-type1.cfg

die_0.die_id 0
die_0.type CPU
die_0.clock_period 417ps # 2.4 GHz

die_1.die_id 1
die_1.type CPU
die_1.clock_period 417ps # 2.4 GHz

data_bus_width 256

################################################################################
# System Address Map
################################################################################

system_address_map.ddr_snr_mode 2

system_address_map.regions {
    "ddr_0": {
        "base": 0,
        "size": 8796093022208
    }
}

