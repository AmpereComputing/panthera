################################################################################
# Global
#
# Mesh - 2GHz (top level clock)
# Core - 3GHz
# DDR4 - 4800
################################################################################

clock_period 500ps

################################################################################
# System Address Map - 32TiB Mono
################################################################################

system_address_map.ddr_snr_mode 1

system_address_map.regions {
    "ddr_0": {
        "base": 0,
        "size": 35184372088832
    }
}

################################################################################
# Mesh Configuration
################################################################################

mesh.size_x 8
mesh.size_y 9
mesh.devices 2

cfg ../mesh/sn-full.cfg

################################################################################
# HomeNode Configuration
#
# SF  - 2MB, 16 ways
# SLC - 1MB, 16 ways
################################################################################

~homenode_[0-9]+:cfg ../mesh/hnf-1M_slc.cfg
~homenode_[0-9]+\.sam\.type HNF_SAM
~homenode_[0-9]+\.sam\.connect\.system_address_map $(prefix).system_address_map
~homenode_[0-9]+\.sam\.tgt_lut [
