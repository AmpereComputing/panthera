################################################################################
# Global Configuration
################################################################################

clock_period 400ps

################################################################################
# Mesh Configuration
################################################################################

mesh.size_x 1
mesh.size_y 1
mesh.devices 3

+devices [
    { "type": "Core",     "position": [0, 0, 0, 0] },
    { "type": "HomeNode", "position": [0, 0, 1, 0] },
    { "type": "Memory",   "position": [0, 0, 2, 0] }
]

# Credits for all channels to all ports
~mesh\.rtr_X0_Y0\.req_p[012]\.size 8
~mesh\.rtr_X0_Y0\.snp_p[012]\.size 8
~mesh\.rtr_X0_Y0\.rsp[01]_p[012]\.size 8
~mesh\.rtr_X0_Y0\.dat[01]_p[012]\.size 8

################################################################################
# Core SAM Configuration
################################################################################

core_0.l2c.sam.type RN_SAM
core_0.l2c.sam.system_address_map.connect $(prefix).system_address_map
core_0.l2c.sam.tgt_lut [[0, 0, 1, 0]]

################################################################################
# HomeNode Configuration
################################################################################

# No SLC in the HomeNode
homenode_0:cfg ../mesh/hnf-1M_slc.cfg
homenode_0.enable_slc false

# Disable CBUSY throttling
homenode_0.tracker.cbusy.enable false

homenode_0.sam.type RN_SAM
homenode_0.sam.system_address_map.connect $(prefix).system_address_map
homenode_0.sam.tgt_lut [[0, 0, 2, 0]]

################################################################################
# Memory Configuration
################################################################################

memory_0.min_read_latency 24
memory_0.read_sensitivity 0
memory_0.read_linearity 0
memory_0.min_write_latency 6
memory_0.write_sensitivity 0

# Disable CBUSY throttling
memory_0.cbusy.enable false
memory_0.enable_retry false
