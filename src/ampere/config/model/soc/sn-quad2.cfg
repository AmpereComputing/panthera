################################################################################
# Global
#
# Mesh - 2GHz (top level clock)
# Core - 3GHz
# DDR4 - 4800
################################################################################

clock_period 500ps

################################################################################
# Mesh Configuration
################################################################################

mesh.size_x 4
mesh.size_y 5
mesh.off_y 4
mesh.devices 2

cfg ../mesh/sn-quad2.cfg

################################################################################
# System Address Map
################################################################################

system_address_map.ddr_snr_mode 4

################################################################################
# HomeNode Configuration
#
# SF  - 2MB, 16 ways
# SLC - 1MB, 16 ways
################################################################################

~homenode_[0-9]+:cfg ../mesh/hnf-1M_slc.cfg
~homenode_[0-9]+\.sam\.type RN_SAM
~homenode_[0-9]+\.sam\.system_address_map\.connect $(prefix).system_address_map
~homenode_[0-9]+\.sam\.tgt_lut [
    [0, 7, 0, 0],
    [0, 7, 0, 0],
    [0, 7, 0, 0],
    [0, 7, 0, 0],
    [0, 7, 0, 1],
    [0, 7, 0, 1],
    [0, 7, 0, 1],
    [0, 7, 0, 1],
    [0, 7, 1, 0],
    [0, 7, 1, 0],
    [0, 7, 1, 0],
    [0, 7, 1, 0],
    [0, 7, 1, 1],
    [0, 7, 1, 1],
    [0, 7, 1, 1],
    [0, 7, 1, 1]
]

################################################################################
# Memory Configuration
################################################################################
~memory_[0-9]+:cfg ../mc/sn-mc-study.cfg

################################################################################
# Injector Configuration
#
# Disabled by default, so you can just turn on the ones you want
################################################################################

#~core_[0-9]:cfg ./../mesh/dn-meshinjector-common.cfg

~core_[0-9]+\.enable false
~core_[0-9]+\.max_outstanding_requests 48
~core_[0-9]+\.cache\.size 2097152
~core_[0-9]+\.cache\.ways 8
~core_[0-9]+\.read_with_read_not_shared_dirty true

# All injectors, home nodes, and memory use internal queues, so we need to set
# capacities.
~X[0-9]+_Y[0-9]+_P[0-9]+_D[0123]_.*_tx_[01]\.capacity 8

~core_[0-9]+\.sam\.type RN_SAM
~core_[0-9]+\.sam\.system_address_map\.connect $(prefix).system_address_map
~core_[0-9]+\.sam\.tgt_lut [
    [1, 7, 0, 0],
    [1, 6, 0, 1],
    [2, 5, 0, 0],
    [2, 4, 0, 1],
    [1, 7, 0, 1],
    [2, 6, 0, 0],
    [2, 5, 0, 1],
    [1, 4, 0, 0],
    [2, 7, 0, 0],
    [2, 6, 0, 1],
    [1, 5, 0, 0],
    [1, 4, 0, 1],
    [2, 7, 0, 1],
    [1, 6, 0, 0],
    [1, 5, 0, 1],
    [2, 4, 0, 0]
]
