# This matches POR: "CCL 5x4 v2"
# This CCL contains 64 cores, 24 PxHAs, 12 PmHAs, and 2 mcus.

mesh.size_x 5
mesh.size_y 4
mesh.devices 4

~mesh\.rtr_X[0-9]+_Y[0-9]+\.routing_order yx

~mesh\.rtr_X[0-9]+_Y[0-9]+\.req_[snew]\.size 6
~mesh\.rtr_X[0-9]+_Y[0-9]+\.snp_[snew]\.size 6
~mesh\.rtr_X[0-9]+_Y[0-9]+\.rsp[01]_[snew]\.size 6
~mesh\.rtr_X[0-9]+_Y[0-9]+\.dat[01]_[snew]\.size 6

~mesh\.rtr_X[0-9]+_Y[0-9]+\.req_p[0-9]+\.size 6
~mesh\.rtr_X[0-9]+_Y[0-9]+\.snp_p[0-9]+\.size 6
~mesh\.rtr_X[0-9]+_Y[0-9]+\.rsp[01]_p[0-9]+\.size 6
~mesh\.rtr_X[0-9]+_Y[0-9]+\.dat[01]_p[0-9]+\.size 6

# Vertical traversal is 3 clocks
~mesh\.X[0-4]_Y0_to_X[0-4]_Y1.*\.latency 2
~mesh\.X[0-4]_Y1_to_X[0-4]_Y2.*\.latency 2
~mesh\.X[0-4]_Y2_to_X[0-4]_Y3.*\.latency 2

# Horizontal traversal ranges
~mesh\.X0_Y[0-3]_to_X1_Y[0-3].*\.latency 3
~mesh\.X1_Y[0-3]_to_X2_Y[0-3].*\.latency 2
~mesh\.X2_Y[0-3]_to_X3_Y[0-3].*\.latency 2
~mesh\.X3_Y[0-3]_to_X4_Y[0-3].*\.latency 3

# These rtrs are connected to the vertical column ADIs and they need to be
# 12 to cover a latency of 6 in the horizontal ADI connections
~mesh\.rtr_X0_Y[0-3]\.req_p[0-9]+\.size 12
~mesh\.rtr_X0_Y[0-3]\.snp_p[0-9]+\.size 12
~mesh\.rtr_X0_Y[0-3]\.rsp[01]_p[0-9]+\.size 12
~mesh\.rtr_X0_Y[0-3]\.dat[01]_p[0-9]+\.size 12

