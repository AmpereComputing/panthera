################################################################################
# Memory Configuration
################################################################################

~memory_[0-9]+:cfg ../mc/sn-mc-study.cfg

################################################################################
# CPX Crediting Configuration
################################################################################

~cpx_X[0-5]_Y[0-4]_P[0-3]\.dev_[0-9]+\.req_in\.size 4
~cpx_X[0-5]_Y[0-4]_P[0-3]\.dev_[0-9]+\.snp_in\.size 4
~cpx_X[0-5]_Y[0-4]_P[0-3]\.dev_[0-9]+\.dat_in\.size 4
~cpx_X[0-5]_Y[0-4]_P[0-3]\.dev_[0-9]+\.rsp[01]_in\.size 4

~cpx_X[0-5]_Y[0-4]_P[0-3]\.mesh_req_in\.size 4
~cpx_X[0-5]_Y[0-4]_P[0-3]\.mesh_snp_in\.size 4
~cpx_X[0-5]_Y[0-4]_P[0-3]\.mesh_dat_in\.size 4
~cpx_X[0-5]_Y[0-4]_P[0-3]\.mesh_rsp[01]_in\.size 4

~X[0-9]_Y[0-4]_P[0-3]_D[0-3]_.*_tx_[01]\.capacity 8
~X[0-9]_Y[0-4]_P[0-3]_D[0-3]_.*_rx_[01]\.capacity 8

################################################################################
# HomeNode Configuration
#
# SF  - 2MB, 16 ways
# SLC - 1MB, 16 ways
################################################################################

~homenode_[0-9]+:cfg ../mesh/rg-hnf.cfg

~homenode_[0-9]+\.sam\.type HNF_SAM
~homenode_[0-9]+\.sam\.system_address_map\.connect $(prefix).system_address_map
~homenode_[0-9]+\.sam\.tgt_lut [
