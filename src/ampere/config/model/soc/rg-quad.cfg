clock_period 500ps # Same as Mesh clock so that FIFOs get built properly

cfg ../mesh/rg-type0.cfg

################################################################################
# System Address Map
################################################################################

system_address_map.ddr_snr_mode 4

system_address_map.regions {
    "ddr_0": {
        "base": 0,
        "size": 8796093022208
    }
}

################################################################################
# Mesh Injector Configuration
################################################################################

~core_[0-9]+\.enable false
~core_[0-9]+\.cache\.size 2097152
~core_[0-9]+\.cache\.ways 8
~core_[0-9]+\.cm\.connect $(prefix).controlmod

~core_[0-9]+\.sam\.type RN_SAM
~core_[0-9]+\.sam\.system_address_map\.connect $(prefix).system_address_map
~core_[0-9]+\.sam\.tgt_lut [
    {"die_id": 0, "agent_id": 64},
