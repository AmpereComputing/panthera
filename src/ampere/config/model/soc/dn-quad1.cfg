################################################################################
# RDI Configuration
################################################################################

# Die layout:
#
#     X | X
#     1 | 2
#     - 0 -
#     X | X
#     X | X

rdi [
    # ADI: CCL1 <-> CCL2
    {
        "a": { "die": 1, "position": [0, 0, 1, 0] }, # ADI_4
        "b": { "die": 2, "position": [0, 3, 1, 0] }  # ADI_7
    },
    {
        "a": { "die": 1, "position": [0, 1, 1, 0] }, # ADI_5
        "b": { "die": 2, "position": [0, 2, 1, 0] }  # ADI_6
    },
    {
        "a": { "die": 1, "position": [0, 2, 1, 0] }, # ADI_6
        "b": { "die": 2, "position": [0, 1, 1, 0] }  # ADI_5
    },
    {
        "a": { "die": 1, "position": [0, 3, 1, 0] }, # ADI_7
        "b": { "die": 2, "position": [0, 0, 1, 0] }  # ADI_4
    },
    # ADI: CCL1 <-> IOD
    {
        "a": { "die": 1, "position": [1, 3, 2, 0] }, # ADI_0
        "b": { "die": 0, "position": [3, 2, 0, 0] }  # ADI_12
    },
    {
        "a": { "die": 1, "position": [2, 3, 0, 0] }, # ADI_1
        "b": { "die": 0, "position": [2, 3, 0, 0] }  # ADI_13
    },
    {
        "a": { "die": 1, "position": [2, 3, 2, 0] }, # ADI_2
        "b": { "die": 0, "position": [1, 2, 0, 0] }  # ADI_14
    },
    {
        "a": { "die": 1, "position": [3, 3, 2, 0] }, # ADI_3
        "b": { "die": 0, "position": [0, 3, 0, 0] }  # ADI_15
    },
    # ADI: CCL2 <-> IOD
    {
        "a": { "die": 2, "position": [1, 0, 2, 0] }, # ADI_0
        "b": { "die": 0, "position": [4, 2, 0, 0] }  # ADI_12
    },
    {
        "a": { "die": 2, "position": [2, 0, 0, 0] }, # ADI_1
        "b": { "die": 0, "position": [5, 3, 0, 0] }  # ADI_13
    },
    {
        "a": { "die": 2, "position": [2, 0, 2, 0] }, # ADI_2
        "b": { "die": 0, "position": [6, 2, 0, 0] }  # ADI_14
    },
    {
        "a": { "die": 2, "position": [3, 0, 2, 0] }, # ADI_3
        "b": { "die": 0, "position": [7, 3, 0, 0] }  # ADI_15
    }
]


~rdi_die[0-9]+_X[0-9]+_Y[0-9]+_P[0-9]+_to_die[0-9]+_X[0-9]+_Y[0-9]+_P[0-9]+:cfg ../mesh/dn-adi.cfg
