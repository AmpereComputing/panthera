die_1:cfg dn-ccl.cfg
die_2:cfg dn-ccl.cfg

die_0.die_id 0
die_0.type IO
die_0.clock_period 500ps # 2.0 GHz

die_1.die_id 1
die_1.type CPU
die_1.clock_period 500ps # 2.0 GHz

die_2.die_id 2
die_2.type CPU
die_2.clock_period 500ps # 2.0 GHz

