################################################################################
# Latency configuration
################################################################################

# Every CPX has a latency of 2 cycles going from RTR to Dev
# Every CPX has a latency of 1 cycle going from Dev to Rtr
# NOTE: The order of latency configuration matters as they are overriding
#       previous ones

# Cores
~die[12]_X[0134]_Y[0-3]_P0_[rsd].*rx.*\.latency 1         # CPX -> RTR
~die[12]_X[0134]_Y[0-3]_P0_[rsd].*tx.*\.latency 0         # RTR -> CPX
~die[12]_X[0134]_Y[0-3]_P0_D[0-3]_.*tx.*\.delay "1.166ns" # CPX -> Device
~die[12]_X[0134]_Y[0-3]_P0_D[0-3]_.*rx.*\.delay "1.333ns" # Device -> CPX

# PHAs
~die[12]_X[13]_Y[0-3]_P1_.*rx.*\.latency 1          # CPX -> RTR
~die[12]_X[13]_Y[0-3]_P1_.*tx.*\.latency 0          # RTR -> CPX
~die[12]_X[13]_Y[0-3]_P1_D[0-3]_.*tx.*\.latency 1   # CPX -> Device
~die[12]_X[13]_Y[0-3]_P1_D[0-3]_.*rx.*\.latency 0   # Device -> CPX
~die[12]_X2_Y[12]_P[01]_.*rx.*\.latency 1           # CPX -> RTR
~die[12]_X2_Y[12]_P[01]_.*tx.*\.latency 0           # RTR -> CPX
~die[12]_X2_Y[12]_P[01]_D[0-3]_.*tx.*\.latency 1    # CPX -> Device
~die[12]_X2_Y[12]_P[01]_D[0-3]_.*rx.*\.latency 0    # Device -> CPX

~die[12]_X4_Y[03]_P1_D[0-3]_.*tx.*\.delay 1.75ns # CPX -> Memory
~die[12]_X4_Y[03]_P1_D[0-3]_.*rx.*\.delay 1.63ns # Memory -> CPX

# ADI latency
# CCL to CCL.
~rdi_die1_X0_Y0_P1_to_die2_X0_Y3_P1_conn_[ab]_.*\.latency 6 # Add cycle for CPX, we go through CPX both directions we can treat it as symmetrical
~rdi_die1_X0_Y1_P1_to_die2_X0_Y2_P1_conn_[ab]_.*\.latency 3
~rdi_die1_X0_Y2_P1_to_die2_X0_Y1_P1_conn_[ab]_.*\.latency 3
~rdi_die1_X0_Y3_P1_to_die2_X0_Y0_P1_conn_[ab]_.*\.latency 6 # Add cycle for CPX, we go through CPX both directions we can treat it as symmetrical

# CCLs to IOD
~rdi_die1_X1_Y3_P2_to_die0_X3_Y2_P0_conn_a_.*\.latency 1 # actual 0, but zero delay loop
~rdi_die1_X2_Y3_P0_to_die0_X2_Y3_P0_conn_a_.*\.latency 1
~rdi_die1_X2_Y3_P2_to_die0_X1_Y2_P0_conn_a_.*\.latency 1 # actual 0, but zero delay loop
~rdi_die1_X3_Y3_P2_to_die0_X0_Y3_P0_conn_a_.*\.latency 1

~rdi_die2_X1_Y0_P2_to_die0_X4_Y2_P0_conn_a_.*\.latency 1 # actual 0, but zero delay loop
~rdi_die2_X2_Y0_P0_to_die0_X5_Y3_P0_conn_a_.*\.latency 1
~rdi_die2_X2_Y0_P2_to_die0_X6_Y2_P0_conn_a_.*\.latency 1 # actual 0, but zero delay loop
~rdi_die2_X3_Y0_P2_to_die0_X7_Y3_P0_conn_a_.*\.latency 1


