num_die 1
clock_period 500ps

die_0:cfg ks-slice.cfg

data_bus_width 1024

~tdma_[0-9]+:cfg ../mesh/ks-tdma.cfg
~tdma_[0-9]+\.sam\.system_address_map\.connect $(prefix).system_address_map
~tdma_[0-9]+\.sam.type TDMA_SAM
~tdma_[0-9]+\.sam.hbm_lut [ 64, 65, 66, 67, 68, 69, 70, 71 ]
~tdma_[0-9]+\.sam.mhat_lut [ 9, 26, 42, 57 ]
~tdma_[0-9]+\.stop_addr 0x3ffffffff  # keep addresses inside one slice

################################################################################
# Crediting for Memory, Tile connections (and their CPXes)
################################################################################

~cpx_die0_X0_Y[0-7]_Z[0-3]_P3\.dev_[01]\.req_in\.size 4
~cpx_die0_X0_Y[0-7]_Z[0-3]_P3\.dev_[01]\.snp_in\.size 4
~cpx_die0_X0_Y[0-7]_Z[0-3]_P3\.dev_[01]\.dat_in\.size 4
~cpx_die0_X0_Y[0-7]_Z[0-3]_P3\.dev_[01]\.rsp[01]_in\.size 4
~cpx_die0_X0_Y[0-7]_Z[0-3]_P3\.dev_[01]\.matrix_rsp_routing true

~cpx_die0_X[0-3]_Y0_Z3_P0\.dev_[01]\.req_in\.size 4
~cpx_die0_X[0-3]_Y0_Z3_P0\.dev_[01]\.snp_in\.size 4
~cpx_die0_X[0-3]_Y0_Z3_P0\.dev_[01]\.dat_in\.size 4
~cpx_die0_X[0-3]_Y0_Z3_P0\.dev_[01]\.rsp[01]_in\.size 4
~cpx_die0_X[0-3]_Y0_Z3_P0\.dev_[01]\.matrix_rsp_routing true

~cpx_die0_X0_Y[0-7]_Z[0-3]_P3\.mesh_req_in\.size 4
~cpx_die0_X0_Y[0-7]_Z[0-3]_P3\.mesh_snp_in\.size 4
~cpx_die0_X0_Y[0-7]_Z[0-3]_P3\.mesh_dat_in\.size 4
~cpx_die0_X0_Y[0-7]_Z[0-3]_P3\.mesh_rsp[01]_in\.size 4

~cpx_die0_X[0-3]_Y0_Z3_P0\.mesh_req_in\.size 4
~cpx_die0_X[0-3]_Y0_Z3_P0\.mesh_snp_in\.size 4
~cpx_die0_X[0-3]_Y0_Z3_P0\.mesh_dat_in\.size 4
~cpx_die0_X[0-3]_Y0_Z3_P0\.mesh_rsp[01]_in\.size 4

~die0_X0_Y[0-7]_Z[0-3]_P3_D[01]_.*_tx_[01]\.capacity 8
~die0_X[0-3]_Y0_Z3_P0_D[01]_.*_tx_[01]\.capacity 8
