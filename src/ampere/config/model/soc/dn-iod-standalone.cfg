num_die 1
clock_period 500ps # Same as Mesh clock so that FIFOs get built properly

die_0:cfg dn-iod.cfg
die_0.die_id 0
die_0.type IO
die_0.clock_period 500ps # 2.0 GHz

data_bus_width 512

################################################################################
# Memory Configuration
################################################################################

~memory_[0-9]+:cfg ../mc/dn-mc-dummy-fixed.cfg

################################################################################
# CPX Crediting Configuration
################################################################################

~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.dev_[0-9]+\.req_in\.size 4
~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.dev_[0-9]+\.snp_in\.size 4
~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.dev_[0-9]+\.dat_in\.size 4
~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.dev_[0-9]+\.rsp[01]_in\.size 4

~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.mesh_req_in\.size 4
~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.mesh_snp_in\.size 4
~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.mesh_dat_in\.size 4
~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.mesh_rsp[01]_in\.size 4

~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.dev_[0-9]+\.matrix_rsp_routing true

~die[012]_X[0-9]+_Y[0-9]+_P[0-9]+_D[0-9]+_.*_rx_[01]\.capacity 16
~die[012]_X[0-9]+_Y[0-9]+_P[0-9]+_D[0-9]+_.*_tx_[01]\.capacity 16

# MeshInjector ports do not use a CPX in this config, so they need their capacity
# set differently.
~die0_X0_Y0_P3_.*_[tr]x_[01]\.capacity 8
~die0_X1_Y0_P3_.*_[tr]x_[01]\.capacity 8
~die0_X2_Y0_P3_.*_[tr]x_[01]\.capacity 8
~die0_X3_Y0_P0_.*_[tr]x_[01]\.capacity 8

################################################################################
# PHA Configuration
################################################################################

~pmha_[0-9]+:cfg ../mesh/dn-pmha.cfg
~pmha_[0-9]+\.sam.connect $(prefix).pmhasam

~pmha_[0-9]+\.use_fixed_mcu true

pmha_0.fixed_mcu  { "socket_id": 0, "die_id": 0, "agent_id": 24 }
