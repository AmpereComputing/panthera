################################################################################
# Mesh Injector Configuration
################################################################################

+die_0.devices [
    { "type": "MeshInjector", "prefix": "core", "position": [0, 0, 3, 0], "agent_id":  32 },
    { "type": "MeshInjector", "prefix": "core", "position": [1, 0, 3, 0], "agent_id":  33 },
    { "type": "MeshInjector", "prefix": "core", "position": [2, 0, 3, 0], "agent_id":  34 },
    { "type": "MeshInjector", "prefix": "core", "position": [3, 0, 0, 0], "agent_id":  35 }
]

~core_[0-9]+\.enable true
~core_[0-9]+\.num_rsp_ports 2
~core_[0-9]+\.evict_uc_with_evict true
~core_[0-9]+\.cache\.sets 2
~core_[0-9]+\.cache\.ways 4
~core_[0-9]+\.cache\.invalidate_duplicates_before_fill true
~core_[0-9]+\.l3c\.sets 2
~core_[0-9]+\.l3c\.ways 2
~core_[0-9]+\.l3c\.invalidate_duplicates_before_fill true

~core_[0-9]+\.max_outstanding_requests 528
~core_[0-9]+\.cbusy\.enable false
~core_[0-9]+\.cbusy\.throttle_max 528
~core_[0-9]+\.max_executing_uops 4096
~core_[0-9]+\.max_pending_uops 4096
~core_[0-9]+\.max_commits_per_cycle 64
~core_[0-9]+\.max_loads_per_cycle 64
~core_[0-9]+\.max_stores_per_cycle 64
~core_[0-9]+\.max_nonmem_per_cycle 64

