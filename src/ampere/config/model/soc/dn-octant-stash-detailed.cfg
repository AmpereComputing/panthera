cfg dn-octant.cfg

# Enable detailed stash cores that matches our emulation setup
+die_0.devices [
    # Router RTR0
    { "type": "Core", "prefix": "core", "position": [0, 0, 0, 1], "agent_id":  1 }, # Core 1
    { "type": "Core", "prefix": "core", "position": [0, 0, 0, 2], "agent_id":  2 }, # Core 2
    { "type": "Core", "prefix": "core", "position": [0, 0, 0, 3], "agent_id":  3 }, # Core 3

    # Router RTR8
    { "type": "Core", "prefix": "core", "position": [3, 1, 0, 0], "agent_id": 20 }, # Core 20
    { "type": "Core", "prefix": "core", "position": [3, 1, 0, 1], "agent_id": 21 }, # Core 21
    { "type": "Core", "prefix": "core", "position": [3, 1, 0, 2], "agent_id": 22 }, # Core 22
    { "type": "Core", "prefix": "core", "position": [3, 1, 0, 3], "agent_id": 23 }, # Core 23

    # Router RTR13
    { "type": "Core", "prefix": "core", "position": [3, 2, 1, 0], "agent_id": 40 }, # Core 40
    { "type": "Core", "prefix": "core", "position": [3, 2, 1, 1], "agent_id": 41 }, # Core 41
    { "type": "Core", "prefix": "core", "position": [3, 2, 1, 2], "agent_id": 42 }, # Core 42
    { "type": "Core", "prefix": "core", "position": [3, 2, 1, 3], "agent_id": 43 }, # Core 43

    # Router RTR19
    { "type": "Core", "prefix": "core", "position": [4, 3, 1, 0], "agent_id": 60 }, # Core 60
    { "type": "Core", "prefix": "core", "position": [4, 3, 1, 1], "agent_id": 61 }, # Core 61
    { "type": "Core", "prefix": "core", "position": [4, 3, 1, 2], "agent_id": 62 }, # Core 62
    { "type": "Core", "prefix": "core", "position": [4, 3, 1, 3], "agent_id": 63 }  # Core 63
]

