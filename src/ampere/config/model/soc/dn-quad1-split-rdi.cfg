num_die 3
clock_period 417ps # Same as Mesh clock so that FIFOs get built properly

die_0:cfg dn-iod.cfg
die_1:cfg dn-ccl42.cfg
die_2:cfg dn-ccl42.cfg

die_0.die_id 0
die_0.type IO
die_0.clock_period 455ps # 2.2GHz

die_1.die_id 1
die_1.type CPU
die_1.clock_period 417ps # 2.4 GHz

die_2.die_id 2
die_2.type CPU
die_2.clock_period 417ps # 2.4 GHz

data_bus_width 512

################################################################################
# Memory Configuration
################################################################################

~memory_[0-9]+:cfg ../mc/dn-panem-12800-mrdimm.cfg

################################################################################
# RDI Configuration
################################################################################

rdi [
    {
        "a": { "die": 1, "position": [3, 0, 2, 0] },
        "b": { "die": 0, "position": [2, 0, 2, 0] }
    },
    {
        "a": { "die": 1, "position": [3, 2, 3, 0] },
        "b": { "die": 0, "position": [3, 0, 1, 0] }
    },
    {
        "a": { "die": 2, "position": [3, 0, 2, 0] },
        "b": { "die": 0, "position": [2, 0, 3, 0] }
    },
    {
        "a": { "die": 2, "position": [3, 2, 3, 0] },
        "b": { "die": 0, "position": [3, 0, 0, 0] }
    }
]

~rdi_die[12]_X[0-9]+_Y[0-9]+_P[0-9]+_to_die0_X[0-9]+_Y[0-9]+_P[0-9]+\.type RDI
~rdi_die[12]_X[0-9]+_Y[0-9]+_P[0-9]+_to_die0_X[0-9]+_Y[0-9]+_P[0-9]+:cfg ../mesh/rdi.cfg

~die_0\.mesh\.rtr_X[0-9]+_Y[0-9]+\.die_to_die_lrt [
    { "die_id": 1, "entries": [[2, 0, 2, 0], [3, 0, 1, 0], [2, 0, 2, 0], [3, 0, 1, 0]] },
    { "die_id": 2, "entries": [[2, 0, 3, 0], [3, 0, 0, 0], [2, 0, 3, 0], [3, 0, 0, 0]] }
]

~die_[12]\.mesh\.rtr_X[0-9]+_Y[0-9]+\.die_to_die_lrt [
    { "die_id": 0, "entries": [[3, 2, 3, 0], [3, 0, 2, 0], [3, 2, 3, 0], [3, 0, 2, 0]] }
]


################################################################################
# CPX Crediting Configuration
################################################################################

~cpx_die0_X[0-3]_Y[0-3]_P[0-3]\.dev_[0-9]+\.req_in\.size 4
~cpx_die0_X[0-3]_Y[0-3]_P[0-3]\.dev_[0-9]+\.snp_in\.size 4
~cpx_die0_X[0-3]_Y[0-3]_P[0-3]\.dev_[0-9]+\.dat_in\.size 4
~cpx_die0_X[0-3]_Y[0-3]_P[0-3]\.dev_[0-9]+\.rsp[01]_in\.size 4

~cpx_die0_X[0-3]_Y[0-3]_P[0-3]\.mesh_req_in\.size 4
~cpx_die0_X[0-3]_Y[0-3]_P[0-3]\.mesh_snp_in\.size 4
~cpx_die0_X[0-3]_Y[0-3]_P[0-3]\.mesh_dat_in\.size 4
~cpx_die0_X[0-3]_Y[0-3]_P[0-3]\.mesh_rsp[01]_in\.size 4

~cpx_die[12]_X[0-3]_Y[0-2]_P[0-3]\.dev_[0-9]+\.req_in\.size 4
~cpx_die[12]_X[0-3]_Y[0-2]_P[0-3]\.dev_[0-9]+\.snp_in\.size 4
~cpx_die[12]_X[0-3]_Y[0-2]_P[0-3]\.dev_[0-9]+\.dat_in\.size 4
~cpx_die[12]_X[0-3]_Y[0-2]_P[0-3]\.dev_[0-9]+\.rsp[01]_in\.size 4

~cpx_die[12]_X[0-3]_Y[0-2]_P[0-3]\.mesh_req_in\.size 4
~cpx_die[12]_X[0-3]_Y[0-2]_P[0-3]\.mesh_snp_in\.size 4
~cpx_die[12]_X[0-3]_Y[0-2]_P[0-3]\.mesh_dat_in\.size 4
~cpx_die[12]_X[0-3]_Y[0-2]_P[0-3]\.mesh_rsp[01]_in\.size 4

~cpx_die0_X[0-3]_Y[0-3]_P[0-3]\.dev_[0-9]+\.matrix_rsp_routing true
~cpx_die[12]_X[0-3]_Y[0-2]_P[0-3]\.dev_[0-9]+\.matrix_rsp_routing true

~die[012]_X[0-9]+_Y[0-9]+_P[0-9+]+_D[0-9+]_.*_rx_[01]\.capacity 8
~die[012]_X[0-9]+_Y[0-9]+_P[0-9+]+_D[0-9+]_.*_tx_[01]\.capacity 8

################################################################################
# PHA Configuration
################################################################################

~pxha_[0-9]+:cfg ../mesh/dn-pxha.cfg
~pxha_[0-9]+\.sam\.connect $(prefix).die_0.idrnsam
~pmha_[0-9]+:cfg ../mesh/dn-pmha.cfg
~pmha_[0-9]+\.sam.connect $(prefix).die_0.pmhasam


################################################################################
# Mesh Injector Configuration
################################################################################

~core_[0-9]+\.enable false
~core_[0-9]+\.cache\.size 2097152
~core_[0-9]+\.cache\.ways 8
~core_[0-9]+\.cache\.invalidate_duplicates_before_fill true
~core_[0-9]+\.l3c\.size 524288
~core_[0-9]+\.l3c\.ways 2
~core_[0-9]+\.l3c\.invalidate_duplicates_before_fill true

~core_[0-9]+\.sam\.connect $(prefix).die_1.cdrnsam
~core_1[0-9]+\.sam\.connect $(prefix).die_1.cdrnsam
~core_2[0-9]+\.sam\.connect $(prefix).die_1.cdrnsam
~core_3[0-9]+\.sam\.connect $(prefix).die_1.cdrnsam
~core_4[0-1]+\.sam\.connect $(prefix).die_1.cdrnsam

~core_4[2-9]+\.sam\.connect $(prefix).die_2.cdrnsam
~core_5[0-9]+\.sam\.connect $(prefix).die_2.cdrnsam
~core_6[0-9]+\.sam\.connect $(prefix).die_2.cdrnsam
~core_7[0-9]+\.sam\.connect $(prefix).die_2.cdrnsam
~core_8[0-3]+\.sam\.connect $(prefix).die_2.cdrnsam

################################################################################
# XY Overrides
################################################################################

# Incoming requests on the RDI channel should go YX first
~die_[12]\.mesh\.rtr_X3_Y1\.tgt_xy_overrides [
    [0, 0, 3, 0],
    [0, 0, 0, 0],
    [1, 0, 3, 0],
    [1, 0, 0, 0],
    [2, 0, 3, 0],
    [2, 0, 0, 0],
    [3, 0, 3, 0],
    [3, 0, 0, 0],
    [0, 2, 3, 0],
    [0, 2, 0, 0],
    [1, 2, 3, 0],
    [1, 2, 0, 0],
    [2, 2, 3, 0],
    [2, 2, 0, 0],
    [3, 2, 3, 0],
    [3, 2, 0, 0]
]

# The bottom row has two extra PxHAs.  Route this traffic y first to prevent build
# up at the RDI router.
~die_[12]\.mesh\.rtr_X0_Y0\.tgt_xy_overrides [
    [3, 1, 3, 0],
    [3, 0, 1, 0]
]

# PMHAs should route YX first
~die_0\.mesh\.rtr_X[23]_Y[0-3]\.tgt_xy_overrides [
    [2, 1, 2, 0],
    [2, 1, 2, 1],
    [2, 1, 3, 0],
    [2, 1, 3, 1],
    [2, 2, 2, 0],
    [2, 2, 2, 1],
    [2, 2, 3, 0],
    [2, 2, 3, 1],
    [2, 3, 2, 0],
    [2, 3, 2, 1],
    [2, 3, 3, 0],
    [2, 3, 3, 1],
    [3, 1, 0, 0],
    [3, 1, 0, 1],
    [3, 1, 1, 0],
    [3, 1, 1, 1],
    [3, 2, 0, 0],
    [3, 2, 0, 1],
    [3, 2, 1, 0],
    [3, 2, 1, 1],
    [3, 3, 0, 0],
    [3, 3, 0, 1],
    [3, 3, 1, 0],
    [3, 3, 1, 1]
]
