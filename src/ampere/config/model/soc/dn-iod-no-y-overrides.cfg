mesh.size_x 3
mesh.size_y 4
mesh.devices 4

# Two cycles of inter-router latency and 6 router ingress credits everywhere.

~mesh\.X[0-9]+_Y[0-9]+_to_X[0-9]+_Y[0-9]+.*\.latency 2

~mesh\.rtr_X[0-9]+_Y[0-9]+\.req_[snew]\.size 6
~mesh\.rtr_X[0-9]+_Y[0-9]+\.snp_[snew]\.size 6
~mesh\.rtr_X[0-9]+_Y[0-9]+\.rsp[01]_[snew]\.size 6
~mesh\.rtr_X[0-9]+_Y[0-9]+\.dat[01]_[snew]\.size 6

~mesh\.rtr_X[0-9]+_Y[0-9]+\.req_p[0-9]+\.size 6
~mesh\.rtr_X[0-9]+_Y[0-9]+\.snp_p[0-9]+\.size 6
~mesh\.rtr_X[0-9]+_Y[0-9]+\.rsp[01]_p[0-9]+\.size 6
~mesh\.rtr_X[0-9]+_Y[0-9]+\.dat[01]_p[0-9]+\.size 6


