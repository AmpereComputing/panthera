cfg sn-quad2.cfg

################################################################################
# Core Configuration
################################################################################

+devices [
    { "type": "Core", "position": [1, 4, 1, 0] }
]

core_0:cfg ../core/furiosa/furiosa.cfg

core_0.l2c.sam.type RN_SAM
core_0.l2c.sam.system_address_map.connect $(prefix).system_address_map
core_0.l2c.sam.tgt_lut [
    [1, 7, 0, 0],
    [1, 6, 0, 1],
    [2, 5, 0, 0],
    [2, 4, 0, 1],
    [1, 7, 0, 1],
    [2, 6, 0, 0],
    [2, 5, 0, 1],
    [1, 4, 0, 0],
    [2, 7, 0, 0],
    [2, 6, 0, 1],
    [1, 5, 0, 0],
    [1, 4, 0, 1],
    [2, 7, 0, 1],
    [1, 6, 0, 0],
    [1, 5, 0, 1],
    [2, 4, 0, 0]
]
