cfg sn-quad2-one-core.cfg

# Matrix has a 512-bit data bus instead of 256-bit like CMN
data_bus_width 512

# Increased latency for flex cache hit
~homenode_[0-9]+.slc_hit_data_completion.latency 46

# Flex cache will invalidate a line on hit and transfer it to the requesting core
~homenode_[0-9]+.slc.all_hits_invalidate true

core_0:override-cfg ../core/connor/connor.cfg
