num_die 1
clock_period 500ps # Same as Mesh clock so that FIFOs get built properly

die_0:cfg dn-ccl.cfg

die_0.die_id 0
die_0.type CPU
die_0.clock_period 500ps # 2.0 GHz

data_bus_width 512

################################################################################
# System Address Map
################################################################################

system_address_map.ddr_snr_mode 8

################################################################################
# Memory Configuration
################################################################################

~memory_[0-9]+:cfg ../mc/dn-panem-12800-mrdimm.cfg

################################################################################
# CPX Crediting Configuration
################################################################################

~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.dev_[0-9]+\.req_in\.size 8
~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.dev_[0-9]+\.snp_in\.size 8
~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.dev_[0-9]+\.dat_in\.size 8
~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.dev_[0-9]+\.rsp[01]_in\.size 10

~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.mesh_req_in\.size 4
~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.mesh_snp_in\.size 4
~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.mesh_dat_in\.size 4
~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.mesh_rsp[01]_in\.size 4

~cpx_die0_X[0-9]+_Y[0-9]+_P[0-3]\.dev_[0-9]+\.matrix_rsp_routing true

~die0_X[0-9]+_Y[0-9]+_P[0-9]+_D[0-9]+_.*_tx_[01]\.capacity 3
~die0_X[0-9]+_Y[0-9]+_P[0-9]+_D[0-9]+_.*snp_tx_[01]\.capacity 6

################################################################################
# Latency configuration
################################################################################

# Cores
~die0_X[0134]_Y[0-3]_P0_[rsd].*rx.*\.latency 1         # CPX -> RTR
~die0_X[0134]_Y[0-3]_P0_[rsd].*tx.*\.latency 0         # RTR -> CPX
~die0_X[0134]_Y[0-3]_P0_D[0-3]_.*tx.*\.delay "1.166ns" # CPX -> Device
~die0_X[0134]_Y[0-3]_P0_D[0-3]_.*rx.*\.delay "1.333ns" # Device -> CPX
~die0_X[0134]_Y[0-3]_P0_D[0-3]_.*rsp_rx.*\.return_delay "1.667ns" # Device -> CPX

# PHAs
~die0_X[13]_Y[0-3]_P1_.*rx.*\.latency 1          # CPX -> RTR
~die0_X[13]_Y[0-3]_P1_.*tx.*\.latency 0          # RTR -> CPX
~die0_X[13]_Y[0-3]_P1_D[0-3]_.*tx.*\.latency 1   # CPX -> Device
~die0_X[13]_Y[0-3]_P1_D[0-3]_.*rx.*\.latency 0   # Device -> CPX
~die0_X2_Y[12]_P[01]_.*rx.*\.latency 1           # CPX -> RTR
~die0_X2_Y[12]_P[01]_.*tx.*\.latency 0           # RTR -> CPX
~die0_X2_Y[12]_P[01]_D[0-3]_.*tx.*\.latency 1    # CPX -> Device
~die0_X2_Y[12]_P[01]_D[0-3]_.*rx.*\.latency 0    # Device -> CPX


~die0_X4_Y[03]_P1_D[0-3]_.*tx.*\.delay 1.75ns # CPX -> Memory
~die0_X4_Y[03]_P1_D[0-3]_.*rx.*\.delay 1.63ns # Memory -> CPX

################################################################################
# PHA Configuration
################################################################################

~pxha_[0-9]+:cfg ../mesh/dn-pxha.cfg
~pxha_[0-9]+\.sam\.system_address_map\.connect $(prefix).system_address_map
~pxha_[0-9]+\.rsam\.system_address_map\.connect $(prefix).system_address_map
~pxha_[0-9]+\.prefetch_tgt_sam\.system_address_map\.connect $(prefix).system_address_map

~pmha_[0-9]+:cfg ../mesh/dn-pmha.cfg
~pmha_[0-9]+\.sam\.system_address_map\.connect $(prefix).system_address_map
~pmha_[0-9]+\.rsam\.system_address_map\.connect $(prefix).system_address_map

~p[xm]ha_[0-9]+\.chi_rsp_overrides [
    ["ReadReceipt", 0],
    ["SnpResp", 0],
    ["SnpRespFwded", 0]
]

~pxha_[0-9]+\.sam\.type PXHA_SAM
pxha_0.sam.pmha_tgt   96  # PxHA 64 (die 0)
pxha_1.sam.pmha_tgt   96  # PxHA 65 (die 0)
