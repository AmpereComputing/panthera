mesh.size_x 2
mesh.size_y 1

devices [
    { "type": "MeshInjector", "prefix": "core", "position": [0, 0, 0, 0] },
    { "type": "Memory",       "position": [1, 0, 0, 0] },
    { "type": "HomeNode",     "position": [1, 0, 1, 0] }
]

core_0.source.decoders ["connor"]
core_0.sam.type RN_SAM
core_0.sam.system_address_map.connect $(prefix).system_address_map
core_0.sam.tgt_lut [[1, 0, 1, 0]]
core_0.read_with_read_not_shared_dirty true

homenode_0.sam.type RN_SAM
homenode_0.sam.system_address_map.connect $(prefix).system_address_map
homenode_0.sam.tgt_lut [[1, 0, 0, 0]]

~mesh\.rtr_X[01]_Y0.*\.req_[snew]\.size 8
~mesh\.rtr_X[01]_Y0.*\.snp_[snew]\.size 8
~mesh\.rtr_X[01]_Y0.*\.rsp[01]_[snew]\.size 8
~mesh\.rtr_X[01]_Y0.*\.dat[01]_[snew]\.size 8
~mesh\.rtr_X[01]_Y0.*\.req_p[0-9]+\.size 8
~mesh\.rtr_X[01]_Y0.*\.snp_p[0-9]+\.size 8
~mesh\.rtr_X[01]_Y0.*\.rsp[01]_p[0-9]+\.size 8
~mesh\.rtr_X[01]_Y0.*\.dat[01]_p[0-9]+\.size 8

~X[01]_Y0_P[01]_.*_tx_[01]\.capacity 8
