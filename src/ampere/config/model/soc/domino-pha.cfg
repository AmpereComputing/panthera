# This is a degenerate mesh configuration intended for integration testing of
# the components in connor.  It has only a single mesh node with the core,
# memory, primary PHA, and proxy PHA directly attached,.
#
num_die 1
die_0.mesh.size_x 1
die_0.mesh.size_y 1
die_0.mesh.devices 6

die_0.devices [
    { "type": "MeshInjector", "prefix": "core", "position": [0, 0, 0, 0], "agent_id": 0 },
    { "type": "PxHA", "position": [0, 0, 1, 0], "agent_id": 1 },
    { "type": "PmHA", "position": [0, 0, 2, 0], "agent_id": 2 },
    { "type": "Memory", "position": [0, 0, 3, 0], "agent_id": 3 },
    { "type": "MeshInjector", "prefix": "core", "position": [0, 0, 4, 0], "agent_id": 4 },
    { "type": "MeshInjector", "prefix": "core", "position": [0, 0, 5, 0], "agent_id": 5 }
]

data_bus_width 512

~core_[0-9]+\.enable false
~core_[0-9]+\.cache\.invalidate_duplicates_before_fill true
~core_[0-9]+\.l3c\.invalidate_duplicates_before_fill true

~core_[0-2]+\.enable true
~core_[1-2]+\.stash_only true
~core_[0-9]+\.cbusy\.type MatrixCBusy
~core_[0-9]+\.cbusy\.throttle_start 56

################################################################################
# System Address Map and SAM Setup
################################################################################

system_address_map.ddr_snr_mode 8

system_address_map.regions {
    "ddr_0": {
        "base": 0,
        "size": 8796093022208
    }
}

~.*\.sam\.system_address_map\.connect $(prefix).system_address_map
~.*\.rsam\.system_address_map\.connect $(prefix).system_address_map
~.*\.prefetch_tgt_sam\.system_address_map\.connect $(prefix).system_address_map

~core_[0-9]+\.sam\.tgt_lut [1]

pxha_0.sam.type PXHA_SAM
pxha_0.sam.pmha_tgt 2

pmha_0.sam.type PMHA_SAM
pmha_0.sam.mcu_tgt 3

~cpx_die[0-9]+_X[0-9]+_Y[0-9]+_P[0-9]+\.dev_[0-9]+\.req_in\.size 10
~cpx_die[0-9]+_X[0-9]+_Y[0-9]+_P[0-9]+\.dev_[0-9]+\.snp_in\.size 10
~cpx_die[0-9]+_X[0-9]+_Y[0-9]+_P[0-9]+\.dev_[0-9]+\.dat_in\.size 10
~cpx_die[0-9]+_X[0-9]+_Y[0-9]+_P[0-9]+\.dev_[0-9]+\.rsp[01]_in\.size 10

~cpx_die[0-9]+_X[0-9]+_Y[0-9]+_P[0-9]+\.mesh_req_in\.size 10
~cpx_die[0-9]+_X[0-9]+_Y[0-9]+_P[0-9]+\.mesh_snp_in\.size 10
~cpx_die[0-9]+_X[0-9]+_Y[0-9]+_P[0-9]+\.mesh_dat_in\.size 10
~cpx_die[0-9]+_X[0-9]+_Y[0-9]+_P[0-9]+\.mesh_rsp[01]_in\.size 10

~die_0\.mesh\.rtr_X0_Y0.*\.req_p[0-9]+\.size 8
~die_0\.mesh\.rtr_X0_Y0.*\.snp_p[0-9]+\.size 8
~die_0\.mesh\.rtr_X0_Y0.*\.rsp[01]_p[0-9]+\.size 8
~die_0\.mesh\.rtr_X0_Y0.*\.dat[01]_p[0-9]+\.size 8

~die0_X[0-9]+_Y[0-9]+_P[0-9]+_D0.*_tx_[01]\.capacity 8
~die0_X[0-9]+_Y[0-9]+_P[12].*_tx_[01]\.capacity 8

# Total tracker entries: 96
~p.ha_0\.num_snp_entries 1
~p.ha_0\.num_sfv_entries 1
~p.ha_0\.num_platinum_entries 1
~p.ha_0\.num_gold_entries 4
~p.ha_0\.num_iron_entries 89
~p.ha_0\.cbusy\.throttle_start 96

# Phase Command Depth
~p.ha_0\.pha_phase_cmd.capacity 16

# Snoop filter
~pxha_0.snoop_filter.size 8388608 # 8192 sets
~pxha_0.snoop_filter.line_size 64
~pxha_0.snoop_filter.ways 16

~pmha_0.snoop_filter.size 16777216 # 16384 sets
~pmha_0.snoop_filter.line_size 64
~pmha_0.snoop_filter.ways 16


#core_0.brain_dead_limit 6000000
#~p.ha_0.tracker.dump_at_end true
