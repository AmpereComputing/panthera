cfg dn-quad1.cfg

+die_2.devices [
    { "type": "Core", "position": [0, 0, 2, 0], "agent_id":  0 }
]

core_0:cfg ../core/connor/connor.cfg

#Flex cache (2MB per core; 256KB per bank)
~core_0\.l2c\.banks\.bank_[0-9]+\.size 262144
~core_0\.l2c\.banks\.bank_[0-9]+\.ways 8
core_0.l2c.banks.ways_mask 0x3F # 6 ways for L2 and 2 ways for L3
