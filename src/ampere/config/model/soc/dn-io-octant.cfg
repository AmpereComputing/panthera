################################################################################
# Latency configuration
################################################################################

# Every CPX has a latency of 2 cycles going from RTR to Dev
# Every CPX has a latency of 1 cycle going from Dev to Rtr
# NOTE: The order of latency configuration matters as they are overriding
#       previous ones

# Cores
~die1_X[0134]_Y[0-3]_P0_[rsd].*rx.*\.latency 1         # CPX -> RTR
~die1_X[0134]_Y[0-3]_P0_[rsd].*tx.*\.latency 0         # RTR -> CPX
~die1_X[0134]_Y[0-3]_P0_D[0-3]_.*tx.*\.delay "1.166ns" # CPX -> Device
~die1_X[0134]_Y[0-3]_P0_D[0-3]_.*rx.*\.delay "1.333ns" # Device -> CPX

# PHAs
~die1_X[13]_Y[0-3]_P1_.*rx.*\.latency 1          # CPX -> RTR
~die1_X[13]_Y[0-3]_P1_.*tx.*\.latency 0          # RTR -> CPX
~die1_X[13]_Y[0-3]_P1_D[0-3]_.*tx.*\.latency 1   # CPX -> Device
~die1_X[13]_Y[0-3]_P1_D[0-3]_.*rx.*\.latency 0   # Device -> CPX
~die1_X2_Y[12]_P[01]_.*rx.*\.latency 1           # CPX -> RTR
~die1_X2_Y[12]_P[01]_.*tx.*\.latency 0           # RTR -> CPX
~die1_X2_Y[12]_P[01]_D[0-3]_.*tx.*\.latency 1    # CPX -> Device
~die1_X2_Y[12]_P[01]_D[0-3]_.*rx.*\.latency 0    # Device -> CPX

~die1_X4_Y[03]_P1_D[0-3]_.*tx.*\.delay 1.75ns # CPX -> Memory
~die1_X4_Y[03]_P1_D[0-3]_.*rx.*\.delay 1.63ns # Memory -> CPX

~die0_X0_Y2_P0_MP0_.*rx.*\.latency 3
~die0_X0_Y2_P0_MP0_.*tx.*\.latency 3

~die0_X[07]_Y1_P0_.*rx.*\.latency 4
~die0_X[07]_Y1_P0_.*tx.*\.latency 3

~die0_X[25]_Y1_P0_MP0_.*rx.*\.latency 4
~die0_X[25]_Y1_P0_MP0_.*tx.*\.latency 4

~die0_X[34]_Y3_P0_MP0_.*rx.*\.latency 4
~die0_X[34]_Y3_P0_MP0_.*tx.*\.latency 4

~die0_X6_Y0_P0_MP0_.*rx.*\.latency 4
~die0_X6_Y0_P0_MP0_.*tx.*\.latency 4

~die0_X7_Y2_P0_MP0_.*rx.*\.latency 4
~die0_X7_Y2_P0_MP0_.*tx.*\.latency 4

~die0_X[16]_Y3_P0_.*rx.*\.latency 5
~die0_X[16]_Y3_P0_.*tx.*\.latency 4

~die0_X[25]_Y2_P0_.*rx.*\.latency 5
~die0_X[25]_Y2_P0_.*tx.*\.latency 4

~die0_X[34]_Y0_P0_.*rx.*\.latency 5
~die0_X[34]_Y0_P0_.*tx.*\.latency 4

~die0_X1_Y0_P0_MP0_.*rx.*\.latency 5
~die0_X1_Y0_P0_MP0_.*tx.*\.latency 5

# ADI latency
~rdi_die1_X1_Y3_P2_to_die0_X3_Y2_P0_conn_a_.*\.latency 1 # actual 0, but zero delay loop
~rdi_die1_X2_Y3_P0_to_die0_X2_Y3_P0_conn_a_.*\.latency 1
~rdi_die1_X2_Y3_P2_to_die0_X1_Y2_P0_conn_a_.*\.latency 1 # actual 0, but zero delay loop
~rdi_die1_X3_Y3_P2_to_die0_X0_Y3_P0_conn_a_.*\.latency 1

~rdi_die1_X3_Y3_P2_to_die0_X0_Y3_P0_conn_b_.*\.latency 4
~rdi_die1_X2_Y3_P2_to_die0_X1_Y2_P0_conn_b_.*\.latency 5
~rdi_die1_X2_Y3_P0_to_die0_X2_Y3_P0_conn_b_.*\.latency 8
~rdi_die1_X1_Y3_P2_to_die0_X3_Y2_P0_conn_b_.*\.latency 8

