mesh.size_x 8
mesh.size_y 4
mesh.devices 4

~mesh\.rtr_X[0-9]+_Y[0-9]+\.routing_order yx

# Inter-router latencies and router ingress credits.

~mesh\.rtr_X[0-9]+_Y[0-9]+\.req_[snew]\.size 36
~mesh\.rtr_X[0-9]+_Y[0-9]+\.snp_[snew]\.size 36
~mesh\.rtr_X[0-9]+_Y[0-9]+\.rsp[01]_[snew]\.size 36
~mesh\.rtr_X[0-9]+_Y[0-9]+\.dat[01]_[snew]\.size 36

~mesh\.rtr_X[0-9]+_Y[0-9]+\.req_p[0-9]+\.size 16
~mesh\.rtr_X[0-9]+_Y[0-9]+\.snp_p[0-9]+\.size 16
~mesh\.rtr_X[0-9]+_Y[0-9]+\.rsp[01]_p[0-9]+\.size 16
~mesh\.rtr_X[0-9]+_Y[0-9]+\.dat[01]_p[0-9]+\.size 16

# Horizontal connections on mesh
~mesh\.X1_Y[0-3]_to_X2_Y[0-3]_.*\.latency 10
~mesh\.X3_Y[0-3]_to_X4_Y[0-3]_.*\.latency 18
~mesh\.X5_Y[0-3]_to_X6_Y[0-3]_.*\.latency 10

# Vertical connections on mesh
~mesh\.X[0-7]_Y1_to_X[0-7]_Y2_.*\.latency 12


# Port numbering:
#
#    0 | 1
#  ---RTR---
#    3 | 2
#
