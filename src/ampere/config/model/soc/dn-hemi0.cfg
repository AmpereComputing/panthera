num_die 5
clock_period 500ps # Same as Mesh clock so that FIFOs get built properly

die_0:cfg dn-iod.cfg
die_1:cfg dn-ccl.cfg
die_2:cfg dn-ccl.cfg
die_3:cfg dn-ccl.cfg
die_4:cfg dn-ccl.cfg

die_0.die_id 0
die_0.type IO

die_1.die_id 1

die_2.die_id 2

die_3.die_id 3

die_4.die_id 4
~die_[1-4].type CPU
~die_[0-4].clock_period 500ps # 2.0 GHz

data_bus_width 512

################################################################################
# System Address Map
################################################################################

system_address_map.ddr_snr_mode 2

################################################################################
# Memory Configuration
################################################################################

#~memory_[0-9]+:cfg ../mc/dn-mc-fixed-ccl.cfg
~memory_[0-9]+:cfg ../mc/dn-panem-12800-mrdimm.cfg
