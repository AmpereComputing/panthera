# These tables cover the routers with MCUs attached. Generally we don't
# expect cross-die traffic originating from these routers except for DMT
# going horiztonally. For the DMT case, though, we want to choose a
# target ADI based on the target core, whose agent ids are chosen to match
# up with their rows. Since horiztonal die are flipped upside down with
# respect to each other, the list reads backwards. I.e., if we're targeting
# row 0 in the far die, we want to exit row 3 in this die.
#
~die_[1234]\.mesh\.rtr_X4_Y[0-9]+\.die_to_die_lrt [
    { "die_id": 1, "entries": [[0, 3, 1, 0], [0, 2, 1, 0], [0, 1, 1, 0], [0, 0, 1, 0]]},
    { "die_id": 2, "entries": [[0, 3, 1, 0], [0, 2, 1, 0], [0, 1, 1, 0], [0, 0, 1, 0]]},
    { "die_id": 3, "entries": [[0, 3, 1, 0], [0, 2, 1, 0], [0, 1, 1, 0], [0, 0, 1, 0]]},
    { "die_id": 4, "entries": [[0, 3, 1, 0], [0, 2, 1, 0], [0, 1, 1, 0], [0, 0, 1, 0]]}
]
