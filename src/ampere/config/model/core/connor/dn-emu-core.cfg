cfg connor.cfg
# Supply instruction_stream_name for the stream to simulate.
gpc.max_instructions 10000000
gpc.heartbeat 5000

# Uncomment the two lines below for making the detailed core as stash only
#gpc.stash_only true
#bpu.stash_only true

~l2c.banks.bank_[0-9]+.size 458752    # 3.5 MB L2/L3
~l2c.banks.bank_[0-9]+.ways 14        # 14 way L2/L3
l2c.banks.ways_mask 0x3f              # 6 ways are dedicated to L2

l2c.sam.system_address_map.connect sys.soc_0.system_address_map
l2c.sam.type CDRN_SAM
l2c.sam.tgt_lut [
    64, 72, 80, 82,
    68, 76, 84, 86,
    67, 74, 81, 88,
    71, 78, 85, 92,
    73, 75, 83, 91,
    77, 79, 87, 95
]
