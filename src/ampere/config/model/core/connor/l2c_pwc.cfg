:cfg ../ripley/l2c_pwc.cfg

# Allow PWC write combining into oldest during drain
can_combine_with_oldest_during_drain true

# Increase default PWC timeout to 1024 cycles
max_age 4096
timeout 1024

# Allow any store to combine with the youngest entry of the previous PWC color
unordered_can_combine_with_previous_ordered 1
ordered_can_combine_with_youngest true
