:cfg ../trinity/pcp.cfg

# PCP Replay -- Any EL
recycle_tlb_miss true

# Only train prefetcher on first address of vector multiload instructions
ignore_other_loads_in_instruction true

# Make PCP more tolerant of out-of-order load issue
out_of_order_stride_match true

# Prefetches to TTBR1 space will no longer get dropped
upper_va_bits_bug false
