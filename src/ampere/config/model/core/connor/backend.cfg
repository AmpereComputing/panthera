cfg ../trinity/backend.cfg

#### Structure sizing ####

# Physical register file sizes
# predicate register file
idr.rf_pred.size 48
# limit number of concurrent gathers
# We now rely on the LOB to limit the number of inflight gathers so set this to
# something large to make it irrelevant
idr.gather_tbl.size 512

# Increase L2 latency by 1 cycle to account for increased size of FlexCache
# NOTE: the latency to ICF is also increased in frontend.cfg
lsu_to_l2_load_response.latency 2
l2_to_dmmu_response.latency 3
# L2 write conflict also increases by 1 cycle
l2c.bank_write_busy_mask 0x7f

# READ_DEALLOC/VICTIM no longer write array and therefore have shorter bank conflict
l2c.bank_read_dealloc_busy_mask 0xf
l2c.evict_at_fill true

# Increase core buffers to "contour 1"
idr.rob.size 256
idr.bob.size 72
idr.lob.size 88
idr.sob.size 48
idr.rf_int.size 220
idr.rf_fp.size 160
~idr.sch.[ABM]_P[01].size 28
~idr.sch.[XY]_P[01].size 26

#### IDR ####
# Note IDR lives in backend.cfg to make the perfect-frontend.cfg work correctly

# Cleaving
# Enable external and internal cleaving.
# Since uop groups can now have up to 8 uops, the bandwidth of various inter-unit interfaces has to be increased
dispatch.bandwidth 8
gpc_dispatch.bandwidth 8
idr_to_lsu_mem_rob_preview.bandwidth 8
# We also now read up to 8 instructions from the IQ, which makes fusion delay unnecessary
idr.inst_read_width 8
instruction_fifo_credit_return.bandwidth 8
idr.fusion_delay_enable false
# 2-uop instructions can come after any number of fusions -- 4 fusions
# consumes all 8 instructions so this limit has no effect. 3-uop and longer
# still can't start after 2 fusions.
idr.align_fusion_limit_2uop 4
idr.align_fusion_limit_long 2
idr.cleaving_enable_external true

# New counter-based partition balancing
idr.load_balance false
idr.swizzle false
idr.counter_balance true

# Avoid assigning uops to a full scheduler when possible
idr.int_scheduler_assignment.avoid_full true
idr.fp_scheduler_assignment.avoid_full true

# Use simpler and more consistent pipe assignment in cases when the exact choice doesn't matter
idr.simple_default_pipes true
idr.fp_scheduler_assignment.use_partition_for_default false

# Release IQ credits in DR03 instead of DR04
idr.dr03_iq_credit_return true

# Stop collapsing bubbles in the IDR pipeline
idr.pipeline.collapse_bubbles false

# Account frontend stalls towards flushes during static window following them
idr.improved_flow_tda_connor true

# Fix bug where dispatch stalls wait for more scheduler credits than necessary
idr.sched_credit_stall_bug false

#### IXU ####

# Don't block all scheduler deallocation whenever a load cancel is received
ixu.cancel_only_blocks_load_dep_dealloc true

# fsqrt fudge factor. We don't have correct latency from yaml.  fsqrt
# is actually variable latency on connor and we are considering
# implementing that.
ixu.extra_fsqrt_latency -3
# must list zero values to override values from prior projects
ixu.extra_gpr_div_latency 0

#### FSU ####

ixu.fsu_div_bypass_latency 2

# Deallocate 2 FSU scheduler entries per cycle
ixu.fsu_dealloc_per_cycle 2

# vector idiv/fdiv/sqrt early exit
ixu.vector_idiv_early_exit true
ixu.vector_fdiv_early_exit true
ixu.vector_sqrt_early_exit true

# variable latency for idiv, fdiv, fsqrt
# we still need to model variable latency fsqrt
ixu.idiv_use_value_derived_latency true
# only for f{32,64} fdiv on Connor, not f16.
ixu.fdiv_use_value_derived_latency true

# fsqrt odd powers of 2
ixu.fsqrt_early_exit_odd_powers_of_two true

ixu.fsu_bypass @fsu_bypass.json


#### GPC ####

# allows commiting 6 uops per cycle
gpc.uop_retire_width 6

# Reduce latency of SWOB drain double flush by 14(!) cycles
gpc.swob_drain_delay 0
gpc.no_restart_commit_freeze 1

#### LSU ####

# Go back to 4-cycle loads by adding a cycle on the bypass from IXU
lsu.lob_bypass_delay 1

# 2 Extra tag-read ports for sta_loads
lsu.store_pipes_have_tag_ports true

# Store-forwarding auxiliary table specifications
lsu.sf_predictor.aux_enable true
lsu.sf_predictor.aux_sfp.sets 1
lsu.sf_predictor.aux_sfp.ways 64
lsu.sf_predictor.aux_sfp.line_size 4
lsu.sf_predictor.aux_sfp.cache_replacement_policy.type NMRU
lsu.sf_predictor.aux_sfp.tag_bits 12
lsu.sf_predictor.initial_value 1
lsu.sf_predictor.max_value 1

# More precise RAW scrub checking on splits
lsu.snoop_match_high_half_upper_bit 27

# Allow partial-data store forwarding
lsu.enable_partial_data_fwd true

# Load Recycle Bypass to LA03 (i.e. faster recycles)
lsu.ld_fast_recycle_complete_pipe.latency 4
lsu.ld_recycle_complete_pipe.latency 4
lsu.ld_split_recycle_complete_pipe.latency 2
lsu.store_data_early_complete_pipe.latency 1
# But make write conflicts on port1 5 cycles to avoid a glass jaw beat pattern
lsu.slow_write_conflict_port1 true
lsu.ld_slow_recycle_complete_pipe.latency 5

# DTLB miss latency gets faster by one cycle in each direction
# LSU sends the request a cycle earlier.
# MMU responds a cycle earlier.
lsu_to_dmmu_request.latency 1
lsu_to_dmmu_response.latency 0

# Change DL1 replacement from LRU to PLRU -- saves bits with no measurable perf impact
lsu.l1d_cache.cache_replacement_policy.type PLRU

# PRFM uops should recycle on TLB miss
lsu.enable_early_prfm_tlb false

# Decouple LsuGpc.StDone from STA Pipeline (early store completion)
lsu.sus_skip_final_sta true
lsu.dmb_all_skip_final_sta true
lsu.dsb_skip_final_sta true
lsu.instantly_complete_uops_not_needing_sta true

# PCP Replay -- Any EL
lsu.pob.flush_on_el_change true

# POB Disabled When Gretch is Security-Disabled
lsu.pob.allocate_on_el0_only true

# Disable strict load/fill conflict
lsu.enable_refill_tag_conflict false
lsu.enable_fill_read_chunk_bank_conflicts true
lsu.spec_fills_cause_conflicts false
lsu.fill_speculative_wake_ixu false

# No opportunity for a store to "miss" a raw scrub on an in-flight load
lsu.in_flight_raw_scrub_window 0

# Grow OFB from 12 to 20 entries
lsu.ofb.entries 20

# Back-to-back same bytes accesses
lsu.back_to_back_read_no_conflicts_other true
lsu.back_to_back_any_way true

# Disable write/fill conflict with tag-read
lsu.write_conflict_can_miss true

#### MMU ####
# Decrease flush window from 9 to 5
dmmu.otb.flush_allocation_lockout_cycles 5

# Ensure nonspec requests can allocate OTB ASAP
dmmu.otb.reserve_for_oldest_after_full true

# Consume OTB Full from MMU to sleep uops that need a translation
# but can't due to OTB capacity
lsu.otb_full_sleep true

# Temporarily reserve OFB entry for oldest load when FULL
lsu.ofb.reserve_for_oldest_after_full true
lsu.ofb.almost_full_sleep false

# Prefetcher improvements
lsu.prefetcher:override-cfg lsu_prefetcher.cfg

#### L2C ####

# 3.5MB 14-way physical cache, divided by default into 2.5MB 10-way L2 and 1.0MB 4-way L3
~l2c.banks.bank_[0-9]+.ways 10
~l2c.banks.bank_[0-9]+.size 327680

# Matrix enables 64B fills
l2c.use_fill_first_flit false

# Improved L2 bank and set hashing
l2c.banks.simple_bank_hash true
l2c.banks.high_bank_hash_bit 14
l2c.banks.connor_set_hash true

# Use DRRIP replacement policy, sampling 1/128 of sets
l2c.banks.l2_replacement_policy:override-cfg l2c_replacement_policy.cfg

# Make store completion for barriers 2 cycles faster to PWC, and 1 cycle faster to LSU
#
# fast_write_complete pulls in store completion in the L2 pipe by 2 cycles, which speeds up everything.
# So we add 1 to the latency for barrier and stlr completion, so the net improvement is only 1 cycle.
# And exclusives should not improve at all, so we add 2 to the exclusive delay so that there is no net change.
l2c.fast_write_complete true
lsu.barrier_wakeup_delay 8
lsu.stlr_wakeup_delay_pipe.latency 8
lsu.exclusive_return_delay_pipe.latency 2

# Increase PWC starvation timeout to 10 cycles
l2c.write_priority_age_threshold 10

# L2 BOP adjustments
l2c.prefetcher:override-cfg l2c_prefetcher.cfg

# Grow fill buffers to 64, but assume 1 is reserved for stashes on average
~l2c.banks.fb_credits_[0-9]+.size 7
l2c.cbusy.throttle_max 56

# Grow prefetch queue to 16 entries, and schedule across all of them
l2c.prefetch_capacity 16
l2c.prefetch_arb_depth 16

# L2C PWC
l2c.pwc:override-cfg l2c_pwc.cfg
