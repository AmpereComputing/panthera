# This file is used for Connor Bobcat studies (in addition to being included
# for full core studies). When using with bobcat, specify with -top.core:cfg
#
# Here is a sample experiment config:
# [
#   {
#      "name": "base",
#      "exe": "{panthera_root}/bin/bobcat",
#      "parameters": [
#          "-quiet", "1",
#          "-top.core:cfg", "{panthera_root}/config/model/core/connor/connor-tage.cfg",
#          "-top.core.bpu.max_instructions", "200000",
#          "-csv", "{directory}/{job_name}.csv",
#          "-is", "{workload_path}"
#      ]
#    }
# ]

cfg "../trinity/trinity-tage.cfg"
:cfg "decode.cfg"

# NNP update logic: Don't invalidate/replace two ways for the same update,
# allocate new entries as not-useful.
bpu.np.allocate_useful false
bpu.nnp.allocate_useful false
bpu.np.update_hit_before_victim true
bpu.nnp.update_hit_before_victim true

# Double the number of sets in the NNP
bpu.nnp.sets 128

# Improve the NNP index function
bpu.nnp.connor_index_hash true

# Reduce RSB size to 32
bpu.tage.rsb.max_size 32
bpu.tage.rsb.committed_call_threshold 16

# Increase ITTAGE to 6 arrays, use longer histories, share single alt counter
bpu.tage.num_iglobals 6
bpu.tage.iglobals_per_alt_counter 6
bpu.tage.iglobal_0.history_size 4
bpu.tage.iglobal_1.history_size 10
bpu.tage.iglobal_2.history_size 21
bpu.tage.iglobal_3.history_size 44
bpu.tage.iglobal_4.history_size 93
bpu.tage.iglobal_5.history_size 192

# Clock-gate unused TAGE arrays to save power
~bpu.tage.global_[0-9]+\.gate_after_predictions_since_usage 1024

# Tag BTB, NNP, and NP with EL and SS (stealing 2 bits of the tags)
bpu.tage.btb.tag_bits 8
bpu.nnp.tag_bits 8
bpu.np.tag_bits 8

bpu.context_token_bits 128
