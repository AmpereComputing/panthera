# Use DRRIP replacement policy, sampling 1/128 of sets
# Remove priority which tried to preserve in-L1 lines since we no longer clear those bits
type L2DRRIP
l1_priority false

# Increase the size of the RRIP age counter to 3 bits
rrip_max 7

# Replace round-robin tiebreak with one that favors evicting dirty lines
use_round_robin false
dirty_tiebreak true
