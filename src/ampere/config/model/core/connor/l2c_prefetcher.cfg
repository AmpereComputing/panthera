cfg ../trinity/l2c_prefetcher.cfg

# Fill LSU/prefetch-only requests into L2 BOP RRT
prefetch_fill_data_only true

# Remove page-crossing check at L2 BOP RRT insertion
skip_cross_page_check_at_insertion true

# BOP: Prevent RRT hit when trainaddr - testoffset crosses a page boundary
skip_cross_page_check_at_train false

# Fix bugs in how we choose the best and second-best offsets
use_tiebreak true
