cfg ../trinity/frontend.cfg
:cfg "../connor/connor-tage.cfg"

# Increase L2 latency by 1 cycle to account for increased size of FlexCache
# NOTE: the latency to LSU and MMU is also increased in backend.cfg
icf_to_l2_response.latency 2

#### BPU ####

# Deallocate 2 BOB entries per cycle in most cases
bpu.commits_per_cycle 2

# Update the loop predictor lockout configuration to attempt to limit the
# performance loss to roughly 10% for the worst case (this is not expected to
# be the common case, but is intended to limit the worst-case "glass jaw"
# performance)
bpu.loop_prediction_lockout_hit_threshold 8
bpu.loop_prediction_lockout_epoch 1024
bpu.loop_prediction_lockout_length 2048

#### ICF ####

# Reclaim flushed IFBs
icf.ifb.reclaim_cleared_on_hit true

# Do not clear IL0 on GPC flush
icf.clear_l0_on_flush false

# Increase IL0 to 8-ways
icf.l0.ways 8

# Limit 'active' (non-cleared) IFBs to 5
icf.ifb.max_active_entries 5

# Use pseudo-LRU for IL1
icf.cache.cache_replacement_policy.type PLRU

# Evict at fill rather than miss
icf.fake_evict_at_miss false

# Write instructions into the IQ from both halves of the line at once
icf.half_cacheline_fetch false

# Disable IQ watermark stall to help the IQ keep up with IDR
icf.fifo_free_watermark 0

# Only count L1I_CACHE and L1I_CACHE_RD events once, even on a miss (misses
# which were subsequently filled used to count twice)
icf.l1i_access_pmus_only_once true

# Fix ICF coherence bug(s)
icf.ifb.snoop_policy restart_oldest_on_any_hit
