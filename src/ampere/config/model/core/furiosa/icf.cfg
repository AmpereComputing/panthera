# Core Instruction TLB parameters
itlb.ways 4
itlb.sets 16
itlb.line_size 4096
tlbi_stall_latency 16
itlb.invalidate_duplicates_before_fill true

# ICF instruction fill buffer: 32 entries virtual, 16 physical
# IFB size, number of outstanding instruction cache misses
~ifb.credits_[0-1].size 16

# The request FIFO between ICF and L2C can hold up to 3 requests
ifb.l2c_fifo.size 3

# Core instruction cache size is 16kB using 4 ways
cache.size 16384
cache.ways 4

# IL1 has unique LRU behavior where an invalidated line remains MRU and is not
# first to be chosen for the next replacement.
cache.cache_replacement_policy.type IL1LRU
cache.crp_victim_always true

instruction_fifo.size 32
