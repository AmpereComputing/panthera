# Core LSU SOB & LOB sizes
lob.size 64
sob.size 40
rob.size 192
bob.size 64

# IDR prevents dispatching of IDR-executed uops to the IXU
execute_idr_uops false

# Physical register file sizes
rf_int.size 160
rf_flag.size 48
rf_fp.size 128
rf_pred.size 0

# Allow IDR to balance scheduler resources
pipe_balancing true

# Allow IDR to balance partitions by loading at ld str uops
swizzle true

# RTL implimented Swizzle differently than our intentions
swizzle_table @swizzle.json

# The IDR pipeline can collapse bubbles if rename is stalled and an earlier
# stage can proceed
pipeline.collapse_bubbles true

# IXU pipe assignemnt
int_scheduler_assignment.type BinaryIDRSchedulerAssignment
int_scheduler_assignment.first_scheduler A
int_scheduler_assignment.second_scheduler B

# FSU pipe assignemnt
fp_scheduler_assignment.type BinaryIDRSchedulerAssignment
fp_scheduler_assignment.first_scheduler X
fp_scheduler_assignment.second_scheduler Y
fp_scheduler_assignment.use_partition_for_default true
