clock_period "333ps"
decoders ["furiosa"]

:cfg "frontend.cfg"
:cfg "backend.cfg"

# Frontend credit return bandwidths
bob_credit_return_fifo.bandwidth 4
feq_credit_return_fifo.bandwidth 8

# ICF to IDR instruction FIFO
icf_out_to_idr_in_fifo.bandwidth 8
icf_out_to_idr_in_fifo.latency 0
instruction_fifo_credit_return.bandwidth 5

# IDR can dispatch 4 uops per cycle to the IXU
dispatch.bandwidth 4
gpc_dispatch.bandwidth 4
idr_to_lsu_mem_rob_preview.bandwidth 4
bob_alloc.bandwidth 4
