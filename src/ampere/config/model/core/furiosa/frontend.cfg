# Default BPU is TAGE
bpu:cfg "tage.cfg"
immu:cfg "immu.cfg"
icf:cfg "icf.cfg"

# FIFO from the BP to the ICF
bpu.feq.size 32

bpu_to_icf_fetch_fifo.latency 0
bp_clear.latency 0

# Put BPU to sleep once the FEQ is full
bpu.feq_sleep_threshold 1
bpu.feq_wake_threshold 8

# ICF to MMU interface
# Shorten MMU 'Ack' round-trip latency to one cycle by sending responses same-cycle
icf_immu_request.latency 0
icf_immu_request.bandwidth 2
icf_immu_ack.bandwidth 2
icf_immu_response.bandwidth 1
icf_immu_response.latency 2
immu.otb.deallocation_latency 2

# ICF to L2C interface
icf_to_l2_request.latency 1
icf_to_l2_response.latency 1

instruction_fifo_credit_return.latency 2
