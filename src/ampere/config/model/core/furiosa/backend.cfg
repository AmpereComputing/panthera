# Common widths
~lsu\.?.*\.load_pipelines 2

idr:cfg "idr.cfg"
ixu:cfg "ixu.cfg"
dmmu:cfg "dmmu.cfg"
lsu:cfg "lsu.cfg"
l2c:cfg "l2c.cfg"

# Minimum number of cycles from GPC issue to commit
gpc.fsu_commit_latency 9

# Add 1 cycle of delay from FSU compute to uop is ready to commit
gpc.enable_fsu_commit_delay true

# Core has 4 AGUs, 4 ALUs, 1 long-latency ALU, and 3 FP/SIMD units
~.*num_execution_units 31

# Delay to model load L1D completion pipeline latency
lsu.load_complete_pipe.latency 3
~lsu_to_ixu_.*_writeback.latency 0
~lsu_to_ixu_.*_complete.latency 0
load_cancel.latency 3

# Store pipes bandwidth should be 2 to accommodate STA and STD
# Set all IXU-to-LSU pipes to bandwidth 2 so that we don't need to know
# which ones are for stores
~lsu_to_ixu_mem[0-9]+_writeback.bandwidth 2
~lsu_to_ixu_mem[0-9]+_complete.bandwidth 2

# IXU/LSU SUS double fire

# Zero cycle delay for signaling branch mispredict to GPC
~branch_mispredict_[0-9]+\.latency 0
~indirect_branch_mispredict_[0-9]+\.latency 0

# Number of uops that IXU can send to GPC to commit
ixu_to_gpc_commit.bandwidth 64
gpc.commit_delay.bandwidth 64

# Scheduler widths
ixu.sch_group_size_int 3
ixu.sch_group_size_mem 3
ixu.sch_group_size_fp 3

ixu.fsu_flags_latency 7

# IXU/SCH size (must be multiple of sch_group_size)
~idr.sch.[ABM]_P[01].size 21

# FSU/SCH size (must be multiple of sch_group_size)
~idr.sch.[XY]_P[01].size 24

# LSU to L2C interface
lsu.ofb.entries 12
lsu.ofb.allocations_per_partition 1
lsu_to_l2_load_request.bandwidth=lsu.load_pipelines
lsu_to_l2_load_request.latency 1
lsu_to_l2_store_request.bandwidth 1
lsu_to_l2_store_request.latency 1
lsu_to_l2_store_request.capacity 2
lsu_to_l2_load_response.bandwidth 1
lsu_to_l2_load_response.latency 1

# These add latency to match L2C and LSU pipelines for barriers
lsu.barrier_wakeup_delay 7
lsu.exclusive_return_delay_pipe.latency 2
lsu.stlr_wakeup_delay_pipe.latency 7

# LSU to MMU interface
lsu_to_dmmu_request.latency 2
lsu_to_dmmu_request.bandwidth 2
lsu_to_dmmu_ack.latency 0
lsu_to_dmmu_ack.bandwidth 2
lsu_to_dmmu_response.bandwidth 1
lsu_to_dmmu_response.latency 1
dmmu.otb.deallocation_latency 2
l2c.mmu_filter_bits 8

# L2 to DMMU interface
dmmu_to_l2_request.latency 2
l2_to_dmmu_response.latency 2
