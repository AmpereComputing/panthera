# Instruction MMU parameters (L2 tlb has 768 entries)
lookup_pipe_latency 3
s1tpc_pipe_latency 3
walk_pipe_latency 6

otb.entries 8
otb.combine_duplicates false

walk_fsms.size 2

tlb.line_size 4096
tlb.sets 128
tlb.ways 6
tlb.cache_replacement_policy.type PLRU6
tlb.invalidate_duplicates_before_fill true

s1tpc.sets 1
s1tpc.ways 16
s1tpc.cache_replacement_policy.type NMRU
s1tpc.invalidate_duplicates_before_fill true
