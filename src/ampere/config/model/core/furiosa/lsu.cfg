# Core data cache size is 64kB using 4 ways
l1d_cache.size 65536
l1d_cache.ways 4
l1d_cache.phys_addr_tag_lower_bit 12

# Core Data TLB parameters
dl1tlb.ways 64
dl1tlb.sets 1
dl1tlb.line_size 4096
dl1tlb.cache_replacement_policy.type NMRU
dl1tlb.invalidate_duplicates_after_fill true

# Core load & store pipe sizes / configs
load_pipes=load_pipelines
store_pipes 4

# LSU options
sf_predictor.sets 512
sf_predictor.ways 1
sf_predictor.line_size 4
sf_predictor.initial_value 3
sf_predictor.forward_value 1
enable_ofb_update_to_older_req true
enable_read_read_chunk_conflicts true
enable_write_read_chunk_bank_conflicts true
enable_mte false
enable_oracle_store_forwarding false

# Delay to model load recycle latency (should be same as load pipeline completion latency)
ld_recycle_complete_pipe.latency 6
ld_fast_recycle_complete_pipe.latency 5
ld_split_recycle_complete_pipe.latency 3
st_recycle_complete_pipe.latency 2
st_exec_recycle_complete_pipe.latency 6

# Delay to model store address pipeline latency
store_complete_pipe.latency 3

# Delay to model store data pipeline latency
store_data_complete_pipe.latency 2
store_data_early_complete_pipe.latency 2

# Delay to model DMMU fill pipeline latency
lsu_to_dmmu_response_complete_pipe.latency 2
lsu_to_dmmu_response_complete_pipe.bandwidth 1
lsu_to_dmmu_wakeup_pipe.latency 3
lsu_to_dmmu_wakeup_pipe.bandwidth 1

# Delay to model L1D fill pipeline latency
lsu_to_l2c_response_complete_pipe.latency 3
snoop_exclusion_window=lsu_to_l2c_response_complete_pipe.latency

# LSU prefetcher
prefetcher:cfg lsu_prefetcher.cfg

# By default we do not limit the number of OFBs that can be used by L1 prefetches
pfb.size=ofb.entries

# Change load/store RAW error check to 4 byte granularity
raw_scrub_granularity 4
