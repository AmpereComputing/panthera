# FSU doesn't have really have writeback conflicts.
~xu.[XY]_P[01].max_writebacks 64

# FSU flag producer to IXU flag consumer takes extra time
# Reduction in delay for FSU flag producer to IXU flag consumer
fsu_flag_wb_delay 2
fsu_f2i_delay 2
fsu_i2f_exe_latency 2

fsu_bypass @fsu_bypass.json

fsu_flags_latency 7
fsu_predicate_latency 5
fsu_div_bypass_latency 3
