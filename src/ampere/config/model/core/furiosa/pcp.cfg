# LSU PCP config
type L1P_PCP

# PCP table size increase to 128, since 256 doesn't seem feasible
table.line_size 4
table.sets 128
table.ways 1
# PCP increased stride range
addr_mask 0x1fff8
# remove duplicate requests
remove_dup false
# aggressive max stride
stride_mult_max 16
truncate_offset_bug true
# generate prefetches even if training detects a stride of zero
drop_zero_stride_prefetches false
# PCP usage of LSU's OFB entries for prefetch
page_fetch true

# Prefetches to TTBR1 space will get dropped because VA is always zero-extended
upper_va_bits_bug true

pipe.bandwidth=load_pipelines
pipe.latency 4

prefetch_requests.bandwidth=load_pipelines
prefetch_requests.capacity=load_pipelines
prefetch_requests.lossy true
prefetch_requests.return_latency 0
