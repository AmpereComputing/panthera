clock_period "333ps"
decoders ["furiosa"]

perfect_frontend true
:cfg "../furiosa/backend.cfg"

# Frontend credit return bandwidths
# bob_credit_return_fifo bandwidth is automatically set to match GPC commit width
feq_credit_return_fifo.bandwidth 8

# ICF to IDR instruction fifo has a 0 cycle bypass
pfe_out_to_idr_in_fifo.bandwidth 256
pfe_out_to_idr_in_fifo.latency 0
pfe.instruction_fifo.size 32
instruction_fifo_credit_return.bandwidth 256

# IDR can dispatch 4 uops per cycle to the IXU
dispatch.bandwidth 4
gpc_dispatch.bandwidth 4
idr_to_lsu_mem_rob_preview.bandwidth 4
bob_alloc.bandwidth 4
