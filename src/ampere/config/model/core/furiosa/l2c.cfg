# L2C PWC configuration
pwc:cfg l2c_pwc.cfg

# L2C Bank and hashing configuration
num_banks 8
banks.bank_hash_polynomial 11
banks.low_bank_hash_bit 6
banks.high_bank_hash_bit 11
banks.num_credit_pools=num_banks
banks.num_address_credit_pools=num_banks
banks.num_eviction_credit_pools 1
banks.num_write_credit_pools 1
banks.num_data_credit_pools 1
~banks\.fb_credits_[0-9]+\.size 6
# Split data and addr fb credits are not implemented so set them large to not impact normal allocation
~banks\.address_fb_credits_[0-9]+\.size 8191
~banks\.eviction_fb_credits_[0-9]+\.size 8191
~banks\.write_fb_credits_[0-9]+\.size 8191
~banks\.data_fb_credits_[0-9]+\.size 8191

# L2C configuration (per bank)
~banks.bank_[0-9]+\.size 262144
~banks.bank_[0-9]+\.ways 8
# By default the credit pool numbers are set to the bank number,
# so no need to set the credit_pool and address_credit_pool
# All data-FB pools are global
~banks.bank_[0-9]+.eviction_credit_pool 0
~banks.bank_[0-9]+.write_credit_pool 0
~banks.bank_[0-9]+.data_credit_pool 0

# L2C pipeline depth (6 cycle internal, 11 cycle load-use)
bank_read_busy_mask 0xf
bank_write_busy_mask 0x3f
read_pipe.process.index 4
read_pipe.writeback.index 5
read_pipe.system.index 7
write_pipe.process.index 4
write_pipe.writeback.index 5
write_pipe.write_complete.index 6
write_pipe.system.index 7
sys_pipe.process.index 1
sys_pipe.system.index 4

# L2C arbiter inputs -- how many of each request type considered for scheduling in each cycle
immu_arb_depth 1
dmmu_arb_depth 1
prefetch_arb_depth 1
srq_arb_depth 1

# L2C Prefetcher
prefetcher:cfg l2c_prefetcher.cfg
prefetch_request_port.latency 1
prefetch_request_port.capacity 8
prefetch_request_port.bandwidth 4

# Clear prefetched bit in L2C line when it's hit by a demand load
# Added on B0 stepping
prefetch_clear_on_hit true

# Silicon-derived cbusy configuration
cbusy.threshold_up 56
cbusy.threshold_down 8
cbusy.step_up 4
cbusy.step_down 4
cbusy.throttle_max 48
cbusy.throttle_min 6
