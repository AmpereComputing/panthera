# Make the BPU predict perfectly
bpu.perfect true

# Allow the BPU to commit 99 branches per cycle
bpu.commits_per_cycle 99

# and the ICF and ITLB never miss
icf.cache.enable_perfect_mode true
icf.itlb.enable_perfect_mode true

# Enable fetching instructions across half-cacheline boundaries
icf.half_cacheline_fetch false

# Increase ICF -> IDR bandwidth to support writing a full cacheline worth of
# instructions every cycle
icf_out_to_idr_in_fifo.bandwidth 16

# The "perfect" ITLB doesn't know the right answer, so correct it with the
# instruction stream's version
icf.ignore_itlb_pa true
