# This file is used for Trinity Bobcat studies (in addition to being included
# for full core studies). When using with bobcat, specify with -top.core:cfg
#
# Here is a sample experiment config:
# [
#   {
#      "name": "base",
#      "exe": "{panthera_root}/bin/bobcat",
#      "parameters": [
#          "-quiet", "1",
#          "-top.core:cfg", "{panthera_root}/config/model/core/trinity/trinity-tage.cfg",
#          "-top.core.bpu.max_instructions", "200000",
#          "-csv", "{directory}/{job_name}.csv",
#          "-is", "{workload_path}"
#      ]
#    }
# ]

cfg "../ripley/ripley-tage.cfg"
:cfg decode.cfg

#### BPU ####

# Selective BTB invalidation on BTC clear
# 2022/10/31 Design reports that we will have to invalidate pairs of ways
# instead of only the way used for the cleared prediction due to limitations of
# the array macro used for the BTB
bpu.tage.btb.paired_btc_clear_invalidation true

# Next Predictor (guess at parameters)
# Used/trained on first prediction following a misprediction flush
# (modified to be any flush or BTC clear by
bpu.np_on_flush true
bpu.np.act_as_np true
bpu.np.sets 64
bpu.np.ways 1
bpu.np.tag_bits 10
bpu.np.bottom_set_bit 4
