cfg ../ripley/frontend.cfg
:cfg trinity-tage.cfg
:cfg trinity-loop-detector.cfg

#### BPU ####
# Note: This config file only contains BPU configs which do not also apply to
# bobcat (i.e. timing-specific things)

# Frontend repipeline for Trinity - delays ID (data) pipeline a
# cycle later relative to IT (tags), but moves IT pipeline a cycle earlier
# relative to GPC flush (it stays one cycle ahead until the first frontend
# clear)
icf.trinity_repipeline true

# Frontend throttling (by reducing FEQ size) to avoid wasted work
bpu.feq_throttling_enabled true

#### ICF ####

# 32KB I-cache, and as a result we no longer clear the in-IL1 bit in L2
icf.cache.size 32768
l2c.never_clear_l1i true

# Increase IL0 to 4 entries (from 1 in Ripley)
icf.l0.sets 1
icf.l0.ways 4
icf.clear_l0_on_flush true
# And filter updates through a candidate table to reduce wasted fills. In order
# to be filled in the IL0, a line must first be installed in, and then hit
# *twice* in the candidate table.
icf.use_l0_candidates_table true
icf.l0_candidates.ways=icf.l0.ways
icf.l0_candidates.sets=icf.l0.sets
icf.l0_candidates.required_lookups 2

#### MMU ####

# Combine MMU requests in 64k regions when using 64k pages
# In RTL this is implemented in the LSU and ICF by zeroing VA[15:12] on all requests in 64k mode
immu.otb.64k_duplicate_check true
