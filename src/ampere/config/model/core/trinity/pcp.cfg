cfg ../ripley/pcp.cfg

# PCP stride multiplier improvements (aimed at increasing accuracy, reducing
# unhelpful memory accesses)
stride_mult_once_per_ofb true
multiplier_decrease_on_stride_mismatch true
enable_slow_stride_increase true

# Revert Ripley change to do PCP prefetches on transition to ACT_LO -- no longer useful after changes above
prefetch_in_active_lo false
