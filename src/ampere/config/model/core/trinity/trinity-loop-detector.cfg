# Loop detector
bpu.ld_enabled true
bpu.ld.iq_size=icf.instruction_fifo.size
icf_out_to_idr_in_fifo.bandwidth=icf.instruction_fifo.size
bpu.ld.history_comparison_depth 32
bpu.ld.abort_on_btb_clear false
bpu.ld.prediction_table.line_size 2
bpu.ld.prediction_table.sets 1
bpu.ld.prediction_table.ways 4

bpu.ld.enable_predictor true
bpu.ld.predictor_history_comparison_depth 4
bpu.ld.predictor_history_saturation_depth 4
bpu.ld.prediction_confidence_threshold 4
bpu.ld.prediction_max_confidence 8
bpu.ld.minimum_predicted_looped_instructions 192
bpu.ld.only_predict_conditionals true
bpu.ld.only_predict_directs true
bpu.ld.predictor_match_iteration_count false
icf.loop_start_lockout 1
