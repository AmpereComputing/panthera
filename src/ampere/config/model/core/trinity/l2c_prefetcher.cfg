cfg ../ripley/l2c_prefetcher.cfg

# Only train BOP and generate L2 prefetches on LSU requests
prefetch_data_only true

# Set BOP bad-score threshold to 24 to save bandwidth and improve accuracy
# Hardware default remains the same; this can be programmed via firmware.
bad_score 24
second_bad_score 28
