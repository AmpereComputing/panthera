cfg ../ripley/backend.cfg

#### Structure sizing ####

# Physical register file sizes
# alloc FLGT0 for some Trinity integer uops (and SVE in future chips)
idr.tmp_flag_enable true

#### IDR ####

# Fuse nops and unconditional direct branches to almost any preceding instruction
idr.fusion_direct_branch true
idr.fusion_nop true

# Move elimination for integer reg-reg moves and move of zero to an integer register
idr.enable_move_elim_int_reg true
idr.move_elim_max_counter 2
# Update 2/15/23: elimination of move zero didn't make the schedule, pushed to Connor
idr.enable_move_elim_int_zero false

# Additional MOVZ / MOVK fusion
# NOTE: This also requires Trinity fusion.xlat file
idr.fusion_mov_mov_trinity true

# disable Ripley AES fusion delay logic. Trinity (onwards) get fusion
# delay hints from RTL XLAT.
idr.fusion_aes_delay_ripley false

# SWOB enhancements
# Disable SWOB timeout
idr.swob_drain_timeout_enable false
# Conditional (address checked) SWOB RAW flushes
idr.swob_raw_cam_check_enable true
# SPSR/ELR self sync removal
idr.improved_spr_behavior true

# FSU SchY throttling based on occupancy
#idr.scheduler_throttle.type IDRSchedulerThrottleWatermark
#idr.scheduler_throttle.watermark_scheduler X
#idr.scheduler_throttle.throttle_scheduler Y
#idr.scheduler_throttle.unthrottle_watermark 13
#idr.scheduler_throttle.throttle_watermark 5

# BOB ID stalls are counted as Backend Stalls
idr.bob_stall_is_backend_stall true

# IDR throttling to 2-wide based on IXU+FSU throughput -- disabled for now pending power feedback and tuning
#idr.width_throttle.type IDRWidthThrottleIXUFSUThroughput
#idr.width_throttle.throttle_width 2
ixu.throttle_watermark_lo_ixu 0.5
ixu.throttle_watermark_hi_ixu 0.5
ixu.throttle_watermark_lo_fsu 0.25
ixu.throttle_watermark_hi_fsu 0.25

#### IXU ####

# Trinity divides are showing up as too fast when compared to RTL.
# These "extra_*" parameters are to help us pad out panthera execution
# to match RTL so that RTL-PV work is not thrown off by this
# descrepancy. These are for the div_wb delay before entering the Z pipe.
ixu.extra_advsimd_fdiv_latency 0
ixu.extra_gpr_div_latency      3   # excludes early out
ixu.extra_scalar_fdiv_latency  0   # includes early out

ixu.fsu_f2i_delay 1

# Shared radix-16 divider for integer and FP
# 7 cycles if you count 3cyc on zpipe. This is just the xpipe portion.
ixu.idiv_early_exit_latency 4

#### FSU ####

ixu.fsu_flags_latency 5
ixu.fsu_zpipe true
~ixu.xu.Z_P[01].force_latency 3

ixu.fsu_bypass @fsu_bypass.json
ixu.fdiv_early_exit_latency 7 # for radix16 divider

# Remove groups and move to a flattened scheduler
~idr.sch.[XY]_P[01].size 18
ixu.sch_group_size_fp 1
ixu.fsu_dealloc_per_cycle 1

# 12x2 geometry for A/B/Mem schedulers
~idr.sch.[ABM]_P[01].size 24
ixu.sch_group_size_int 2
ixu.sch_group_size_mem 2

#### LSU ####

# 3-cycle DL1
lsu.load_complete_pipe.latency 2
load_cancel.latency 2
lsu.threecyc_conflict true
# Recycle latency stays the same: split recycle has to go up by 1 to compensate
# for the shorter load latency; the other recycles are in absolute cycles.
lsu.ld_split_recycle_complete_pipe.latency 4
# MLB deallocation doesn't move, so it is a cycle later relative to load completion
lsu.mlb_entry_release_pipe.latency 2
# This Ripley optimization also no longer works for timing
lsu.duplicate_loads_allowed false

# LSU prefetcher improvements
lsu.prefetcher:override-cfg lsu_prefetcher.cfg

# Single-uop stores go to sleep waiting for their data instead of recycling endlessly
lsu.enable_sus_recycle false

# Several improvements to load-acquire
lsu.acquire_can_skip true
lsu.acquire_sleep_on_all_barriers false
lsu.acquire_sleep_on_done_exclusive false
lsu.acquire_wake_waits_till_older_retire_stlrs true

# Make store prefetches execute speculatively
lsu.store_prefetch_nonspec false

# Atomics stall in LR04 instead of LR02, reducing latency of data return by 2 cycles
lsu.exclusive_return_delay_pipe.latency 0

# Support non-temporal loads and stores
lsu.enable_nontemporals 1

#### MMU ####

# Combine MMU requests in 64k regions when using 64k pages
# In RTL this is implemented in the LSU and ICF by zeroing VA[15:12] on all requests in 64k mode
dmmu.otb.64k_duplicate_check true

# Single MMU with 2560-entry TLB -- in unified MMU mode the 'dmmu' module is the active one
#
# Use true LRU for replacement, and don't update LRU on fills (only on hits)
unified_mmu true
dmmu.tlb.sets 512
dmmu.tlb.ways 5
dmmu.walk_fsms.size 2
dmmu.s1tpc.ways 16
dmmu.separate_mru true
dmmu.tlb.cache_replacement_policy.type LRU
dmmu.tlb.crp_update_on_fill false

# MMU flush window increased from 5 to 9
dmmu.otb.flush_allocation_lockout_cycles 9

# Support contiguous bit at the last level of the page walk
dmmu.enable_contiguous_bit true

# Prioritize scheduling Non-speculative OTB entry
dmmu.otb.prioritize_scheduling_non_spec true

# Round-robin OTB scheduling
dmmu.otb.round_robin_scheduling true
dmmu.otb.alternate_first_last_scheduling true

# 12-entry shared OTB
dmmu.allocation_fairness true
dmmu.otb.entries 12
dmmu.otb.sectioned true
dmmu.otb.lsu_sections=lsu.load_pipelines
~dmmu.otb.sections.LSU_[01].size 2
dmmu.otb.sections.ICF.size 2
dmmu.otb.sections.Shared.size 6

#### L2C ####

# L2 pipeline scheduling improvement -- a second op to the same bank can schedule 2 cycles after the last one
# Didn't make the cut for Trinity due to L2 resource constraints
#l2c.bank_read_busy_mask 0xb
#l2c.bank_write_busy_mask 0x3b

# Each pair of L2 banks shares 12 fill buffers, instead of each bank having 6
# Didn't make the cut for Trinity due to L2 resource constraints
#l2c.banks.num_credit_pools 4
#~l2c.banks\.fb_credits_[0-9]+\.size 12
#l2c.banks.bank_0.credit_pool 0
#l2c.banks.bank_1.credit_pool 0
#l2c.banks.bank_2.credit_pool 1
#l2c.banks.bank_3.credit_pool 1
#l2c.banks.bank_4.credit_pool 2
#l2c.banks.bank_5.credit_pool 2
#l2c.banks.bank_6.credit_pool 3
#l2c.banks.bank_7.credit_pool 3

# Use RRIP as replacement policy for L2
l2c.banks.l2_replacement_policy:cfg l2c_replacement_policy.cfg

# L2C prefetcher improvements
l2c.prefetcher:override-cfg l2c_prefetcher.cfg

# LSU removed its L2-way storage, so we now allow synonyms and never clear the in-DL1 inclusion bit
l2c.enable_synonym_snoops false
l2c.never_clear_l1d true

# Send CompAck as soon as we get a response from the HNF, even if we don't have the data yet
l2c.early_comp_ack_enable true

# Complete barrier when CompAck is sent
# This change originated with Connor and was later adopted by Trinity.
l2c.comp_ack_releases_barrier true
