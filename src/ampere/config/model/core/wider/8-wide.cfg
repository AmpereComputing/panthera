:cfg 8-wide-base.cfg

# Increase the IQ write bandwidth to match the number of instructions
# we can read, and increase the capacity to prevent underflow
icf.iq_write_max_instrs 16
icf.instruction_fifo.size 64
bpu.commits_per_cycle 2
