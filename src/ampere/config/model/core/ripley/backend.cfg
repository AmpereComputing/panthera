cfg ../furiosa/backend.cfg

#### Structure sizing ####

# Array growth ECO
# ROB size expansion
idr.rob.size 208

# Physical register file sizes
idr.rf_int.size 166

idr.rf_flag.size 64

# no predicate registers
idr.rf_pred.size 0

# IXU/SCH size (must be multiple of sch_group_size)
~idr.sch.[ABM]_P[01].size 24

#### IDR ####

# Swizzle logic busted for 2-uop and 3-uop cases
idr.swizzle_table @swizzle.json

# Allow Instructions with two uops to be split across groups
idr.split_double_uop true

# Tweak swizzle logic to improve bcopy decode throughput
idr.bcopy_swizzle_tweak true

# Fusion delay of AES instructions
idr.fusion_aes_delay_ripley true

# Ping-pong scheduling of FP divider uops
idr.fdiv_ping_pong true

# Update pipe balancing threshold (and remove programmability) to help timing
idr.int_scheduler_assignment.first_balancing_threshold 7
idr.int_scheduler_assignment.second_balancing_threshold 8

idr.fp_scheduler_assignment.first_balancing_threshold 7
idr.fp_scheduler_assignment.second_balancing_threshold 8

#### IXU ####

# Reduce latency of early-exit integer divides
ixu.idiv_early_exit_latency 7

#### FSU ####

# Fast crypto bypass
idr.fast_crypto_bypass true

# Use both halves of the FP divider for scalar divides
~ixu.xu.[XY]_P[01].num_fp_dividers 2

# Reduce latency in FP divider early-exit cases
ixu.enable_fdiv_early_exit true
ixu.fdiv_early_exit_latency 7
ixu.fdiv_early_exit_rate 0

# Reduce Bu latency to all other units by 1 cycle (from 8 to 7)
# Allow FsuSi 3-cyc uops to local bypass to FsuSi as 2-cyc
# Fast crypto bypass also reduced Cu3 bypass to other units from 6 to 4
ixu.fsu_bypass @fsu_bypass.json

#### LSU ####

# Load which skips a store and misses L1 does not have to ST_ADDR sleep
lsu.skip_miss_proceeds true

# TLB fills don't block loads anymore
lsu.enable_tlb_fill_conflict false

# Single-uop stores don't recycle until data is ready
# Store data execution wakes only loads waiting for that specific store
#
# Unfortunately the change to prevent SUS recycling is broken:
#lsu.enable_sus_recycle false
lsu.specific_st_data_wake true

# Allow two simultaneous loads to the same cache line (no data chunk read conflict)
# Don't schedule loads which have a guaranteed conflict with an incoming (speculative) fill
lsu.duplicate_loads_allowed true
lsu.fill_conflict_blocks_schedule true

# A load with a data read conflict can still miss the L1 and allocate an OFB normally
lsu.read_conflict_can_miss true

# Combine adjacent stores to the same line to save power
lsu.combine_stores 1
lsu.delayed_retirement 1

# PCP improvements
lsu.prefetcher.pcp:override-cfg pcp.cfg

# Fix bug which made atomic stores wait for non-spec unnecessarily
lsu.atomic_stores_nonspec false

# Fix bug which made atomic loads and exclusive stores wait for non-spec unnecessarily
lsu.stores_with_dest_nonspec false

# Separate L1D access/refill PMU counts by prefetches and demand accesses
lsu.separate_l1d_prfm_pmus true

#### L2C ####

# Add FIFO for retiring stores between LSU and L2C to improve combining and save power
lsu_to_l2_store_request.capacity 4

# L2C fill buffer increase (per bank)
# Update 12/16/21: ECO rejected due to bad power-to-perf ratio
#~l2c\.banks\.fb_credits_[0-9]+\.size 8

# L2C: Change prefetch queue algorithm to favor higher-priority prefetches
l2c.prefetch_prq.prefetch_favor_high_priority true

# Clear prefetched bit in L2C line when it's hit by a demand load
l2c.prefetch_clear_on_hit true

# L2C barriers wait until evictions due to older stores are complete
l2c.fill_releases_barrier true

# L2 fill scheduling optimizations
l2c.first_half_fill_blocks_read false

# L2C prefetcher improvements
l2c.prefetcher:override-cfg l2c_prefetcher.cfg

# L2C PWC
l2c.pwc:override-cfg l2c_pwc.cfg
