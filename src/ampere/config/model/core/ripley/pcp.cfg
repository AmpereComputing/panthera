cfg ../furiosa/pcp.cfg

# Don't update stored stride on PCP transition to ACTIVE_LO
# Trigger a prefetch in ACTIVE_LO state (first stride mismatch) as well as ACTIVE_HI
update_stride_on_active_lo false
prefetch_in_active_lo true

# Fix bug in PCP duplicate prefetch removal
remove_dup true

# Fix bug which truncates offset to 14 bits
truncate_offset_bug false

# drop prefetches if training detects a stride of zero
drop_zero_stride_prefetches true
