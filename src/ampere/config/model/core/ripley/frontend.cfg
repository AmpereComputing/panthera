cfg ../furiosa/frontend.cfg
:cfg ripley-tage.cfg

#### BPU ####
# Note: This config file only contains BPU configs which do not also apply to
# bobcat (i.e. timing-specific things)

# Increase the BPU wakeup watermarks for the FEQ
bpu.feq_wake_threshold 10

# ITTAGE pipeline is delayed in Ripley vs. Furiosa for power
bpu.ittage_delay 2
bpu.ittage_rmw_delay 5
bpu.ittage_write_delay 3
bpu.stall_on_any_indirect true

#### ICF ####

# CP3 Instruction Prefetcher, filling only L2C, adjusting IFB size
# Removed from model for now since there were some implementation inaccuracies
# in the model and it has been removed from later designs - the latest panthera
# model shows a perf loss
#icf.prefetcher.type CP_None
#icf.spill_prefetch true
#icf.spill_upgraded_prefetch true
#icf.prefetch_capacity 2

# CP3: Distance is set to three by default to facilitate other CP studies
# icf.prefetcher.distance 3

# Reduce IFB size
~icf.ifb.credits_[0-1].size 8

# Don't fill the IQ until it has 16 entries free (power savings)
icf.fifo_free_watermark 16

# Save power by decreasing L1I$ reads
icf.enable_l0_cache true
icf.l0.ways 1
icf.l0.sets 1

#### IMMU ####

# Re-enable detection of duplicate translation requests in IMMU
immu.otb.combine_duplicates true
