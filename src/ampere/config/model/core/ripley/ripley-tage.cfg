# This file is used for Ripley Bobcat studies (in addition to being included
# for full core studies). When using with bobcat, specify with -top.core:cfg
#
# Here is a sample experiment config:
# [
#   {
#      "name": "base",
#      "exe": "{panthera_root}/bin/bobcat",
#      "parameters": [
#          "-quiet", "1",
#          "-top.core:cfg", "{panthera_root}/config/model/core/ripley/ripley-tage.cfg",
#          "-top.core.bpu.max_instructions", "200000",
#          "-csv", "{directory}/{job_name}.csv",
#          "-is", "{workload_path}"
#      ]
#    }
# ]

bpu:cfg "../furiosa/tage.cfg"
:cfg decode.cfg

# Include bit 5 in BTB hash
bpu.tage.btb.use_half_cache_line_bit_in_index true

# Tag BTB with EL (stealing 2 bits of the tag), tag ITTAGE with EL (using spare
# bits in array) to improve context separation for indirect branches
bpu.nnp.tag_bits 10
bpu.tage.btb.tag_bits 10
bpu.tage.btb.el_tagged true
~bpu.tage.iglobal_[0-9]+\.el_tagged true
