enable true

size 8
threshold 7
timeout 256
max_age 4096
partial_address_mask 0xffffffffffffffc0

# Combining rules
ordered_can_combine_with_youngest true
unordered_can_combine_with_ordered true
unordered_can_combine_with_previous_ordered 1
can_combine_with_oldest_during_drain true

# Write allocate
write_allocate false

# Forwarding
allow_forwarding true

store_requests.capacity 1
store_requests.latency 0

# 1 PWC + 1 fill
store_responses.bandwidth 2
