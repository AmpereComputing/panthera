# Make the L2 4MB with 13-cycle latency

# This is the whole physical L2, so there's no L3. Disable clean writebacks.
l2c.l2_write_back_clean false

~l2c.banks.bank_[0-9]+.ways 16
~l2c.banks.bank_[0-9]+.size 524288
