cfg ../connor/backend.cfg

#### Structure sizing ####

# Grow everything by 50% from Connor for now.
# These sizes will be refined later
idr.rob.size 384
idr.lob.size 132
idr.sob.size 72
idr.bob.size 108
idr.rf_int.size 330
idr.rf_fp.size 240
idr.rf_flag.size 96

#### IDR ####

# 6 lanes of decode and dispatch
machine_width 6
idr.uop_decode_width 6
idr.inst_read_width 12
dispatch.bandwidth 12
gpc_dispatch.bandwidth 12
idr_to_lsu_mem_rob_preview.bandwidth 12
instruction_fifo_credit_return.bandwidth 12
bob_alloc.bandwidth 6

# Allow more branches and cache lines within the same uop group
idr.align_branch_limit 4
idr.align_SIR_limit 4

# FIXME: use fake partition/pipe balancing until we have a real solution
idr.counter_balance false
idr.pipe_balancing false
idr.smart_least_loaded true
idr.cross_pipe true
idr.six_wide_dispatch true

# Add a cycle in the IDR pipeline to allow for 6-wide rename
idr.pipeline.rename.index 3

# Account BTC, BTB clear cycles towards STALL_FRONTEND_FLOW in preference of
# any potential MEMBOUND cycles that haven't yet missed the tlb/cache (IL1
# fetch latency)
idr.improved_flow_tda_alita true


#### IXU ####

# Bypass DR05 for integer uops whose sources are ready
ixu.sched_bypass_ixu true

# Add a new IXU pipe which can do AB uops
~idr.sch.K_P[01].size 28
idr.ab_uops_on_k_pipe true
ixu_width 8

# LUB (Load unordered buffer)
ixu.lub_size 16
# FIXME: remove once braindeads are fixed with wrongpath
ixu.reserved_lub_credits 1


#### FSU ####

# Four FSU pipes!
# Disable FSU scheduler bandwidth limits temporarily until code is fixed to understand 2 partitions
idr.fsu_partitions 2
idr.fsu_sch_bw_limit false

ixu.divide_radix 64

# Shave a front-end cycle off of fdiv when all input numbers are normal
# (not denormal).
ixu.fdiv_normal_numbers_optimization true

# Enable idiv early exit for +/-1 quotient when dividend is slightly
# bigger than or equal to the divisor.
ixu.idiv_early_out_plus_minus_one true

#### LSU ####

# Enable more load and store pipes
# FIXME: this is not properly modeling an L1 partitioned on even/odd lines
~idr.sch.N_P[01].size 28
idr.loads_on_e_pipe true
idr.stores_on_f_pipe true
~lsu\.?.*\.load_pipelines 4
lsu.store_pipes 6

# Maintains current 12 OTB entries
~dmmu.otb.sections.LSU_[0-3].size 2
dmmu.otb.sections.Shared.size 2

# Remove roadblocks to executing 4 loads
# FIXME: all of these things are temporary hacks that need to be solved for real
# NOTE: there are two gretch parameters in gretch.cfg which are part of this group
lsu.enable_read_read_chunk_conflicts false
lsu.enable_write_read_chunk_bank_conflicts false
lsu.enable_fill_read_chunk_bank_conflicts false

# Deallocate MLBs a cycle earlier
lsu.mlb_entry_release_pipe.latency 1

# Move HW Prefetches to "store" tag pipes
lsu.prefetch_uses_store_pipes true

# Improve atomics
lsu.atomic_load_speculative true
lsu.atomic_load_speculative_casp false
lsu.atomic_load_speculative_with_multiple_dest false

# LSU prefetcher improvements
lsu.prefetcher:override-cfg lsu_prefetcher.cfg

# POB Disabled When Gretch is Security-Disabled
lsu.pob.allocate_on_el0_only false

# Exit store forwarding walk early if all bytes found.
lsu.partial_fwd_early_exit true

# store forwarding enhancements
lsu.only_walk_stores_providing_new_bytes true
lsu.walk_partials_only true

# More precise raw scrub checking
lsu.raw_scrub_4b_mask_bug false
lsu.raw_scrub_granularity 1

# Loads always wait on older partial-match stores
# Stack loads wait on older unknown stack stores
lsu.always_wait_on_partial_match true
lsu.stack_load_wait true

# Prefetch fills don't use an exec pipe
lsu.prefetch_fills_execute false

# Put prefetches into the POB when the OFB is full
lsu.allocate_pob_on_ofb_full true

# Change DL1 set conflict from VA[13:7] to VA[12:6] to reduce conflicts
lsu.set_bank_mask 0x7f

# Cross-port swizzling so the oldest load gets DL1 port0 for reduced conflicts
lsu.older_load_gets_port0 true
lsu.fill_conflict_blocks_schedule false
lsu.fast_fill_conflict_port1 true
lsu.ld_fill_recycle_complete_pipe.latency 2
lsu.slow_write_conflict_port1 false
lsu.back_to_back_read_no_conflicts_self true

# Writeback L1d, but no write-allocate
lsu.store_write_to_l2_on_miss true
lsu.evict_modified_via_l2_pwc false

# Evictions take port 0
lsu.eviction_port 0

# Enable LSU PWC
lsu.pwc:cfg lsu_pwc.cfg
# Disable L2 PWC
l2c.pwc:override-cfg l2c_pwc.cfg

# This is temporary, to get more store retirement bandwidth until the
# LSU PWC supports 2 store retirements per cycle
lsu.store_retirement_width 32


#### GPC ####

# This is a placeholder as part of the 6-wide changes
gpc.uop_retire_width 8


#### L2C ####

# L2 is 3MB, 12-way, 8-bank private (13-cycle latency)
:cfg L2-3mb-private.cfg

# Placeholder for the redesign of L2 requests, which will enable lots more fill buffers
~l2c.banks.fb_credits_[0-9]+.size 16
l2c.cbusy.throttle_max 128

# Bank hash will use only address[11:6] to avoid evict/fill/snoop conflicts
l2c.banks.high_bank_hash_bit 11

# Train BOP on all fill buffer hits
l2c.prefetch_all_fb_hits true

# BOP operates on virtual addresses, sending page-crossing addresses to LSU for translation
l2_to_lsu_va_prefetch.bandwidth 4

# *_DEALLOC ops no longer interact with L2c array and can schedule very opportunistically
# Also increase snoop BW to LSU to cover an extremely rare collision between external snoop and eviction snoop
l2c.sys_pipe_dealloc true
l2_to_lsu_snoop_request.bandwidth 2

# L2 BOP adjustments
l2c.prefetcher:override-cfg l2c_prefetcher.cfg
