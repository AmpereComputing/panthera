# This file is used for Alita Bobcat studies (in addition to being included
# for full core studies). When using with bobcat, specify with -top.core:cfg
#
# Here is a sample experiment config:
# [
#   {
#      "name": "base",
#      "exe": "{panthera_root}/bin/bobcat",
#      "parameters": [
#          "-quiet", "1",
#          "-top.core:cfg", "{panthera_root}/config/model/core/alita/alita-tage.cfg",
#          "-top.core.bpu.max_instructions", "200000",
#          "-csv", "{directory}/{job_name}.csv",
#          "-is", "{workload_path}"
#      ]
#    }
# ]

cfg "../connor/connor-tage.cfg"
:cfg "decode.cfg"

# Split BTB/TAGE/bimodals into 4 banks each
bpu.bank_bits 2

# Enable the NNPP and NNNP for the second prediction each cycle
bpu.nnpp.sets 64
bpu.nnpp.ways 1
bpu.nnpp.tag_bits 10
bpu.nnpp.bottom_set_bit 4
bpu.nnpp.allocate_useful false
bpu.nnpp.update_hit_before_victim true

bpu.nnnp.act_as_nnnp true
bpu.nnnp.sets 128
bpu.nnnp.ways 4
bpu.nnnp.tag_bits 10
bpu.nnnp.allocate_useful false
bpu.nnnp.update_hit_before_victim true
