# Make the L2 6MB with 15-cycle latency

# Shared cache has 16 banks. This also doubles the number of FBs, which is intended.
l2c.num_banks 16
l2c.cbusy.throttle_max 256

~l2c.banks.bank_[0-9]+.ways 12
~l2c.banks.bank_[0-9]+.size 393216

# 2-cycle penalty for the larger cache (15 cycles load-to-use)
lsu_to_l2_load_response.latency 4
l2_to_dmmu_response.latency 5
icf_to_l2_response.latency 4
lsu.snoop_exclusion_window 5
