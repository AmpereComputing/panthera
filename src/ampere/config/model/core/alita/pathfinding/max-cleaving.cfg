#
# Use in addition to (and after, on the command line) the existing Alita config
# to enable lots of cleaving.
#
# Usage:
# "-sys.soc_0.core_0:append-cfg {panthera_root}/config/model/core/alita/pathfinding/max-cleaving.cfg",
#

# Some of the options below break the existing pipe assignment algorithms, so
# we have to turn them off and just assign all uops to the least-loaded scheduler
#
# !!!!!!!!
# NOTE: use these options in your baseline when doing a comparison with this config
# !!!!!!!!
#
idr.pipe_balancing false
idr.smart_least_loaded true

# These require that the ROB be able to commit half of a cleaved pair, and flush the second half
gpc.allow_partial_cleaving true
idr.cleaving_allow_branch_first true
idr.cleaving_allow_fault_second true

# Remove lots of other restrictions on what uops are allowed to cleave
idr.cleaving_allow_two_vecdst true
idr.cleaving_allow_two_flgdst true
idr.cleaving_allow_same_sched true
idr.cleaving_no_src_restrictions true
idr.cleaving_fsu_limit 2
idr.cleaving_allow_fused true
idr.cleaving_allow_super_sus true
idr.cleaving_max_srcs 4
idr.cleaving_allow_move_first true
idr.cleaving_allow_move_second true
