#
# Baseline knobs which work around pieces of the uarch that
# don't yet work with more schedulers/pipes. This should be included
# when using any params which enable the J or K pipes.
#

# Fake partition/pipe balancing
idr.pipe_balancing false
idr.smart_least_loaded true
idr.cross_pipe true

# Enable new schedulers
~idr.sch.[JK]_P[01].size 28
