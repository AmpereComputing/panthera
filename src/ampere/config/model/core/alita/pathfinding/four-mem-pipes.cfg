# Enable more load and store pipes
~idr.sch.N_P[01].size 28
idr.loads_on_e_pipe true
idr.stores_on_f_pipe true
~lsu\.?.*\.load_pipelines 4
lsu.store_pipes 6

# Remove roadblocks to executing 4 loads
lsu.prefetcher.gretch.commit_bw 4
lsu.prefetcher.gretch.ld_commit_pipe.bandwidth 4
lsu.enable_read_read_chunk_conflicts false
lsu.enable_write_read_chunk_bank_conflicts false
lsu.enable_fill_read_chunk_bank_conflicts false
dmmu.otb.sectioned false
dmmu.allocation_fairness false
