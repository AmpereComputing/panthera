cfg ../connor/frontend.cfg
:cfg "../alita/alita-tage.cfg"

# Un-block commit/update for now, we plan to add in more realistic modeling
# later, but want to un-block this for initial studies
bpu.allow_merging_all_updates true
bpu.commits_per_cycle 4

# Widen the prediction pipeline to two-wide. Note that for now this does not
# take into account any banking or bank conflicts at all, so it is likely a
# little optimistic.
bpu.prediction_late_ittage.width 2

# Update the sleep threshold from 1 to 2 FEQ entries short of a full FEQ since
# we return that many each cycle.
bpu.feq_sleep_threshold 2

# Increase the ICF->BPU bandwidth to 2/cycle
bpu_to_icf_fetch_fifo.bandwidth 2

# Parallel eviction can currently result in two snoops per cycle
l2_to_icf_snoop_request.bandwidth 2

# 4-entry IFB victim cache
icf.use_ifb_victim_cache true
icf.ifb_victim_cache.num_entries 4

# Perform up to two ITLB and icache lookups per cycle
icf.tag_pipeline.width 2
icf.data_pipeline.width 2
icf.icache_bank_bits 1

# Allow IQ write of up to 16 instructions per cycle. Allow writing two fetches
# per cycle if the sum of the two fetches' instructions are <= 16.
icf.iq_write_max_instrs 16
icf.split_fetches_across_cycles false

# Increase IQ to 64 entries
icf.instruction_fifo.size 64
