:cfg ../connor/gretch.cfg

# Drop gretch prefetches are out-of-bounds of EL0 or nullptr
drop_nullptr true
max_address_range 48

# Throttle LOB deallocation to improve gretch training
guaranteed_training true
ld_commit_pipe.bandwidth 2

# Remove roadblocks to executing 4 loads
# FIXME: all of these things are temporary hacks that need to be solved for real
commit_bw 4
ld_commit_pipe.bandwidth 4
