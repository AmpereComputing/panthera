cfg connor-ai.cfg

# This config is for measuring EL1 performance. User code will get all its data from TMEM,
# which does not fill the L2 and will be mapped using a handful of large pages. We mimic
# that by making the L1 DTLB and the L2 perfect for user-mode addresses, so that EL1 has
# the L2 and TLB all to itself.
#
# Use this with a study list containing both EL0 and EL1 workloads, then inspect
# the ipc_el1 metric.
#
lsu.dl1tlb.enable_perfect_mode_user true
l2c.enable_perfect_mode_user true

# Branch predict perfectly for EL0 code
bpu.perfect_el0 true
bpu.tage.rsb.ignore_untracked_commits true
