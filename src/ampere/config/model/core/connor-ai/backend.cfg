cfg ../connor/backend.cfg

#### AREA SAVINGS ####

#### IDR ####
# Reduced BE resources
idr.bob.size 54
idr.lob.size 64
idr.sob.size 42
idr.rob.size 192
idr.rf_int.size 166

#### LSU ####
# 32k DL1, with the set conflict moved to the MSB of the set index
lsu.l1d_cache.size 32768
lsu.set_bank_mask 0x3f

# 32 entry L1 TLB
lsu.dl1tlb.ways 32

#### MMU ####
# L2TLB 2560->512 (128x4), S1TPC 16->4, walk FSMs 2->1, OTB entries 12->8
dmmu.tlb.sets 128
dmmu.tlb.ways 4
dmmu.s1tpc.ways 4
dmmu.walk_fsms.size 1

dmmu.otb.entries 8
dmmu.otb.sections.Shared.size 2

#### L2C ####

# Reduce the L2 to 512KB (1K sets, 8 ways)
~l2c.banks.bank_[0-9]+.ways 8
~l2c.banks.bank_[0-9]+.size 65536

# Since there's no L3, all the cache is used as L2, and we shouldn't write back clean evictions
l2c.l2_write_back_clean false

# Reduce FBs to 48
# With no L3, there are no stashes, and the adaptive reservation mechanism
# will make allfill buffers available for core use
~l2c.banks.fb_credits_[0-9]+.size 6
l2c.cbusy.throttle_max 48


#### PERFORMANCE ####

#### IDR ####

# Better balancing of Z-pipe uops across X and Y schedulers
idr.fp_scheduler_assignment.type BinaryPingPongIDRSchedulerAssignment
idr.fp_scheduler_assignment.ping_pong_pipe Z

#### FSU ####

# FRECPE late bypass
ixu.fsu_bypass @fsu_bypass.json

#### LSU ####

# Grow OFB to cover TMEM latency
lsu.ofb.entries 32

# Move HW Prefetches to store pipes
lsu.prefetch_uses_store_pipes true

# Prefetch fills don't use an exec pipe
lsu.prefetch_fills_execute false

# Put prefetches into the POB when the OFB is full
lsu.allocate_pob_on_ofb_full true

# POB Disabled When Gretch is Security-Disabled
lsu.pob.allocate_on_el0_only false

# Prefetcher adjustments and improvements
lsu.prefetcher:override-cfg lsu_prefetcher.cfg

# Cross-port swizzling so the oldest load gets DL1 port0 for reduced conflicts
lsu.older_load_gets_port0 true
lsu.fill_conflict_blocks_schedule false
lsu.fast_fill_conflict_port1 true
lsu.ld_fill_recycle_complete_pipe.latency 2
lsu.slow_write_conflict_port1 false
lsu.back_to_back_read_no_conflicts_self true

#### FSU ####

# Grow FSU schedulers from 26 to 32 entries
~idr.sch.[XY]_P[01].size 32
