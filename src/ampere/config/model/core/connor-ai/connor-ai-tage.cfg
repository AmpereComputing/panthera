# This file is used for Connor-AI Bobcat studies (in addition to being included
# for full core studies). When using with bobcat, specify with -top.core:cfg
#
# Here is a sample experiment config:
# [
#   {
#      "name": "base",
#      "exe": "{panthera_root}/bin/bobcat",
#      "parameters": [
#          "-quiet", "1",
#          "-top.core:cfg", "{panthera_root}/config/model/core/connor-ai/connor-ai-tage.cfg",
#          "-top.core.bpu.max_instructions", "200000",
#          "-csv", "{directory}/{job_name}.csv",
#          "-is", "{workload_path}"
#      ]
#    }
# ]

cfg "../connor/connor-tage.cfg"
:cfg "decode.cfg"

# Smaller BPU
bpu.np.sets 8
bpu.nnp.sets 16
bpu.tage.btb.ways 8
bpu.tage.btb.sets 128
bpu.tage.global_sets 64
bpu.tage.bi_modal.sets 256
bpu.tage.iglobal_sets 4
