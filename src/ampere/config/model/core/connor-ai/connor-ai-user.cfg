cfg connor-ai.cfg

# This config is for measuring AIO code. All data will come from TMEM, which we model
# with a perfect L1 DTLB and an anti-perfect L2 with very low memory latency

lsu.dl1tlb.enable_perfect_mode true

# Enable perfect L2-TLB: In silicon, the L2 TLB is expected be in a perpetual "warmed-up" state
dmmu.tlb.enable_perfect_mode true

# never_fill -- data return does not fill (so no hits or evictions)
# always_nns_memtype -- all requests assume Normal Non-Shareable memtype (writes complete with READ_DEALLOC instead of FILL)
l2c.never_fill true
l2c.always_nns_memtype true
l2c.prefetcher:override-cfg ../l2c_prefetchers/none.cfg

# TMEM "fills" only occupy the bank for 2 cycles since they're not actually writing data
l2c.bank_write_busy_mask 0x3

# TMEM reads are guaranteed to miss the L2 so there's no need to send a speculative wake to LSU
lsu.fill_speculative_wake false
