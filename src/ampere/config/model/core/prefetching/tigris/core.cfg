instructions_per_cycle 4

# L1i cache
top.memory.l1i.cache.cache_replacement_policy.type IL1LRU
top.memory.l1i.cache.crp_victim_always true
top.memory.l1i.cache.size 32768
top.memory.l1i.cache.ways 4
top.memory.l1i.cache.line_size 64

top.memory.l1i.outstanding 8
top.memory.l1i.incoming_per_cycle 2
top.memory.l1i.fill_latency 12
top.memory.l1i.request_latency 1

top.memory.l1i.prefetcher.type L2P_None

# L1d cache
top.memory.l1d.cache.size 65536
top.memory.l1d.cache.ways 4
top.memory.l1d.cache.line_size 64
top.memory.l1d.outstanding 12
top.memory.l1d.incoming_per_cycle 2
top.memory.l1d.fill_latency 12
top.memory.l1d.request_latency 1
top.memory.l1d.fill_stores false
top.memory.l1d.write_through true

top.memory.l1d.prefetcher.type L1P_None
top.memory.l1d.drop_prefetches_on_fill_resources true

top.memory.l2.warmup true

# L2 cache
top.memory.l2.cache.cache_replacement_policy.type RRIP
top.memory.l2.cache.cache_replacement_policy.rrip_max 3
top.memory.l2.cache.cache_replacement_policy.insert_delta 1

top.memory.l2.cache.size 2621440
top.memory.l2.cache.ways 10
top.memory.l2.cache.line_size 64

top.memory.l2.fill_latency 32
top.memory.l2.outstanding 48
top.memory.l2.incoming_per_cycle 2
top.memory.l2.request_latency 1

top.memory.l2.prefetcher.type L2P_None
top.memory.l2.drop_prefetches_on_fill_resources true

top.reorder_amount 1.3
top.reorder_probability 0.005

top.requests_per_cycle 2
top.code_requests_per_cycle 4
top.request_depth 64
top.commit_depth 256
top.wait_for_load_response true
top.wait_for_store_response false
