:cfg core.cfg

top.memory.l1d.prefetcher.type L1P_PCP
#TODO fix this and make it modular
#top.memory.l1d.prefetcher:cfg "../../trinity/pcp.cfg"

# PCP table size increase to 128, since 256 doesn't seem feasible
top.memory.l1d.prefetcher.table.line_size 4
top.memory.l1d.prefetcher.table.sets 128
top.memory.l1d.prefetcher.table.ways 1
# PCP increased stride range
top.memory.l1d.prefetcher.addr_mask 0x1fff8
# remove duplicate requests
top.memory.l1d.prefetcher.remove_dup false
# aggressive max stride
top.memory.l1d.prefetcher.stride_mult_max 16
top.memory.l1d.prefetcher.truncate_offset_bug true
# generate prefetches even if training detects a stride of zero
top.memory.l1d.prefetcher.drop_zero_stride_prefetches false
# PCP usage of LSU's OFB entries for prefetch
top.memory.l1d.prefetcher.page_fetch true

# Prefetches to TTBR1 space will get dropped because VA is always zero-extended
top.memory.l1d.prefetcher.upper_va_bits_bug true

top.memory.l1d.prefetcher.pipe.bandwidth 2
top.memory.l1d.prefetcher.pipe.latency 4

top.memory.l1d.prefetcher.recycle_tlb_miss true
top.memory.l1d.prefetcher.ignore_other_loads_in_instruction true
top.memory.l1d.prefetcher.out_of_order_stride_match true
top.memory.l1d.prefetcher.upper_va_bits_bug false

top.memory.l2.prefetcher:cfg "../../trinity/l2c_prefetcher.cfg"
