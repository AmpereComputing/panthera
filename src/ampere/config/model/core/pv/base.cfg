# BPU
bpu.enable_per_cycle_pmu true

# IDR/ICF
speculative_memory_image true
icf.enable_per_cycle_pmu true
idr.enable_per_cycle_pmu true
idr.resource_stats_detailed true

# LSU
lsu.enable_per_cycle_pmu true
dmmu.enable_per_cycle_pmu true

# LSU prefetchers
lsu.prefetcher.pcp:append-cfg debug_pcp.cfg

# L2
l2c.enable_per_cycle_pmu true

# GPC
gpc.heartbeat 5000
