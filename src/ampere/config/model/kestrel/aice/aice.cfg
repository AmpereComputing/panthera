top.clock_period 500ps

top.fetch.decoder.size 2

type.decode.supercell_latency_int 1
type.decode.supercell_latency_fp 4

# MOVB, MATMULA, LOADIMR, STOREAMR, STOREIMR have special computed times
top.decode.instruction_latencies [
    ["UNDEFINED", 0],
    ["ADD", 1],
    ["SUB", 1],
    ["MUL", 2],
    ["LSHIFT", 1],
    ["RASHIFT", 1],
    ["ADDI", 1],
    ["MULI", 2],
    ["LSHIFTI", 1],
    ["RASHIFTI", 1],
    ["BLT", 1],
    ["BGE", 1],
    ["BIR", 1],
    ["CSELGTZ", 1],
    ["CSELZ", 1],
    ["DEBUG", 1],
    ["SYNCHALT", 1],
    ["SYNCREADDONE", 1],
    ["SYNCWAIT", 1],
    ["SYNCWRITEDONE", 1],
    ["RESTARTABLE", 1]
]


top.memory.tmem_latency 9
top.memory.tmem_store_resp_latency 6

# 4+32+7=4+39 = 43
top.execute.amr_max_write_cycles 43 
